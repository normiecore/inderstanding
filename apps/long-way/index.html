function renderMap(){
  if (!state.startDate) ui.sel = ui.sel || 1;
  const cur = maxOpened();
  const sel = ui.sel || cur || 1;
  const list = STATIONS.map((s,i) => {
    const n = i+1, sts = status(n), rep = state.reports[n];
    const sw = sts === 'locked' ? 'locked' : sts === 'open' ? 'today' : rep.shift === 'yes' ? 'yes' : rep.shift === 'little' ? 'little' : '';
    const label = sts === 'locked' ? `${esc(regionOf(n).name)}, not reached yet`
      : `<button type="button" class="linkish" data-action="sel" data-st="${n}">${esc(s.term)}</button> <span class="muted">${esc(s.fam)}${sts === 'open' ? ', today' : ', shifted: ' + SHIFT_NAME[rep.shift].toLowerCase()}</span>`;
    return `<li><span class="mono">${two(n)}</span><span class="sw ${sw}" aria-hidden="true"></span><span>${label}</span></li>`;
  }).join('');
  return `<div class="view-head"><h1 id="map-h" tabindex="-1">The trail</h1><span class="mono muted">${Object.keys(state.reports).length} of 40 walked</span></div>
    <p class="lede">Forty stations through six stretches. The solid line is the way you have walked; the dashes are footpath still ahead. Select a walked station to see its practice and your report.</p>
    <ul class="legend" aria-label="Map key">
      <li><span class="sw" aria-hidden="true"></span>Walked</li>
      <li><span class="sw yes" aria-hidden="true"></span>Shifted something</li>
      <li><span class="sw little" aria-hidden="true"></span>Shifted a little</li>
      <li><span class="sw today" aria-hidden="true"></span>Today</li>
      <li><span class="sw locked" aria-hidden="true"></span>Not reached yet</li>
    </ul>
    <div class="map-grid">
      <div class="map-frame">${mapSVG()}</div>
      <div class="map-detail" id="map-detail" aria-live="polite">${detailHTML(sel)}</div>
    </div>
    <details class="map-list panel"><summary>All stations as a list</summary><ol>${list}</ol></details>`;
}

/* ---------- What moved you ---------- */
function groupBy(nums, keyFn){
  const g = {};
  nums.forEach(n => { const k = keyFn(n); (g[k] = g[k] || []).push(n); });
  return Object.entries(g).sort((a,b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
}
function chip(n){
  const r = state.reports[n];
  return `<button type="button" class="chip" data-action="goto-st" data-st="${n}" aria-label="Station ${n}, ${esc(st(n).term)}, shifted: ${SHIFT_NAME[r.shift]}. Open on the map"><span class="sw ${r.shift === 'yes' ? 'yes' : r.shift === 'little' ? 'little' : ''}" aria-hidden="true"></span><i>${esc(st(n).term)}</i><span class="mono muted">${two(n)}</span></button>`;
}
function groupList(groups, nameFn){
  return `<ul class="group-list">${groups.map(([k, ns]) => {
    const y = ns.filter(n => state.reports[n].shift === 'yes').length, l = ns.length - y;
    return `<li><span class="g-name">${esc(nameFn(k))}</span><span class="g-count">${ns.length}<span class="muted" style="font-weight:400">(${[y ? y + ' yes' : '', l ? l + ' a little' : ''].filter(Boolean).join(', ')})</span></span><span class="g-items">${ns.map(chip).join('')}</span></li>`;
  }).join('')}</ul>`;
}
function renderMoved(){
  const done = Object.keys(state.reports).map(Number).sort((a,b) => a-b);
  const moved = done.filter(n => state.reports[n].shift !== 'no');
  const notMoved = done.filter(n => state.reports[n].shift === 'no');
  const yes = moved.filter(n => state.reports[n].shift === 'yes').length;
  const head = `<div class="view-head"><h1 id="moved-h" tabindex="-1">What moved you${exTag(state.example)}</h1></div>
    <p class="lede">The practices you said shifted something, sorted two ways: by the tradition they come from, and by the kind of practice. Plain counts from your own reports; nothing is scored.</p>`;
  if (!done.length){
    return head + `<div class="panel" style="margin-top:16px"><h2>Nothing here yet</h2><p class="hint">After your first evening report, the practices that shifted something will gather here, along with the ones that didn’t.</p></div>`;
  }
  return head + `<div class="tally" aria-label="Totals">
      <span><b>${done.length}</b>evening ${done.length === 1 ? 'report' : 'reports'}.</span>
      <span class="tally-q"><span>Did it shift anything?</span> <span><b>${yes}</b>Yes</span> <span><b>${moved.length - yes}</b>A little</span> <span><b>${notMoved.length}</b>No</span></span>
    </div>
    ${moved.length ? `<div class="moved-grid">
      <section class="panel" aria-labelledby="by-trad"><h2 id="by-trad">By tradition</h2>${groupList(groupBy(moved, n => st(n).fam), k => k)}</section>
      <section class="panel" aria-labelledby="by-type"><h2 id="by-type">By kind of practice</h2>${groupList(groupBy(moved, n => st(n).type), k => TYPE_NAME[k])}</section>
    </div>` : `<div class="panel" style="margin-top:16px"><p>None of your reports so far say a practice shifted anything. That is information too.</p></div>`}
    ${notMoved.length ? `<section class="panel" style="margin-top:20px" aria-labelledby="not-moved"><h2 id="not-moved">Didn’t shift anything</h2>
      <p class="hint">Worth keeping in view. Knowing what doesn’t reach you is part of knowing what does.</p>
      <div class="g-items" style="margin-top:8px">${notMoved.map(chip).join('')}</div></section>` : ''}
    <p class="ask"><strong>A question to sit with:</strong> is what moved you about the tradition, or about the kind of practice? The two lists above may not agree.</p>`;
}

/* ---------- Your Rule ---------- */
function ruleReadHTML(){
  if (!state.rule.length) return '<p class="hint">Your Rule will read here once it has a line.</p>';
  return FREQS.map(([f, name]) => {
    const ls = state.rule.filter(l => l.freq === f && l.text.trim());
    return ls.length ? `<h3>${name}</h3><ol>${ls.map(l => `<li>${esc(l.text)}</li>`).join('')}</ol>` : '';
  }).join('');
}
function renderRule(){
  const dismissed = state.ruleDismissed.filter(n => state.reports[n] && state.reports[n].again && !state.rule.some(l => l.station === n));
  const lines = state.rule.map((l,i) => {
    const s = l.station ? st(l.station) : null;
    return `<li class="rule-line" data-id="${l.id}">
      <span class="rl-num" aria-hidden="true">${ROMAN[i] || i+1}</span>
      <div>
        <label class="vh" for="rule-text-${l.id}">Line ${i+1} of your Rule</label>
        <textarea class="rl-text" id="rule-text-${l.id}" data-id="${l.id}" rows="1" maxlength="500" placeholder="Write the practice in your own words">${esc(l.text)}</textarea>
        <div class="rl-meta">
          <label for="rule-freq-${l.id}">How often</label>
          <select id="rule-freq-${l.id}" data-id="${l.id}" class="rl-freq">${FREQS.map(([v,nm]) => `<option value="${v}"${l.freq === v ? ' selected' : ''}>${nm}</option>`).join('')}</select>
          <span>${s ? `From station ${l.station}, <i>${esc(s.term)}</i> (${esc(s.fam)})` : 'Your own line'}</span>
          ${s && !l.edited ? '<span class="tag sugg">Suggested wording</span>' : ''}${exTag(l.example)}
        </div>
      </div>
      <div class="rl-actions">
        <button type="button" class="btn small quiet" data-action="rule-up" data-id="${l.id}" id="rule-up-${l.id}"${i === 0 ? ' disabled' : ''}>Move up</button>
        <button type="button" class="btn small quiet" data-action="rule-down" data-id="${l.id}" id="rule-down-${l.id}"${i === state.rule.length-1 ? ' disabled' : ''}>Move down</button>
        <button type="button" class="btn small danger" data-action="rule-remove" data-id="${l.id}" id="rule-remove-${l.id}">Remove</button>
      </div>
    </li>`;
  }).join('');
  return `<div class="view-head"><h1 id="rule-h" tabindex="-1">Your Rule</h1><span class="mono muted">Draft · ${state.rule.length} ${state.rule.length === 1 ? 'line' : 'lines'}</span></div>
    <p class="lede">A rule of life is a short set of practices a person commits to. The best known is the Rule of St Benedict (sixth century), written for monks living together; Benedict called it a little rule for beginners. This draft is built from the practices you said you would do again. Rewrite each line in your own words, say how often, and cut what doesn’t belong.</p>
    <div class="rule-grid">
      <div>
        ${state.rule.length ? `<ol class="rule-list">${lines}</ol>` : `<div class="panel"><h2>No lines yet</h2><p class="hint">When you answer “Yes” to “Would you do this again?” in an evening report, that practice is drafted here.</p></div>`}
        <div class="btn-row"><button type="button" class="btn" data-action="rule-add" id="rule-add">Add a line of your own</button></div>
        ${dismissed.length ? `<div class="panel" style="margin-top:18px"><h2>Taken out</h2><p class="hint">You said you would do these again but removed them from the draft.</p>
          <div class="btn-row">${dismissed.map(n => `<button type="button" class="btn small quiet" data-action="rule-restore" data-st="${n}" id="rule-restore-${n}">Put back station ${n}: ${esc(st(n).term)}</button>`).join('')}</div></div>` : ''}
      </div>
      <aside class="rule-read" aria-labelledby="rule-read-h">
        <h2 id="rule-read-h">The Rule, read through</h2>
        <p class="hint">How it reads as a whole, sorted by how often.</p>
        <div id="rule-read">${ruleReadHTML()}</div>
      </aside>
    </div>`;
}

/* ---------- render ---------- */
const app = document.getElementById('app');
const VIEWS = {today:renderToday, map:renderMap, moved:renderMoved, rule:renderRule, settings:renderSettings};
const reduceMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } };

function render(){
  Object.keys(VIEWS).forEach(v => {
    const sec = document.getElementById('view-' + v), tab = document.getElementById('tab-' + v);
    if (v === ui.view){ sec.hidden = false; sec.innerHTML = VIEWS[v](); tab.setAttribute('aria-current','page'); }
    else { sec.hidden = true; sec.innerHTML = ''; tab.removeAttribute('aria-current'); }
  });
  document.querySelectorAll('.rl-text').forEach(autoGrow);
  document.getElementById('example-bar').hidden = !state.example;
  const clock = document.getElementById('demo-clock');
  clock.hidden = !state.dayOffset;
  clock.textContent = state.dayOffset ? 'Demo clock +' + state.dayOffset + (state.dayOffset === 1 ? ' day' : ' days') : '';
  if (ui.focus){
    const el = document.getElementById(ui.focus); ui.focus = null;
    if (el){ try { el.focus({preventScroll:true}); } catch(e){ el.focus(); } }
  }
}
function autoGrow(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 4) + 'px'; }
window.addEventListener('resize', () => document.querySelectorAll('.rl-text').forEach(autoGrow));
function go(view, focusId){ ui.view = view; ui.editing = null; ui.eraseStep = 0; ui.msg = {}; ui.focus = focusId || null; render(); }
function scrollToEl(el){ if (el && el.scrollIntoView) el.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'}); }

/* ---------- actions ---------- */
function selectStation(n, fromMap){
  ui.sel = n; ui.editing = null;
  render();
  const g = document.getElementById('stn-' + n);
  if (fromMap && g){ try { g.focus({preventScroll:true}); } catch(e){} }
  const d = document.getElementById('map-detail');
  if (d && window.innerWidth < 900){
    const r = d.getBoundingClientRect();
    if (r.top > window.innerHeight || r.bottom < 0) scrollToEl(d);
  }
}

const actions = {
  view(b){ go(b.dataset.view); if (b.classList.contains('tab')) b.focus(); else { const h = document.querySelector('#view-' + ui.view + ' h1'); if (h) h.focus(); } window.scrollTo(0,0); },
  sel(b){ selectStation(+b.dataset.st, b.classList.contains('stn')); },
  'goto-st'(b){ ui.view = 'map'; ui.msg = {}; selectStation(+b.dataset.st); const d = document.getElementById('map-detail'); scrollToEl(d); const h = document.getElementById('detail-h') || document.getElementById('det-title'); if (h){ h.setAttribute('tabindex','-1'); try { h.focus({preventScroll:true}); } catch(e){} } },
  'back-to-map'(b){ const g = document.getElementById('stn-' + b.dataset.st); if (g){ g.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'center'}); try { g.focus({preventScroll:true}); } catch(e){} } },
  'edit-report'(b){ ui.editing = +b.dataset.st; ui.msg = {}; ui.focus = ui.view === 'today' ? 'rep-text' : 'edit-text'; render(); },
  'cancel-edit'(){ ui.editing = null; ui.msg = {}; ui.focus = ui.view === 'today' ? 'rep-h' : 'detail-h'; render(); },
  'clear-examples'(){ state = blank(); ui.sel = null; save(); go('today', 'today-h'); window.scrollTo(0,0); },
  'start-today'(){ state.startDate = today(); advance(); save(); go('today', 'today-h'); },
  'change-start'(){ state.startDate = null; state.opened = {}; save(); go('today', 'start-date'); },
  'demo-next'(){
    const before = maxOpened();
    state.dayOffset = (state.dayOffset || 0) + 1;
    const opened = advance();
    save();
    const d = fmt(today(), true), n = maxOpened();
    let m;
    if (!state.startDate) m = `Moved the pretend clock to ${d}. There is no walk yet; start one on the Today page.`;
    else if (opened) m = `Moved the pretend clock to ${d}. Station ${n} (${regionOf(n).name}) is now open on the Today page.`;
    else if (!state.opened[1]) m = `Moved the pretend clock to ${d}. The walk starts on ${fmt(state.startDate, true)}.`;
    else if (n >= 40 && state.reports[40]) m = `Moved the pretend clock to ${d}. All forty stations are walked.`;
    else if (!state.reports[before]) m = `Moved the pretend clock to ${d}. Station ${before} has no evening report yet, so the path waits and nothing new opens. Report it on the Today page, then try again.`;
    else m = `Moved the pretend clock to ${d}.`;
    ui.msg = {demo:m}; ui.focus = 'demo-next'; render();
  },
  'demo-reset'(){ state.dayOffset = 0; save(); ui.msg = {demo:'Back on the real date. Stations already open stay open.'}; ui.focus = 'demo-next'; render(); },
  'export-show'(){ ui.exportOpen = true; ui.msg = {}; ui.focus = 'export-text'; render(); const t = document.getElementById('export-text'); if (t) t.select(); },
  'export-hide'(){ ui.exportOpen = false; ui.msg = {}; ui.focus = 'export-show'; render(); },
  'export-copy'(){
    const t = document.getElementById('export-text'), msg = document.getElementById('export-msg');
    const fallback = () => { t.focus(); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(e){} msg.textContent = ok ? 'Copied.' : 'Couldn’t copy automatically. The text is selected: press Ctrl+C (or Cmd+C) to copy it.'; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t.value).then(() => { msg.textContent = 'Copied to the clipboard.'; }, fallback);
      } else fallback();
    } catch(e){ fallback(); }
  },
  'import-do'(){
    const raw = (document.getElementById('import-text').value || '').trim();
    let s = null;
    if (!raw){ ui.msg = {import:'Paste some exported JSON first.'}; ui.focus = 'import-text'; return render(); }
    try { s = normalize(JSON.parse(raw)); } catch(e){ s = null; }
    if (!s){ ui.msg = {import:'That doesn’t look like data from The Long Way, so nothing was changed.'}; ui.focus = 'import-text'; return render(); }
    state = s; advance(); save(); ui.sel = null;
    ui.msg = {import:`Imported. ${Object.keys(state.reports).length} evening reports and ${state.rule.length} Rule lines.`, importOk:true};
    ui.focus = 'import-do'; render();
  },
  'erase-1'(){ ui.eraseStep = 1; ui.msg = {}; ui.focus = 'erase-no'; render(); },
  'erase-no'(){ ui.eraseStep = 0; ui.focus = 'erase-1'; render(); },
  'erase-yes'(){ try { localStorage.removeItem(KEY); } catch(e){} state = blank(); save(); ui.eraseStep = 0; ui.sel = null; ui.exportOpen = false;
    ui.msg = {erase:'Erased. Nothing from your walk is kept on this device now.'}; ui.focus = 'erase-1'; render(); },
  'rule-up'(b){ moveLine(b.dataset.id, -1); },
  'rule-down'(b){ moveLine(b.dataset.id, 1); },
  'rule-remove'(b){
    const i = state.rule.findIndex(l => l.id === b.dataset.id); if (i < 0) return;
    const [l] = state.rule.splice(i,1);
    if (l.station && !state.ruleDismissed.includes(l.station)) state.ruleDismissed.push(l.station);
    save();
    const nxt = state.rule[i] || state.rule[i-1];
    ui.focus = nxt ? 'rule-text-' + nxt.id : 'rule-add'; render();
  },
  'rule-restore'(b){
    const n = +b.dataset.st;
    state.ruleDismissed = state.ruleDismissed.filter(x => x !== n);
    syncRule(n); save();
    const l = state.rule.find(x => x.station === n);
    ui.focus = l ? 'rule-text-' + l.id : 'rule-add'; render();
  },
  'rule-add'(){
    const l = {id:'r' + (state.seq++), station:null, text:'', freq:'daily', edited:true, example:false};
    state.rule.push(l); save(); ui.focus = 'rule-text-' + l.id; render();
  }
};
function moveLine(id, dir){
  const i = state.rule.findIndex(l => l.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= state.rule.length) return;
  const t = state.rule[i]; state.rule[i] = state.rule[j]; state.rule[j] = t;
  save();
  const btn = 'rule-' + (dir < 0 ? 'up' : 'down') + '-' + id;
  const canStay = dir < 0 ? j > 0 : j < state.rule.length - 1;
  ui.focus = canStay ? btn : 'rule-text-' + id;
  render();
}

function saveReport(form){
  const n = +form.dataset.station, p = form.dataset.prefix;
  const text = form.querySelector('#' + p + '-text').value.trim();
  const shift = (form.querySelector(`input[name="${p}-shift"]:checked`) || {}).value;
  const again = (form.querySelector(`input[name="${p}-again"]:checked`) || {}).value;
  const msgEl = document.getElementById(p + '-msg');
  const missing = [];
  if (!text) missing.push('a few words about what happened (even “didn’t manage it” counts)');
  if (!shift) missing.push('whether it shifted anything');
  if (!again) missing.push('whether you would do it again');
  if (missing.length){
    msgEl.textContent = 'Still needed: ' + missing.join('; ') + '.';
    const first = !text ? '#' + p + '-text' : !shift ? `input[name="${p}-shift"]` : `input[name="${p}-again"]`;
    const el = form.querySelector(first); if (el) el.focus();
    return;
  }
  if (status(n) === 'locked') return;
  const prev = state.reports[n];
  state.reports[n] = {text, shift, again: again === 'yes', date: prev ? prev.date : today(), example: prev ? prev.example : state.example};
  syncRule(n);
  save();
  ui.editing = null; ui.msg = {};
  ui.focus = p === 'rep' ? 'rep-h' : 'detail-h';
  render();
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || !app.contains(b) || b.disabled) return;
  const a = actions[b.dataset.action];
  if (a){ e.preventDefault(); a(b, e); }
});
app.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('.stn');
  if (g && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); selectStation(+g.dataset.st, true); }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.classList.contains('report-form')) return saveReport(f);
  if (f.id === 'start-form'){
    const v = document.getElementById('start-date').value;
    if (!isDate(v)){ ui.msg = {start:'Pick a start date.'}; ui.focus = 'start-date'; return render(); }
    const ahead = daysBetween(today(), v);
    if (ahead > 60){ ui.msg = {start:'Pick a date within the next two months.'}; ui.focus = 'start-date'; return render(); }
    if (ahead < -60){ ui.msg = {start:'Pick a date no more than two months ago.'}; ui.focus = 'start-date'; return render(); }
    state = Object.assign(blank(), {startDate:v, dayOffset:state.dayOffset || 0});
    advance(); save(); ui.sel = null; go('today', 'today-h');
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('rl-text')){
    const l = state.rule.find(x => x.id === t.dataset.id); if (!l) return;
    l.text = t.value; l.edited = true; save(); autoGrow(t);
    const li = t.closest('.rule-line'), tag = li && li.querySelector('.sugg'); if (tag) tag.remove();
    const r = document.getElementById('rule-read'); if (r) r.innerHTML = ruleReadHTML();
  }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('rl-freq')){
    const l = state.rule.find(x => x.id === t.dataset.id); if (!l) return;
    l.freq = t.value; save();
    const r = document.getElementById('rule-read'); if (r) r.innerHTML = ruleReadHTML();
  }
  if (t.classList.contains('rl-text')){
    const l = state.rule.find(x => x.id === t.dataset.id);
    if (l && l.station && l.text.trim() === st(l.station).rule){ l.edited = false; save(); }
  }
});

advance();
save();
render();
</script>
</body>
</html>
