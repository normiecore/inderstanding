<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Working Creed</title>
<style>
/* Layout concept: a surveyor's field book. One quiet reading column for the daily bearing; the Strata view opens into a cross-section, the one bold drawing in the app. */
:root {
  --paper: #EBEEEA;    /* cool stone field-book paper */
  --ink: #1B2326;      /* basalt ink */
  --graphite: #525D62; /* pencil notes, secondary text */
  --rule: #C3CBC7;     /* ruled lines */
  --field: #F2C230;    /* survey yellow: needle tip, highlighter, selected layer */
  --oxide: #A4462C;    /* iron oxide: drift, destructive actions */
  --f-label: "Archivo", "Helvetica Neue", Arial, sans-serif;            /* map lettering, UI */
  --f-creed: "Spectral", "Iowan Old Style", "Palatino Linotype", Georgia, serif; /* the user's own lines */
  --f-data: "B612 Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; /* bearings, dates */
}
/* Supporting tokens, all derived from the plan above */
:root {
  color-scheme: light;
  --sheet: #F6F8F5;
  --on-field: #1B2326;
  --focus: #1B2326;
  --held: #2E6B50;
  --drift: var(--oxide);
  --tested: #2C5A84;
  --absent: #7A8589;
  --sed-1: #DCD2B6;
  --sed-2: #C4CDCD;
  --sed-3: #D0D5C1;
  --sed-4: #D6C8BC;
  --lith: #1B2326;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #131819; --ink: #DCE3E0; --graphite: #9AA6A9; --rule: #323B3E;
    --field: #E9BB31; --oxide: #E68B6E; --sheet: #1A2023; --focus: #F2C230;
    --held: #7CC4A2; --tested: #8EB8E0; --absent: #77837F;
    --sed-1: #4A4332; --sed-2: #2F3A3E; --sed-3: #3A3F31; --sed-4: #463839; --lith: #DCE3E0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #131819; --ink: #DCE3E0; --graphite: #9AA6A9; --rule: #323B3E;
  --field: #E9BB31; --oxide: #E68B6E; --sheet: #1A2023; --focus: #F2C230;
  --held: #7CC4A2; --tested: #8EB8E0; --absent: #77837F;
  --sed-1: #4A4332; --sed-2: #2F3A3E; --sed-3: #3A3F31; --sed-4: #463839; --lith: #DCE3E0;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-label);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wc {
  max-width: 1120px;
  margin-inline: auto;
  padding-inline: clamp(16px, 4vw, 48px);
  padding-block: 0 56px;
  min-height: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0; }

/* ---------- Header ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  column-gap: 16px;
  padding-block: 14px 0;
}
.brand {
  order: 1;
  display: inline-flex; align-items: center; gap: 10px;
  background: none; border: 0; padding: 0; cursor: pointer;
  font-weight: 700; font-stretch: 125%; text-transform: uppercase;
  letter-spacing: .1em; font-size: 14px; color: var(--ink);
}
.brand svg { width: 28px; height: 18px; flex: none; }
.stamp {
  order: 2; margin-left: auto;
  font-family: var(--f-data); font-size: 12px; letter-spacing: .06em;
  color: var(--graphite); font-variant-numeric: tabular-nums;
}
.tabs { order: 3; flex-basis: 100%; display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 10px 12px 9px; margin-bottom: -1px; cursor: pointer;
  font-size: 12.5px; font-weight: 600; font-stretch: 112%;
  text-transform: uppercase; letter-spacing: .12em; color: var(--graphite);
  white-space: nowrap;
}
.tab:first-child { padding-left: 0; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
@media (max-width: 439px) { .stamp .dow { display: none; } }
@media (min-width: 820px) {
  .top { padding-block: 0; column-gap: 28px; }
  .brand { padding-block: 14px; }
  .tabs { order: 2; flex-basis: auto; margin-top: 0; align-self: stretch; }
  .tab { padding-block: 16px 14px; }
  .tab:first-child { padding-left: 12px; }
  .stamp { order: 3; }
}

/* ---------- Shared bits ---------- */
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 12px; border-bottom: 1px dashed var(--rule);
  font-size: 14px; color: var(--graphite);
}
.banner p { flex: 1 1 320px; max-width: 70ch; }
.tag-ex {
  display: inline-block; vertical-align: middle;
  font-family: var(--f-data); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  background: var(--field); color: var(--on-field); padding: 1px 6px 2px; margin-right: 6px; line-height: 1.5;
}
.eyebrow {
  font-family: var(--f-label); font-stretch: 125%; font-weight: 600;
  text-transform: uppercase; letter-spacing: .14em; font-size: 11.5px;
  color: var(--graphite); margin: 0;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 16px;
  border: 1.5px solid var(--ink); border-radius: 2px;
  background: transparent; color: var(--ink);
  font-weight: 600; font-size: 14px; line-height: 1.2; cursor: pointer; text-align: center;
}
.btn:hover { background: var(--sheet); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { opacity: .88; }
.btn.danger { border-color: var(--oxide); color: var(--oxide); }
.btn.danger.primary { background: var(--oxide); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link {
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  color: var(--ink); font-size: 14px;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
  text-decoration-color: var(--graphite);
}
.link:hover { text-decoration-color: var(--ink); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.msg { font-size: 14px; color: var(--graphite); }
.msg.err { color: var(--oxide); }
.opt { font-weight: 400; color: var(--graphite); font-size: 13px; }
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-weight: 600; font-size: 14px; }
.hint { font-size: 13.5px; color: var(--graphite); }
input[type="text"], textarea {
  width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px;
  padding: 10px 12px; font-size: 16px; line-height: 1.45; color: var(--ink);
}
input[type="text"]:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 1px var(--ink); }
textarea { resize: vertical; }
.v-head { display: grid; gap: 10px; max-width: 68ch; padding-block: clamp(24px, 5vw, 48px) 20px; }
.v-head h1 { margin: 0; font-family: var(--f-label); font-stretch: 112%; font-weight: 700; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.15; letter-spacing: -.005em; }
.v-head p { color: var(--graphite); }
.deg { font-family: var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.chip {
  display: inline-block; font-size: 11px; font-weight: 600; font-stretch: 112%;
  text-transform: uppercase; letter-spacing: .1em; line-height: 1.4;
  padding: 2px 7px; border: 1px solid var(--graphite); color: var(--graphite); border-radius: 2px; white-space: nowrap;
}
.chip.c-bedrock { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.c-tested { border-color: var(--ink); color: var(--ink); }
.chip.gives { border-style: dashed; }

/* check-in segments (core sample) */
.seg {
  display: inline-grid; place-items: center; flex: none;
  width: 20px; height: 22px; border-radius: 2px;
  font-family: var(--f-data); font-size: 10px; font-weight: 700; line-height: 1;
  color: var(--paper);
}
.seg-held { background: var(--held); }
.seg-drifted { background: var(--drift); }
.seg-tested { background: var(--tested); }
.seg-absent { background: repeating-linear-gradient(135deg, var(--absent) 0 1.5px, transparent 1.5px 5px); color: var(--ink); box-shadow: inset 0 0 0 1px var(--absent); }

/* ---------- Bearing (today) ---------- */
.bearing { padding-block: clamp(20px, 5vw, 56px) 8px; }
.b-grid {
  display: grid; column-gap: 20px; row-gap: 0;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "head compass" "line line" "meta meta" "act act";
  align-items: start;
}
.b-head { grid-area: head; display: grid; gap: 14px; align-self: center; }
.b-compass { grid-area: compass; width: 124px; }
.b-line { grid-area: line; }
.b-meta { grid-area: meta; }
.b-act { grid-area: act; }
@media (min-width: 820px) {
  .b-grid {
    grid-template-columns: minmax(0, 1.55fr) minmax(260px, 1fr);
    grid-template-areas: "head compass" "line compass" "meta compass" "act compass";
    column-gap: 56px;
  }
  .b-compass { width: 100%; max-width: 340px; justify-self: end; align-self: center; }
}
.b-deg { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-family: var(--f-data); }
.b-deg .num { font-size: clamp(34px, 6vw, 46px); line-height: 1; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.b-deg .quad { font-size: 13px; color: var(--graphite); letter-spacing: .06em; }
.b-line blockquote {
  margin: clamp(18px, 3vw, 28px) 0 0;
  font-family: var(--f-creed); font-weight: 300;
  font-size: clamp(29px, 5vw, 50px); line-height: 1.16; letter-spacing: -.008em;
  max-width: 21ch; text-wrap: balance;
}
.b-meta { display: grid; gap: 6px; margin-top: 22px; max-width: 58ch; font-size: 14.5px; color: var(--graphite); }
.b-meta .origin { font-family: var(--f-creed); font-style: italic; font-size: 17px; color: var(--graphite); }
.b-meta .meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.b-act { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 13.5px; color: var(--graphite); }

.compass { display: block; width: 100%; height: auto; overflow: visible; }
.cmp-ring { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.cmp-ring2 { fill: none; stroke: var(--rule); stroke-width: 1; }
.cmp-tk { stroke: var(--graphite); stroke-width: 1; }
.cmp-tk.major { stroke: var(--ink); stroke-width: 1.5; }
.cmp-num { fill: var(--graphite); font-family: var(--f-data); font-size: 9.5px; text-anchor: middle; dominant-baseline: central; }
.cmp-card { fill: var(--ink); font-family: var(--f-label); font-weight: 700; font-size: 22px; text-anchor: middle; dominant-baseline: central; }
.cmp-dot { fill: var(--paper); stroke: var(--ink); stroke-width: 1.4; }
.cmp-arc { fill: none; stroke: var(--graphite); stroke-width: 1; stroke-dasharray: 2 3; }
.cmp-needle-line { stroke: var(--ink); stroke-width: 1.8; }
.cmp-tip { fill: var(--field); stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
.cmp-pivot { fill: var(--ink); }
.needle { transform-origin: 130px 130px; transition: transform 1.1s cubic-bezier(.2, .75, .25, 1); }
@media (max-width: 819px) { .cmp-num { display: none; } }
@media (min-width: 820px) { .cmp-card { font-size: 14px; } }

.evening { margin-top: clamp(36px, 6vw, 64px); padding-top: 22px; border-top: 1px solid var(--rule); max-width: 760px; display: grid; gap: 16px; }
.evening h2 { margin: 0; }
.evening .ev-q { font-size: 17px; }
.check { display: grid; gap: 16px; }
.check fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
.res-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .res-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.res-opt { position: relative; display: flex; }
.res-opt input { position: absolute; opacity: 0; pointer-events: none; }
.res-opt label {
  flex: 1; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: center; align-content: center;
  padding: 10px 12px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 2px;
}
.res-opt label .seg { grid-row: span 2; }
.res-opt .res-l { font-weight: 600; font-size: 15px; }
.res-opt .res-h { font-size: 12.5px; color: var(--graphite); line-height: 1.3; }
.res-opt input:checked + label { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.res-opt input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.follow { display: grid; gap: 8px; max-width: 600px; }
.surv { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.surv legend { font-size: 14px; font-weight: 600; float: left; margin-right: 6px; padding: 0; }
.surv label { display: inline-flex; gap: 6px; align-items: center; font-size: 14.5px; cursor: pointer; }
.surv input { accent-color: var(--ink); width: 16px; height: 16px; }
.done { display: grid; gap: 10px; }
.done .done-line { display: flex; gap: 10px; align-items: center; font-size: 16px; }
.done .note { font-family: var(--f-creed); font-style: italic; font-size: 17px; color: var(--graphite); max-width: 60ch; }
.nudge { font-size: 14px; color: var(--graphite); max-width: 62ch; }
.quiet { font-size: 14px; color: var(--graphite); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.yday { margin-top: 28px; max-width: 760px; display: grid; gap: 14px; }

/* ---------- Onboarding ---------- */
.onboard { padding-block: clamp(28px, 6vw, 72px) 16px; display: grid; gap: 22px; max-width: 900px; }
.onboard h1 { margin: 0; font-family: var(--f-creed); font-weight: 300; font-size: clamp(28px, 4.4vw, 44px); line-height: 1.18; max-width: 24ch; }
.onboard > p { max-width: 62ch; color: var(--graphite); }
.paths { display: grid; gap: 0; margin-top: 8px; border-top: 1px solid var(--rule); }
@media (min-width: 720px) { .paths { grid-template-columns: 1fr 1fr; } .path + .path { border-left: 1px solid var(--rule); padding-left: 28px; } .path:first-child { padding-right: 28px; } }
.path { display: grid; gap: 10px; align-content: start; padding-block: 20px; }
.path + .path { border-top: 1px solid var(--rule); }
@media (min-width: 720px) { .path + .path { border-top: 0; } }
.path h2 { margin: 0; font-size: 18px; font-stretch: 112%; }
.path p { color: var(--graphite); font-size: 15px; max-width: 46ch; }
.path .btn { justify-self: start; margin-top: 4px; }

/* ---------- Lines ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--graphite); }
.legend > span { display: inline-flex; gap: 6px; align-items: center; }
.legend .seg { width: 16px; height: 18px; font-size: 9px; }
.rec-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.rec { display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: 16px; padding-block: 22px; border-bottom: 1px solid var(--rule); }
@media (min-width: 720px) { .rec { grid-template-columns: 84px minmax(0, 1fr); column-gap: 24px; } }
.rec .rec-deg { font-family: var(--f-data); font-size: 15px; padding-top: 6px; color: var(--graphite); }
.rec-body { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 960px) {
  .rec-body { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); column-gap: 36px; }
  .rec-body > .rec-tags, .rec-body > .rec-text { grid-column: 1; }
  .rec-body > .core-wrap { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .rec-body > .ask, .rec-body > details { grid-column: 1 / -1; }
}
.attn { display: grid; gap: 6px; margin-bottom: 18px; }
.attn ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.attn .link { font-size: 15px; text-align: left; }
html { scroll-padding-top: 110px; }
.rec-text { font-family: var(--f-creed); font-size: clamp(20px, 2.4vw, 24px); line-height: 1.3; max-width: 40ch; }
.rec-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rec-tags .today-mark { font-size: 12.5px; color: var(--ink); font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
.rec-tags .today-mark::before { content: ""; width: 8px; height: 8px; background: var(--field); border: 1px solid var(--ink); transform: rotate(45deg); }
.core-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.core {
  display: flex; gap: 2px; padding: 3px; max-width: 100%; overflow-x: auto;
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 13px;
}
.core .seg:first-child { border-radius: 10px 2px 2px 10px; }
.core .seg:last-child { border-radius: 2px 10px 10px 2px; }
.core .seg:only-child { border-radius: 10px; }
.core-empty { font-size: 13.5px; color: var(--graphite); font-style: italic; }
.counts { font-size: 13px; color: var(--graphite); font-variant-numeric: tabular-nums; }
.ask { display: grid; gap: 10px; max-width: 640px; padding: 14px 16px; background: var(--sheet); border: 1px dashed var(--graphite); }
.ask-k { font-family: var(--f-data); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--oxide); }
.ask.suggest .ask-k { color: var(--held); }
.ask p { font-size: 15px; }
.ask .retire-box { display: grid; gap: 10px; padding-top: 6px; border-top: 1px solid var(--rule); }
.flash { font-size: 14px; padding: 8px 12px; background: var(--sheet); border: 1px solid var(--rule); max-width: 640px; }
details.more summary { cursor: pointer; font-size: 14px; color: var(--graphite); width: max-content; max-width: 100%; }
details.more summary:hover { color: var(--ink); }
details.more[open] summary { margin-bottom: 10px; }
.more-body { display: grid; gap: 10px; font-size: 14.5px; max-width: 64ch; }
.more-body dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; }
.more-body dt { color: var(--graphite); font-size: 13px; padding-top: 1px; }
.more-body dd { margin: 0; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hist li { display: grid; grid-template-columns: 58px 20px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
.hist time { font-family: var(--f-data); font-size: 12px; color: var(--graphite); padding-top: 3px; }
.hist .seg { width: 18px; height: 20px; }
.retired-sec { margin-top: 28px; }
.retired-sec summary { cursor: pointer; font-weight: 600; font-size: 15px; }
.retired-sec .rec-text { color: var(--graphite); }
.lines-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 0 20px; }

/* ---------- Editor ---------- */
.conf-legend { display: grid; gap: 4px; font-size: 13.5px; color: var(--graphite); margin: 0; }
.conf-legend b { color: var(--ink); font-weight: 600; }
.ed-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.ed-row { display: grid; gap: 10px; padding-block: 18px; border-bottom: 1px solid var(--rule); max-width: 760px; }
.ed-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.ed-num { font-family: var(--f-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--graphite); }
.ed-text-wrap { display: grid; gap: 4px; }
.ed-row textarea { font-family: var(--f-creed); font-size: 19px; line-height: 1.35; min-height: 64px; }
.count { font-family: var(--f-data); font-size: 11px; color: var(--graphite); justify-self: end; }
.conf-set { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.conf-set legend { font-size: 13.5px; color: var(--graphite); float: left; margin-right: 6px; padding: 0; }
.seg-opt { position: relative; }
.seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg-opt label { display: inline-block; padding: 5px 12px; border: 1px solid var(--rule); background: var(--sheet); font-size: 13.5px; cursor: pointer; border-radius: 2px; }
.seg-opt input:checked + label { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg-opt input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.ed-row-act { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.ed-seed { font-size: 13.5px; color: var(--graphite); font-style: italic; }
.ed-add { padding-block: 14px 4px; }
.ed-give { margin-top: 28px; display: grid; gap: 6px; max-width: 760px; }

  /* ---------- Lines view ---------- */
  function coreHTML(cs, max) {
    if (!cs.length) return '<span class="core-empty">No check-ins yet.</span>';

    var label = 'Last ' + plural(shown.length, 'check-in') + ', oldest first: ' + shown.map(function (c) { return fmtShort(c.date) + ' ' + RESULT[c.result].label; }).join(', ');
    return '<div class="core" role="img" aria-label="' + esc(label) + '">' + shown.map(function (c) {
      return '<span class="seg seg-' + c.result + '" title="' + esc(fmt(c.date) + ': ' + RESULT[c.result].label + (c.note ? '. ' + c.note : '')) + '">' + RESULT[c.result].letter + '</span>';
    }).join('') + '</div>' + (cs.length > max ? '<span class="counts">and ' + (cs.length - max) + ' earlier</span>' : '');
  }
  function countsText(cs) {
    if (!cs.length) return '';

    cs.forEach(function (c) { n[c.result]++; });
    var parts = [];
    ['held', 'tested', 'drifted', 'absent'].forEach(function (k) { if (n[k]) parts.push(RESULT[k].label + ' ' + n[k]); });
    return parts.join(' · ') + ' · since ' + fmtShort(cs[0].date);
  }
  function lineRecord(l, isToday) {

      h += '<div class="ask suggest" role="group" aria-labelledby="sug-' + l.id + '"><p class="ask-k" id="sug-' + l.id + '">A suggestion</p>' +
        '<p>Since you marked it ' + CONF[l.confidence] + ' on ' + esc(fmtShort(l.confidenceSince)) + ', this line has held or come through a test on ' + numw(s.sup) + ' days, with ' + dtxt + '. Raise it to ' + CONF[s.to] + '? Only you can judge whether it has earned that.</p>' +
        '<div class="row"><button class="btn primary" type="button" data-action="s-raise" data-id="' + l.id + '" data-to="' + s.to + '" id="s-raise-' + l.id + '">Raise to ' + CONF[s.to] + '</button>' +
        '<button class="btn" type="button" data-action="s-skip" data-id="' + l.id + '" id="s-skip-' + l.id + '">Not yet</button></div></div>';
    } else if (ui.retiring === l.id) {

    }
    h += '<details class="more"' + (ui.openRec === l.id ? ' open' : '') + '><summary>Record and origin</summary><div class="more-body"><dl>' +
      '<dt>Came from</dt><dd>' + (l.origin ? esc(l.origin) : '<span class="opt">Not noted</span>') + '</dd>' +
      '<dt>Written</dt><dd>' + esc(fmt(l.created)) + '</dd>' +

      (l.revisions.length ? '<dt>Earlier wording</dt><dd>' + l.revisions.map(function (r) { return '“' + esc(r.from) + '” <span class="opt">(until ' + esc(fmtShort(r.date)) + ')</span>'; }).join('<br>') + '</dd>' : '') +

  /* ---------- Editor ---------- */

        '<button class="link" type="button" data-action="ed-remove" data-key="' + k + '" id="ed-rm-' + k + '">' + (line && !line.retired ? 'Remove (it is retired, and its record is kept)' : 'Remove') + '</button></div>') +

  function voiceShort(k) { var v = VOICES.filter(function (x) { return x.k === k; })[0]; return v ? v.short : ''; }

  /* ---------- Eulogy (Start) ---------- */

      var from = l.confidence;
      var rows = rowsFromActive().map(function (r) { if (r.id === l.id) r.confidence = to; return r; });
      commit(rows, 'Raised “' + l.text + '” from ' + CONF[from] + ' to ' + CONF[to] + ' after it held up in evening checks.', null, true);
      draft = null; ui.strataSel = null;
      setFlash('lines', 'Raised to ' + CONF[to] + '. Strata has a new layer for the change.');
      ui.focus = 'rev-' + l.id; render();
    },
    's-skip': function (el) {
      var l = lineById(el.dataset.id); if (!l) return;
      var s = suggestionFor(l); l.suggestSkipAt = s ? s.sup : 0; save();
      setFlash('lines', 'Left as ' + CONF[l.confidence] + '. You’ll see the suggestion again after a few more good days.');
      ui.focus = 'rev-' + l.id; render();
    },
    'ed-add': function () {
      if (draft.rows.length >= MAX_LINES) return;
      var r = newRow(); insertRegular(r); ui.focus = 'ed-text-' + r.key; render();
    },
    'ed-remove': function (el) {
      var k = Number(el.dataset.key), idx = draft.rows.findIndex(function (r) { return r.key === k; });
      if (idx < 0) return;
      draft.rows.splice(idx, 1); ui.focus = 'ed-add'; render();
    },
    'ed-make-gives': function (el) {
      var k = Number(el.dataset.key);
      var old = draft.rows.filter(function (r) { return r.gives; })[0];
      var row = draft.rows.filter(function (r) { return r.key === k; })[0]; if (!row) return;
      draft.rows = draft.rows.filter(function (r) { return r !== row; });
      if (old) { old.gives = false; if (!old.text.trim() && !old.id) draft.rows = draft.rows.filter(function (r) { return r !== old; }); }
      row.gives = true; draft.rows.push(row);
      ui.focus = 'ed-text-' + row.key; render();
    },
    'ed-seed': function (el) {
      var sd = state.eulogy.seeds.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (!sd || draft.rows.length >= MAX_LINES) return;
      var r = newRow({ text: clip(sd.text, MAX_LEN), origin: seedOrigin(sd.from), seed: sd.text, seedId: sd.id });
      insertRegular(r); ui.focus = 'ed-text-' + r.key; render();
    },
    'ed-save': edSave,
    'ed-cancel': function () { draft = null; go(state.versions.length ? 'lines' : 'bearing'); },
    'eu-next': function () {
      var e = state.eulogy;
      if (!(e.family.trim() || e.friend.trim() || e.work.trim())) { var m = $('#eu-msg'); if (m) { m.textContent = 'Write what at least one of the three might say first.'; m.className = 'msg err'; } return; }
      ui.eulogyStep = 2; pendingSel = null; go('start');
    },
    'eu-back': function () { ui.eulogyStep = 1; go('start'); },
    'eu-lines': function () {
      if (!state.eulogy.seeds.length) return;
      if (!activeLines().length) draft = draftFromSeeds();
      else if (!draft) draft = draftFromCurrent();
      go('edit');
    },
    'toggle-sent': function (el, e) {
      var sel = window.getSelection();
      // a drag across words also ends in a click; leave that for "Add highlighted words"
      if (e && e.detail !== 0 && sel && !sel.isCollapsed && sel.toString().trim() && closestPassage(sel.anchorNode)) return;
      var from = el.dataset.from, text = el.textContent.trim(), seeds = state.eulogy.seeds;
      var idx = seeds.findIndex(function (s) { return s.from === from && s.text === text; });
      if (idx >= 0) seeds.splice(idx, 1); else seeds.push({ id: uid('s'), text: text, from: from });
      save(); pendingSel = null; ui.focus = el.id; render();
    },
    'eu-add-sel': function (el) {
      if (!pendingSel || pendingSel.from !== el.dataset.from) return;
      var text = pendingSel.text, from = pendingSel.from;
      if (!state.eulogy.seeds.some(function (s) { return s.from === from && s.text === text; })) state.eulogy.seeds.push({ id: uid('s'), text: text, from: from });
      pendingSel = null;
      try { window.getSelection().removeAllRanges(); } catch (e) { /* ignore */ }
      save(); ui.focus = 'eu-lines'; render();
    },
    'seed-remove': function (el) {
      state.eulogy.seeds = state.eulogy.seeds.filter(function (s) { return s.id !== el.dataset.id; });
      save(); ui.focus = 'seeds-h'; render();
    },
    'st-sel': function (el) { selectLayer(Number(el.dataset.i), false); var b = document.getElementById(el.id); if (b && !b.disabled) b.focus(); else { var g = document.getElementById('st-layer-' + ui.strataSel); if (g) g.focus(); } },
    'toggle-origins': function () { ui.showOrigins = !ui.showOrigins; ui.focus = 'cr-origins'; render(); },
    'copy-creed': function () { copyText(creedText(), 'cr-msg', null); },
    'copy-export': function () { var ta = $('#data-export'); copyText(ta ? ta.value : JSON.stringify(state), 'copy-msg', ta); },
    'import': function () {
      var ta = $('#data-import'), m = $('#import-msg'), raw = ta ? ta.value.trim() : '';
      function say(t, err) { if (m) { m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); } }
      if (!raw) { say('Paste the exported JSON into the box first.', true); return; }
      var parsed;
      try { parsed = JSON.parse(raw); } catch (e) { say('That isn’t valid JSON. Paste the whole export, from the first { to the last }.', true); return; }
      var next;
      try { next = normalize(parsed); } catch (e) { say('This JSON doesn’t look like a Working Creed export: it has no lines or layers.', true); return; }
      state = next; draft = null; ui.strataSel = null; needleAngle = null; save();
      setFlash('data', 'Imported ' + plural(activeLines().length, 'line') + ', ' + plural(state.checks.length, 'evening check') + ' and ' + plural(state.versions.length, 'layer') + '.');
      ui.focus = 'data-import-btn'; render();
    },
    'erase-arm': function () { ui.eraseArm = true; ui.focus = 'erase-cancel'; render(); },
    'erase-cancel': function () { ui.eraseArm = false; ui.focus = 'erase-arm'; render(); },
    'erase-confirm': function () {
      wipe(); state = emptyState(); draft = null; ui.eraseArm = false; ui.strataSel = null; needleAngle = null; pendingSel = null;
      setFlash('data', 'Erased. Nothing from Working Creed is stored in this browser now. Reloading the page will show the example creed again until you start your own.');
      ui.focus = 'data-copy'; render();
    }
  };

  function copyText(text, msgId, ta) {
    var m = document.getElementById(msgId);
    function fallback() {
      if (ta) { ta.focus(); ta.select(); }
      if (m) m.textContent = ta ? 'Your browser blocked the clipboard. The text is selected: press Ctrl+C or Cmd+C to copy it.' : 'Your browser blocked the clipboard. Select the lines above and copy them yourself.';
    }
    try {
      navigator.clipboard.writeText(text).then(function () { if (m) m.textContent = 'Copied.'; }, fallback);
    } catch (e) { fallback(); }
  }

  /* ================= events ================= */
  var root = $('#wc');
  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || !root.contains(el) || el.disabled) return;
    var fn = actions[el.dataset.action];
    if (fn) fn(el, e);
  });
  root.addEventListener('keydown', function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.ed === 'text' && e.key === 'Enter') { e.preventDefault(); return; }
    if (el.getAttribute && el.getAttribute('role') === 'button' && el.tagName !== 'BUTTON') {
      if (el.classList.contains('st-layer')) {
        var i = Number(el.dataset.i);
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectLayer(i, true); }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); selectLayer(i + 1, true); }
        else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); selectLayer(i - 1, true); }
        else if (e.key === 'Home') { e.preventDefault(); selectLayer(0, true); }
        else if (e.key === 'End') { e.preventDefault(); selectLayer(state.versions.length - 1, true); }
        return;
      }
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    }
  });
  root.addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('.st-layer');
    if (g) selectLayer(Number(g.dataset.i), true);
  });
  root.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.ed && draft) {
      if (el.dataset.ed === 'reason') { draft.reason = el.value; return; }
      edMsg('');
      var k = Number(el.dataset.key), r = draft.rows.filter(function (x) { return x.key === k; })[0]; if (!r) return;
      if (el.dataset.ed === 'text') { autosize(el); r.text = el.value.replace(/\n/g, ' '); var c = document.getElementById('ed-count-' + k); if (c) c.textContent = el.value.length + '/' + MAX_LEN; }
      else if (el.dataset.ed === 'origin') r.origin = el.value;
    }
    if (el.dataset.eu) { state.eulogy[el.dataset.eu] = el.value; save(); var m = $('#eu-msg'); if (m && m.classList.contains('err')) { m.textContent = 'Saved as you type, on this device.'; m.className = 'msg'; } }
  });
  root.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.ed === 'confidence' && draft) {
      var k = Number(el.dataset.key), r = draft.rows.filter(function (x) { return x.key === k; })[0]; if (r) r.confidence = el.value;
    }
    var form = el.closest && el.closest('form.check');
    if (form && el.name === form.dataset.prefix + '-res') {
      form.querySelectorAll('.follow').forEach(function (f) { f.hidden = f.dataset.for !== el.value; });
      var m = document.getElementById(form.dataset.prefix + '-msg'); if (m) { m.textContent = ''; m.className = 'msg'; }
    }
  });
  root.addEventListener('submit', function (e) {
    var form = e.target; if (!form.classList.contains('check')) return;
    e.preventDefault();
    var p = form.dataset.prefix, data = readCheckForm(form);
    if (data.error) { var m = document.getElementById(p + '-msg'); if (m) { m.textContent = data.error; m.className = 'msg err'; } var f = document.getElementById(p + '-res-held'); if (f) f.focus(); return; }
    setCheck(form.dataset.date, form.dataset.line, data.result, data.note, data.survived);
    if (p === 'ev') { ui.checkEdit = false; ui.focus = 'ev-done'; }
    else { ui.ydayOpen = false; ui.ydayDone = form.dataset.date; ui.focus = 'ev-h'; }
    render();
  });
  var rT = null;
  window.addEventListener('resize', function () { if (ui.view !== 'strata') return; clearTimeout(rT); rT = setTimeout(drawStrata, 120); });
  function dayTick() {
    if (today() === ui.lastDay) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
    ui.checkEdit = false; ui.ydayOpen = false; render();
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) dayTick(); });
  setInterval(dayTick, 60000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (ui.view === 'strata') drawStrata(); });

  render();
})();
</script>
</body>
</html>
