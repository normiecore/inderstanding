<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Question Deck</title>
<style>
/* Layout concept: a card table. Controls sit at the table's edge, cards are dealt across the cloth,
   and the book of answers lies beneath. The boldness lives on the cards (four suit inks, engraved
   patterns, a slightly misregistered second impression); everything around them stays quiet. */
:root {
  --paper: #E2E5E9;      /* the room: cool grey printing paper */
  --cloth: #D1D7DE;      /* the table the cards land on */
  --stock: #FBFBF8;      /* card stock */
  --ink: #172031;        /* Prussian ink: text, buttons, deck backs */
  --ink-soft: #4A5467;   /* secondary text */
  --rule: #B4BCC7;       /* hairlines */
  --roots: #2B654A;      /* suit inks */
  --others: #A9352B;
  --time: #7F5206;
  --mystery: #373B9A;
  --danger: #9E2A20;

  --font-display: "Bodoni Moda", "Bodoni 72", "Didot", "Times New Roman", serif;
  --font-body: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --edge: color-mix(in srgb, var(--ink) 16%, transparent);
  --rule-strong: color-mix(in srgb, var(--ink) 38%, transparent);
  --hover: color-mix(in srgb, var(--ink) 8%, transparent);
  --lift: 0 1px 0 color-mix(in srgb, var(--ink) 10%, transparent), 0 12px 26px -16px color-mix(in srgb, var(--ink) 45%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #101419;
    --cloth: #171D25;
    --stock: #1E2530;
    --ink: #E4E8EE;
    --ink-soft: #A4ADBB;
    --rule: #344050;
    --roots: #71C79F;
    --others: #F28C7E;
    --time: #E4B35A;
    --mystery: #A9AEFB;
    --danger: #F49386;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #101419;
  --cloth: #171D25;
  --stock: #1E2530;
  --ink: #E4E8EE;
  --ink-soft: #A4ADBB;
  --rule: #344050;
  --roots: #71C79F;
  --others: #F28C7E;
  --time: #E4B35A;
  --mystery: #A9AEFB;
  --danger: #F49386;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}
img, canvas { max-width: 100%; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0; }

.qd {
  max-width: 1400px;
  margin-inline: auto;
  padding-inline: clamp(16px, 3.4vw, 48px);
  padding-block: 18px 64px;
}

/* ---------- masthead ---------- */
.masthead {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 14px 32px; padding-bottom: 14px; border-bottom: 1px solid var(--rule);
}
.wordmark {
  font-family: var(--font-display); font-weight: 600; font-optical-sizing: auto;
  font-size: clamp(1.75rem, 1.3rem + 1.5vw, 2.5rem); line-height: 1; letter-spacing: -0.01em;
}
.wordmark em { font-style: italic; font-weight: 500; }
.tagline { margin-top: 8px; color: var(--ink-soft); font-size: 0.92rem; max-width: 52ch; }
.nav { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.nav button {
  font: 500 0.9rem/1 var(--font-body); color: var(--ink-soft); background: none; border: 0;
  padding: 10px 8px; cursor: pointer; border-bottom: 2px solid transparent; border-radius: 0;
}
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- shared bits ---------- */
.eyebrow, .mini-label, .pos-label, .tag, .step-n, .deck-count, .slot-label {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
}
.eyebrow { color: var(--ink-soft); }
.mini-label { color: var(--ink-soft); display: block; }
.view-title {
  font-family: var(--font-display); font-weight: 600; font-optical-sizing: auto;
  font-size: clamp(1.7rem, 1.35rem + 1.2vw, 2.3rem); line-height: 1.08; margin: 4px 0 0;
}
.view-title:focus { outline: none; }
.lede { color: var(--ink-soft); max-width: 62ch; margin-top: 10px; }
.tag {
  display: inline-block; padding: 3px 6px 2px; border: 1px solid var(--rule-strong); border-radius: 2px;
  color: var(--ink-soft); line-height: 1.2; font-size: 0.66rem; vertical-align: middle;
}
.status { font-size: 0.86rem; color: var(--ink-soft); min-height: 1.3em; }
.status.small { font-size: 0.8rem; }

.btn {
  font: 600 0.9rem/1.2 var(--font-body); color: var(--ink); background: transparent;
  border: 1px solid var(--ink); border-radius: 3px; padding: 0.66em 1.05em; cursor: pointer;
}
.btn:hover { background: var(--hover); }
.btn-primary { background: var(--ink); color: var(--stock); }
.btn-primary:hover { background: color-mix(in srgb, var(--ink) 84%, var(--stock)); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn-small { font-size: 0.8rem; padding: 0.5em 0.8em; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--stock); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--stock); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.link-btn {
  font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.link-btn:hover { text-decoration-thickness: 2px; }

textarea, input[type="text"], select {
  font: 1rem/1.5 var(--font-body); color: var(--ink); background: var(--stock);
  border: 1px solid var(--rule); border-radius: 3px; padding: 0.6em 0.7em; width: 100%;
}
textarea { resize: vertical; min-height: 4.5em; }
textarea::placeholder, input::placeholder { color: color-mix(in srgb, var(--ink-soft) 80%, transparent); }
textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
select { width: auto; max-width: 100%; padding-right: 2em; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 0.72rem/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0.6em 0.8em; border: 1px solid var(--rule); background: var(--stock); color: var(--ink);
  border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--stock); border-color: var(--ink); }
.chip svg { width: 12px; height: 12px; }
.chip-glyph { color: var(--suit); display: inline-flex; }
.chip[aria-pressed="true"] .chip-glyph { color: inherit; }
.view-head { margin-top: 26px; }
.reading-note { display: grid; gap: 12px; }
.return-actions { margin-top: 10px; }
.inline-code { font-family: var(--font-mono); font-size: 0.9em; }

.notice-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 14px;
  padding: 10px 14px; border: 1px dashed var(--rule-strong); border-radius: 4px; background: color-mix(in srgb, var(--stock) 55%, transparent);
}
.notice-bar p { flex: 1 1 320px; font-size: 0.92rem; }
.toast { margin-top: 12px; font-size: 0.92rem; }

/* ---------- suit colour hooks ---------- */
.suit-roots { --suit: var(--roots); }
.suit-others { --suit: var(--others); }
.suit-time { --suit: var(--time); }
.suit-mystery { --suit: var(--mystery); }

/* ---------- the card ---------- */
.card {
  --suit: var(--ink);
  background: var(--stock); color: var(--ink);
  border: 1px solid var(--edge); border-radius: 12px;
  padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--lift); position: relative; min-width: 0;
}
.card:focus { outline: none; }
.card:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--suit); }
.card-suit { display: inline-flex; align-items: center; gap: 6px; font: 0.7rem/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; }
.card-suit svg { width: 14px; height: 14px; flex: none; }
.card-num { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: 0.04em; line-height: 1; }
.plate {
  aspect-ratio: 5 / 3; border: 1px solid color-mix(in srgb, var(--suit) 50%, transparent);
  border-radius: 3px; overflow: hidden; background: var(--stock);
}
.plate canvas { display: block; width: 100%; height: 100%; }
.card-q {
  font-family: var(--font-display); font-optical-sizing: auto; font-weight: 500;
  font-size: clamp(1.1rem, 1rem + 0.35vw, 1.3rem); line-height: 1.24; text-wrap: pretty;
  margin-top: 2px;
}
.card-src { font-family: var(--font-display); font-style: italic; font-size: 0.92rem; line-height: 1.3; color: var(--suit); padding-top: 9px; border-top: 1px solid var(--edge); }
.card-ctx { font-size: 0.82rem; line-height: 1.45; color: var(--ink-soft); }
.card-foot {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-top: auto; padding-top: 4px;
  font: 0.66rem/1.3 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft);
}
.card-foot .mark { color: var(--suit); white-space: nowrap; }
.card-foot .num-flip { font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 0.04em; color: var(--suit); transform: rotate(180deg); text-transform: none; }

.card.compact { gap: 8px; padding: 11px 12px 12px; border-radius: 10px; }
.card.compact .plate { aspect-ratio: 5 / 2; }
.card.compact .card-q { font-size: 1.05rem; }
.card.compact .card-src { font-size: 0.86rem; padding-top: 7px; }
.card.compact .card-ctx { font-size: 0.78rem; }

.back::after {
  content: ""; position: absolute; inset: 9px; border: 3px double var(--ink);
  border-radius: 5px; pointer-events: none; opacity: 0.85;
}
.back {
  background-color: var(--stock); background-image: var(--back-img, none);
  background-size: cover; background-position: center; background-repeat: no-repeat;
  border: 1px solid var(--edge); border-radius: 12px;
}

/* ---------- today: before drawing ---------- */
.today {
  display: grid; margin-top: 26px; gap: 28px 40px; align-items: start;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  grid-template-areas: "controls table" "controls lately";
}
.controls { grid-area: controls; display: flex; flex-direction: column; gap: 22px; }
.today > .table { grid-area: table; }
.lately { grid-area: lately; }
.step { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.step-label { font-weight: 600; font-size: 0.98rem; display: flex; align-items: center; gap: 10px; padding: 0; }
.step-label .opt { font-weight: 400; color: var(--ink-soft); font-size: 0.86rem; }
.step-n {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--ink);
  border-radius: 50%; font-size: 0.7rem; letter-spacing: 0; flex: none;
}
.spreads { display: grid; gap: 6px; margin-top: 2px; }
.spread {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 10px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--stock); cursor: pointer;
}
.spread:hover { border-color: var(--rule-strong); }
.spread:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.spread input { margin: 4px 0 0; accent-color: var(--ink); width: 16px; height: 16px; }
.spread-name { display: block; font-weight: 600; }
.spread-desc { display: block; font-size: 0.86rem; color: var(--ink-soft); }
.paths { display: grid; gap: 10px; margin-top: 6px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.86rem; font-weight: 600; }

.table {
  position: relative; background: var(--cloth); border-radius: 6px;
  padding: clamp(28px, 3.2vw, 40px);
}
.reg { position: absolute; width: 12px; height: 12px; border: 1px solid var(--rule-strong); border-radius: 50%; pointer-events: none; }
.reg::before, .reg::after { content: ""; position: absolute; background: var(--rule-strong); }
.reg::before { left: 5px; top: -4px; bottom: -4px; width: 1px; }
.reg::after { top: 5px; left: -4px; right: -4px; height: 1px; }
.reg.tl { top: 8px; left: 8px; } .reg.tr { top: 8px; right: 8px; }
.reg.bl { bottom: 8px; left: 8px; } .reg.br { bottom: 8px; right: 8px; }

.table-row { display: flex; flex-wrap: wrap; gap: 24px 30px; align-items: flex-start; }
.deck-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: none; }
.deck { position: relative; width: 150px; aspect-ratio: 5 / 8; cursor: pointer; }
.deck-card { position: absolute; inset: 0; translate: calc(var(--i, 0) * -1.3px) calc(var(--i, 0) * -1.7px); box-shadow: 0 1px 0 var(--edge); }
.deck-card:nth-child(1) { --i: 6; } .deck-card:nth-child(2) { --i: 5; } .deck-card:nth-child(3) { --i: 4; } .deck-card:nth-child(4) { --i: 3; }
.deck-card:nth-child(5) { --i: 2; } .deck-card:nth-child(6) { --i: 1; } .deck-card:nth-child(7) { --i: 0; }
.deck-count { color: var(--ink-soft); }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; flex: 0 0 190px; grid-template-columns: minmax(0, 1fr); }
.slots-3 { flex: 1 1 300px; grid-template-columns: repeat(3, minmax(0, 172px)); }
.suit-key { flex: 1 1 230px; align-self: center; display: grid; gap: 12px; font-size: 0.88rem; color: var(--ink-soft); max-width: 640px; }
.suit-key ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.suit-key li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; line-height: 1.4; }
.suit-key li svg { width: 15px; height: 15px; margin-top: 2px; }
.suit-key b { display: block; color: var(--ink); font-weight: 600; }
.slot { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slot-label { color: var(--ink-soft); font-size: 0.66rem; line-height: 1.35; min-height: 2.7em; overflow-wrap: anywhere; }
.slot-outline { aspect-ratio: 5 / 8; border: 1.5px dashed var(--rule-strong); border-radius: 12px; }

.lately { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; }
.lately-block { border-top: 1px solid var(--rule); padding-top: 14px; display: grid; gap: 8px; align-content: start; }
.lately-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; }
.lately-q { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.3; }
.lately-a { color: var(--ink-soft); font-size: 0.92rem; margin-top: 6px; }

/* ---------- today: dealt reading ---------- */
.reading { margin-top: 26px; display: grid; gap: 24px; }
.reading-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px 40px; align-items: end; }
.reading-head .carry { color: var(--ink-soft); max-width: 60ch; }
.brought { font-family: var(--font-display); font-style: italic; font-size: 1.15rem; line-height: 1.4; max-width: 60ch; }
.brought .mini-label { font-style: normal; margin-bottom: 2px; }
.turn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 18px; }
.dealt { list-style: none; margin: 0; padding: 0; display: grid; gap: 28px 24px; align-items: start; }
.dealt-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dealt-1 .dealt-item {
  display: grid; gap: 12px 32px; grid-template-columns: minmax(0, 330px) minmax(0, 1fr);
  grid-template-areas: "label label" "card after";
}
.dealt-1 .pos-label { grid-area: label; }
.dealt-1 .flip { grid-area: card; }
.dealt-1 .after-flip { grid-area: after; }
.dealt-item { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pos-label { color: var(--ink); font-weight: 400; }
.after-flip { display: grid; gap: 14px; align-content: start; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer { display: grid; gap: 6px; }
.answer-label { font-family: var(--font-display); font-style: italic; font-size: 1.1rem; }
.answer textarea { min-height: 8em; }
.dealt-1 .answer textarea { min-height: 12em; }

.flip { perspective: 1800px; transform-origin: 0 0; }
.flip-inner { position: relative; transform-style: preserve-3d; transition: transform 0.75s cubic-bezier(0.2, 0.7, 0.2, 1); }
.flip-front { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); }
.flip-front > .card { height: 100%; }
.flip-back {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; place-items: end center; padding: 0 0 18px; cursor: pointer; box-shadow: var(--lift); font: inherit; color: var(--ink);
}
.flip-back:hover .back-label { background: var(--ink); color: var(--stock); }
.back-label { font: 0.72rem/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; background: var(--stock); border: 1px solid var(--ink); padding: 7px 10px; border-radius: 2px; }
.flip.is-flipped .flip-inner { transform: rotateY(180deg); }
.flip.static .flip-inner, .flip.static .flip-front { transform: none; transition: none; }

.putback { display: grid; gap: 8px; justify-items: start; font-size: 0.9rem; color: var(--ink-soft); }
.putback-confirm { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

/* ---------- book of answers ---------- */
.book { display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr); gap: 32px 48px; margin-top: 26px; align-items: start; }
.book-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 18px; }
.filter { display: grid; gap: 8px; }
.count { font: 0.78rem/1.4 var(--font-mono); color: var(--ink-soft); }
.entry { padding-block: 24px 30px; border-top: 1px solid var(--rule); }
.entry:first-child { border-top: 0; padding-top: 4px; }
.entry-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.entry-date { font-family: var(--font-display); font-weight: 600; font-size: 1.55rem; line-height: 1.15; margin: 0; }
.entry-spread { font: 0.72rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.entry-brought { font-family: var(--font-display); font-style: italic; font-size: 1.05rem; color: var(--ink-soft); margin-top: 8px; max-width: 64ch; }
.entry-paths { font-size: 0.88rem; color: var(--ink-soft); margin-top: 4px; }
.entry-cards { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 26px; }
.entry-card { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; }
.entry-q { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; line-height: 1.3; margin-top: 3px; max-width: 60ch; }
.entry-src { font-size: 0.82rem; color: var(--ink-soft); margin-top: 3px; }
.entry-src i { font-family: var(--font-display); }
.entry-answer { font-size: 1.12rem; line-height: 1.62; white-space: pre-wrap; max-width: 62ch; margin-top: 12px; overflow-wrap: anywhere; }
.entry-unanswered { font-size: 0.92rem; color: var(--ink-soft); margin-top: 10px; font-style: italic; }
.entry-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; margin-top: 8px; font-size: 0.86rem; color: var(--ink-soft); }
.entry-edit { display: grid; gap: 8px; margin-top: 12px; max-width: 62ch; }
.entry-edit textarea { min-height: 9em; }

.mini {
  position: relative; width: 64px; aspect-ratio: 5 / 8; border-radius: 6px; overflow: hidden;
  border: 1px solid var(--edge); background: var(--stock); box-shadow: 0 1px 0 var(--edge);
}
.mini canvas { display: block; width: 100%; height: 100%; }
.mini-num {
  position: absolute; left: 4px; top: 4px; padding: 1px 4px; border-radius: 2px;
  background: var(--stock); color: var(--suit); font: 600 0.68rem/1.1 var(--font-display);
}
.lately-row .mini { width: 56px; }

.empty { padding: 26px 0; color: var(--ink-soft); max-width: 60ch; display: grid; gap: 12px; justify-items: start; }
.empty strong { color: var(--ink); font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }

/* ---------- returning ---------- */
.returns { margin-top: 18px; }
.return { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px 40px; padding-block: 30px; border-top: 1px solid var(--rule); align-items: start; }
.return-meta { font: 0.76rem/1.4 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 14px; }
.answers-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.answer-col { padding: 4px 24px 6px; border-left: 1px solid var(--rule); display: grid; gap: 6px; align-content: start; }
.answer-col:first-child { padding-left: 0; border-left: 0; }
.answer-col h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; line-height: 1.2; margin: 0; }
.answer-col .gap { font: 0.7rem/1.3 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--suit, var(--ink-soft)); }
.answer-col .ctx { font-size: 0.84rem; color: var(--ink-soft); }
.answer-col .ans { font-size: 1.06rem; line-height: 1.6; white-space: pre-wrap; margin-top: 6px; overflow-wrap: anywhere; }

/* ---------- the deck ---------- */
.deck-tools { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; margin-top: 18px; }
.deck-tools .count { padding-bottom: 13px; }
.deck-stats { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 14px; font: 0.78rem/1.4 var(--font-mono); color: var(--ink-soft); }
.deck-stats b { color: var(--ink); font-weight: 400; }
.deck-grid { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.deck-item { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.deck-item .card { flex: 1; }
.deck-item.is-aside .card { opacity: 0.62; }
.drawn-count { font: 0.7rem/1.3 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin-left: auto; }

/* ---------- about ---------- */
.about { display: grid; grid-template-columns: minmax(0, 66ch) minmax(0, 320px); gap: 32px 56px; margin-top: 26px; align-items: start; }
.prose { display: grid; gap: 14px; }
.prose h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; margin: 18px 0 0; }
.prose p { line-height: 1.62; }
.prose code { font-family: var(--font-mono); font-size: 0.86em; background: var(--stock); border: 1px solid var(--rule); padding: 0 4px; border-radius: 2px; }
.figures { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--stock); border: 1px solid var(--edge); border-radius: 6px; padding: 18px 18px 20px; }
.figures dl { margin: 10px 0 0; display: grid; gap: 12px; }
.figures dt { font: 0.68rem/1.3 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.figures dd { margin: 2px 0 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.figures dd.dd-text { font-size: 1rem; }
.figures dd .times { font-family: var(--font-body); font-weight: 400; font-size: 0.8em; }
.figures dd small { font-variant-numeric: normal; display: block; font-family: var(--font-body); font-size: 0.8rem; font-weight: 400; color: var(--ink-soft); margin-top: 2px; }

/* ---------- data ---------- */
.data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 22px; margin-top: 22px; align-items: start; }
.panel { background: var(--stock); border: 1px solid var(--edge); border-radius: 6px; padding: 18px; display: grid; gap: 10px; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 0; }
.panel p { font-size: 0.92rem; color: var(--ink-soft); }
.panel textarea { font: 0.78rem/1.45 var(--font-mono); min-height: 12em; background: var(--paper); }
.confirm { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--danger); border-radius: 4px; }
.confirm p { color: var(--ink); }

.colophon { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 0.82rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px 24px; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .dealt-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
}
@media (max-width: 900px) {
  .today { display: flex; flex-direction: column; align-items: stretch; gap: 22px; }
  .today > .controls { display: contents; }
  .today > .table { order: 1; }
  .today .step-go { order: 2; }
  .today > .lately { order: 3; }
  .book, .about { grid-template-columns: minmax(0, 1fr); }
  .book-side, .figures { position: static; }
  .reading-head { grid-template-columns: minmax(0, 1fr); }
  .return { grid-template-columns: minmax(0, 1fr); }
  .return > .card, .return-card { max-width: 380px; }
}
@media (max-width: 640px) {
  .dealt-1 .dealt-item { grid-template-columns: minmax(0, 1fr); grid-template-areas: "label" "card" "after"; }
  .dealt-1 .flip, .dealt-3 .flip { max-width: 420px; }
  .deck { width: 104px; }
  .table-row { gap: 18px; }
  .slots { flex: 0 0 132px; }
  .slots-3 { flex: 1 1 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .suit-key { display: none; }
  .answer-col { padding: 14px 0 0; border-left: 0; border-top: 1px solid var(--rule); }
  .answer-col:first-child { border-top: 0; padding-top: 0; }
  .answers-row { gap: 14px; }
  .nav button { padding: 9px 6px; font-size: 0.86rem; }
  .entry-card { grid-template-columns: 48px minmax(0, 1fr); gap: 14px; }
  .entry-card .mini { width: 48px; }
}
@supports (grid-template-rows: subgrid) {
  .dealt-3 .dealt-item { display: grid; grid-row: span 3; grid-template-rows: subgrid; gap: 10px; }
  .dealt-3 .flip, .dealt-3 .flip-inner, .dealt-3 .flip-front { height: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .flip-inner { transition: none; }
  * { scroll-behavior: auto !important; }
}

<body>
<div class="qd" id="app">
  <header class="masthead">
    <div class="brand">
      <p class="wordmark">The <em>Question</em> Deck</p>
      <p class="tagline" id="tagline">Shuffle, draw a question taken from a real tradition or writer, carry it through the day, and write your own answer.</p>
    </div>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-view="today" aria-current="page">Today</button>
      <button type="button" data-view="book">Book of answers</button>
      <button type="button" data-view="returning">Returning questions</button>
      <button type="button" data-view="deck">The deck</button>
      <button type="button" data-view="about">About the randomness</button>
      <button type="button" data-view="data">Your data</button>
    </nav>
  </header>
  <div id="banners"></div>
  <main id="view"></main>
  <footer class="colophon">
    <span>Everything stays in this browser. No accounts, no tracking.</span>
    <span>Direct quotations name their source. Adapted questions are marked “after”.</span>
  </footer>
</div>
<script>
(function () {
'use strict';

/* =========================================================
   The deck. Every card is a question, never an answer.
   Direct quotations are marked by their source; anything
   adapted is attributed "after ...".
   ========================================================= */
var SUITS = {
  roots:   { name: 'Roots',   about: 'where you come from and what formed you' },
  others:  { name: 'Others',  about: 'relationships, community and what you give' },
  time:    { name: 'Time',    about: 'change, mortality and the seasons of a life' },
  mystery: { name: 'Mystery', about: 'the sacred, the unknown and awe' }
};
var SUIT_KEYS = ['roots', 'others', 'time', 'mystery'];

// [id, question, source, context, tradition, strand]
var RAW = {
  roots: [
    ['ro-01', 'What was your original face before your parents were born?', 'Zen koan, after Huineng', 'Built on Huineng\'s question in The Gateless Gate (case 23): not thinking of good or evil, what is your original face? A koan is not solved by argument; you carry it.', 'Buddhist', 'Zen'],
    ['ro-02', 'Whose path have you been trying to walk well, when your own might suit you better even walked badly?', 'after the Bhagavad Gita 3.35', 'Krishna tells Arjuna it is better to follow your own dharma (svadharma) imperfectly than another\'s perfectly.', 'Hindu', 'Bhagavad Gita'],
    ['ro-03', 'In the last week, when were you your own friend, and when were you your own enemy?', 'after the Bhagavad Gita 6.5', 'Krishna: lift yourself by yourself and do not let yourself sink, for the self alone is your friend and the self alone is your enemy. (Paraphrased.)', 'Hindu', 'Bhagavad Gita'],
    ['ro-04', 'Which of your beliefs did you inherit, and which have you actually tested?', 'after al-Ghazali, Deliverance from Error', 'Al-Ghazali (d. 1111) noticed that children of Christians, Jews and Muslims tend to grow up in their parents\' faith, and set out to test what he had only received by imitation (taqlid).', 'Islamic and Sufi', 'Sufi'],
    ['ro-05', 'What are you separated from that you still miss, and what does the missing tell you about what you love?', 'after Rumi, the Song of the Reed', 'The Masnavi opens with a reed flute lamenting that it was cut from the reed bed. In Sufi reading, the longing itself points back to its source.', 'Islamic and Sufi', 'Sufi'],
    ['ro-06', 'Where are you in your world? Of the years you have had so far, how far have you come?', 'after Martin Buber, The Way of Man', 'Buber retells how Rabbi Shneur Zalman, jailed in St Petersburg, explained God\'s question to Adam, "Where are you?" (Genesis 3:9): it is asked of every person in every age.', 'Jewish', 'Hasidic'],
    ['ro-07', 'Where are you trying to be someone admirable instead of being more fully yourself?', 'after Rabbi Zusya of Hanipol', 'A Hasidic story: Zusya said that in the world to come he would not be asked "Why were you not Moses?" but "Why were you not Zusya?"', 'Jewish', 'Hasidic'],
    ['ro-08', 'Which of your traits is turned up too high right now, and which too low?', 'after Mussar teaching on middot', 'Mussar, a Jewish ethical practice revived by Rabbi Israel Salanter in 19th-century Lithuania, holds that every trait (middah) has a right measure. Even humility can be overdone.', 'Jewish', 'Mussar'],
    ['ro-09', 'What does the soft animal of your body love that you keep talking yourself out of?', 'after Mary Oliver, Wild Geese', '"You do not have to be good," the poem begins. "You only have to let the soft animal of your body / love what it loves."', 'Poets and writers', ''],
    ['ro-10', 'In what part of your life are you trying hardest to be someone other than who you are?', 'after Kierkegaard, The Sickness unto Death', 'Writing as Anti-Climacus in 1849, Kierkegaard describes a quiet despair: wanting to be rid of the self you actually are.', 'Christian', 'Kierkegaard'],
    ['ro-11', 'What were you raised to think you naturally are, that you later found you had learned?', 'after Simone de Beauvoir, The Second Sex', '"One is not born, but rather becomes, a woman" (1949): de Beauvoir\'s case that much of what seems natural in us is made.', 'Existentialist and absurdist', ''],
    ['ro-12', 'What do you owe the people who raised you, and what don\'t you owe them?', 'after Confucius, Analects 4.18', 'Xiao (care for parents) runs through the Analects, but Confucius also says that when parents are wrong you should tell them so, gently.', 'Confucian', ''],
    ['ro-13', 'What do you understand about other people that you haven\'t yet turned on yourself?', 'after Laozi, Daodejing 33', '"One who knows others is clever; one who knows oneself is clear-sighted (ming)." Translations of the line vary.', 'Daoist', 'Laozi'],
    ['ro-14', 'What part of you was once called useless, and has it turned out to protect you?', 'after Zhuangzi, chapter 4', 'A carpenter dismisses a huge shrine oak as useless timber. That night the tree tells him in a dream that being useless is how it lived so long.', 'Daoist', 'Zhuangzi'],
    ['ro-15', 'If your life spoke for you, without your explanations, what would it say you care about?', 'after the Quaker saying "Let your life speak"', 'The phrase appears in Quaker Advices & Queries no. 27. Quakers have no creed; they keep a set of queries, questions meant to be answered with how you live.', 'Christian', 'Quaker'],
    ['ro-16', 'When you say "I" today, what exactly are you pointing to?', 'after Ramana Maharshi, Who Am I?', 'Ramana Maharshi taught self-enquiry (atma vichara): when a thought arises, ask to whom it arises, and trace the "I" back to its source.', 'Hindu', 'Advaita Vedanta'],
    ['ro-17', 'Which teaching have you tried in your own life long enough to know whether it helps?', 'after the Kalama Sutta (AN 3.65)', 'The Buddha tells the Kalamas not to accept teachings on tradition or a teacher\'s authority alone, but to see for themselves whether they lead to harm or to well-being.', 'Buddhist', 'Theravada'],
    ['ro-18', 'What would you keep doing even if no one ever saw it?', 'after Rilke, Letters to a Young Poet', 'In the first letter (1903), Rilke tells Franz Kappus to stop asking editors whether his poems are good and ask himself in the stillest hour of the night: must I write?', 'Poets and writers', ''],
    ['ro-19', 'Who taught you what love looks like, and what did they get wrong?', 'after bell hooks, All About Love', 'hooks argues that many of us learned love in homes where care and harm were mixed, and borrows M. Scott Peck\'s definition: the will to extend yourself for someone\'s growth.', 'Poets and writers', ''],
    ['ro-20', 'Which habit of thought did you pick up so early that you have never examined it?', 'after Socrates, in Plato\'s Apology 38a', 'At his trial in 399 BCE Socrates said the unexamined life is not worth living, and that he would not stop questioning people even if it cost him his life.', 'Greek and Roman', 'Socratic']
  ],
  others: [
    ['ot-01', 'Who was this week actually for?', 'after Hillel, Pirkei Avot 1:14', '"If I am not for myself, who will be for me? And if I am only for myself, what am I? And if not now, when?"', 'Jewish', 'Rabbinic'],
    ['ot-02', 'What work in the world will never be finished, and which small part of it is yours this week?', 'after Rabbi Tarfon, Pirkei Avot 2:16', '"It is not your duty to finish the work, but neither are you free to neglect it."', 'Jewish', 'Rabbinic'],
    ['ot-03', 'Where are you taking up too much room, and where too little?', 'after Mussar teaching on anavah', 'Modern Mussar teachers such as Alan Morinis describe anavah (humility) as taking up your rightful space, neither more nor less.', 'Jewish', 'Mussar'],
    ['ot-04', 'Whose faults can you see clearly right now, while your own run out behind you?', 'after Abba Moses, Sayings of the Desert Fathers', 'Called to judge a brother, Abba Moses arrived carrying a leaking jug of water and said his own sins were running out behind him unseen, yet he had come to judge another\'s.', 'Christian', 'Desert Fathers'],
    ['ot-05', 'Who do you find hard to respect, and what would looking for "that of God" in them involve this week?', 'after Quaker Advices & Queries no. 17', 'Quakers speak of "that of God in everyone", a phrase from George Fox in 1656. Query 17 asks whether you respect it even when it shows up in unfamiliar ways.', 'Christian', 'Quaker'],
    ['ot-06', 'Whose advice have you been hearing without really listening to?', 'after the Rule of St Benedict, Prologue', 'The Rule, written for monks around 530, opens with the word "Listen" and asks the reader to attend with the ear of the heart.', 'Christian', 'Benedictine'],
    ['ot-07', 'Who needed your full attention this week, and did they get it?', 'after Simone Weil, letter to Joë Bousquet', 'Weil, a French philosopher drawn to Christian mysticism, wrote in 1942 that "attention is the rarest and purest form of generosity."', 'Christian', 'Christian mystic'],
    ['ot-08', 'In what I did for others today, was I wholehearted? With friends, was I trustworthy? Did I practise what I was taught?', 'after Zengzi, Analects 1.4', 'Zengzi, a disciple of Confucius, said he examined himself on these three points every day.', 'Confucian', ''],
    ['ot-09', 'What did someone do to you that you have since done to someone else?', 'after Confucius, Analects 15.24', 'Asked for one word to live by, Confucius chose shu (reciprocity): what you would not want for yourself, do not do to others.', 'Confucian', ''],
    ['ot-10', 'When did you last move to help someone before you had time to think about it?', 'after Mencius 2A:6', 'Mencius argued that anyone who suddenly saw a child about to fall into a well would feel alarm and compassion: the sprout of ren (humaneness) in everyone.', 'Confucian', 'Mencius'],
    ['ot-11', 'Who are you likely to find difficult tomorrow, and what do you have in common with them?', 'after Marcus Aurelius, Meditations 2.1', 'Marcus reminds himself each morning that he will meet ungrateful and arrogant people, and that they share his nature, so he cannot be angry with his own kin.', 'Greek and Roman', 'Stoic'],
    ['ot-12', 'Which friend would you like to eat with more often, and what is in the way?', 'after Epicurus, Principal Doctrines 27', 'Epicurus lived with friends in his Garden in Athens and called friendship by far the greatest thing wisdom provides for a happy life.', 'Greek and Roman', 'Epicurean'],
    ['ot-13', 'Which of your friendships run on usefulness, which on fun, and which on who you both are?', 'after Aristotle, Nicomachean Ethics VIII', 'Aristotle sorts friendships by what holds them together: utility, pleasure or character. Only the last kind, he says, tends to last.', 'Greek and Roman', 'Aristotelian'],
    ['ot-14', 'Whose freedom does your freedom rest on, and are you helping theirs?', 'after Simone de Beauvoir, The Ethics of Ambiguity', 'De Beauvoir (1947): "To will oneself free is also to will others free."', 'Existentialist and absurdist', ''],
    ['ot-15', 'Who has made you who you are this year, without either of you noticing?', 'after Ubuntu: umuntu ngumuntu ngabantu', 'A Nguni saying from southern Africa: a person is a person through other people. Desmond Tutu described it as your humanity being bound up in other people\'s.', 'Ubuntu', ''],
    ['ot-16', 'Who is waiting for you to acknowledge something before either of you can move on?', 'after Desmond Tutu, No Future Without Forgiveness', 'Tutu chaired South Africa\'s Truth and Reconciliation Commission and grounded its approach in ubuntu: harm done to one person diminishes everyone.', 'Ubuntu', ''],
    ['ot-17', 'What have you received lately that you have not given anything back for?', 'after Robin Wall Kimmerer, Braiding Sweetgrass', 'Kimmerer, a Potawatomi botanist, writes that "all flourishing is mutual": a gift starts a relationship, and the relationship asks something of you.', 'Potawatomi (Kimmerer)', ''],
    ['ot-18', 'What did you take today that you could have asked for, or taken less of?', 'after Kimmerer, the Honorable Harvest', 'Kimmerer\'s account of the Honorable Harvest includes: ask permission, take only what you need, never take more than half, and give a gift in return.', 'Potawatomi (Kimmerer)', ''],
    ['ot-19', 'Whose view of your town do you rarely hear, and how could you hear it this week?', 'after Gustavo Gutiérrez, A Theology of Liberation', 'Gutiérrez, a Peruvian priest, argued that faith should be read from the side of the poor, which liberation theology calls the preferential option for the poor.', 'Christian', 'Liberation theology'],
    ['ot-20', 'Who is the hardest person for you to wish well, and what exactly would you wish them if you tried?', 'after metta practice, as set out in the Visuddhimagga', 'Metta (loving-kindness) practice moves outward in stages: yourself, a dear friend, a neutral person, and finally someone hostile.', 'Buddhist', 'Theravada'],
    ['ot-21', 'Where this week did you act from love without enough knowledge, or from knowledge without love?', 'after Bertrand Russell, What I Believe', 'Russell, a secular humanist, wrote in 1925 that "the good life is one inspired by love and guided by knowledge."', 'Humanist', ''],
    ['ot-22', 'Who did you make a little happier today, and how?', 'after Robert Ingersoll\'s creed', 'The 19th-century American freethinker\'s creed: "Happiness is the only good. The place to be happy is here. The time to be happy is now. The way to be happy is to make others so."', 'Humanist', ''],
    ['ot-23', 'Where are you pushing against something that would give way if you went around it?', 'after Laozi, Daodejing 8 and 78', 'Laozi praises water: it benefits everything without contending, settles in the low places people avoid, and nothing is better at wearing down the hard.', 'Daoist', 'Laozi'],
    ['ot-24', 'Who do you assume you understand, and how would you know if you didn\'t?', 'after Zhuangzi, chapter 17', 'On a bridge over the Hao, Huizi asks: "You are not a fish, so how do you know what fish enjoy?" Zhuangzi: "You are not me, so how do you know I don\'t know?"', 'Daoist', 'Zhuangzi'],
    ['ot-25', 'What did you use today that came from people you will never meet?', 'after Thich Nhat Hanh, on interbeing', 'The Vietnamese Zen teacher said that if you look closely at a sheet of paper you can see the cloud, the rain, the tree and the logger in it.', 'Buddhist', 'Zen']
  ],
  time: [
    ['ti-01', 'Where today did you feel most alive, and where most drained?', 'after the Ignatian examen', 'Ignatius of Loyola asked his companions to review each day, noticing consolation (being drawn toward life and love) and desolation (being drawn away).', 'Christian', 'Ignatian'],
    ['ti-02', 'What from five years ago makes sense to you now that didn\'t at the time?', 'after Kierkegaard\'s journals, 1843', 'Kierkegaard wrote that life can only be understood backwards, but it must be lived forwards.', 'Christian', 'Kierkegaard'],
    ['ti-03', 'Which old situation are you likely to meet again soon, and what will you do differently this time?', 'after Maimonides, Laws of Teshuvah 2:1', 'Maimonides says complete teshuvah (return) is when the same situation comes round again, with the same pull, and you choose differently.', 'Jewish', 'Rabbinic'],
    ['ti-04', 'If one day a week were set apart from making and getting, what would you stop doing first?', 'after Abraham Joshua Heschel, The Sabbath', 'Heschel (1951) called the Sabbath "a palace in time": one day given to time itself rather than to things.', 'Jewish', 'Sabbath'],
    ['ti-05', 'If you watched one trait each evening this week, which would you choose, and what did today show you about it?', 'after Menachem Mendel Lefin, Cheshbon HaNefesh', 'Cheshbon hanefesh means "accounting of the soul". Lefin\'s 19th-century manual has you work on one trait a week, a method he adapted from Benjamin Franklin.', 'Jewish', 'Mussar'],
    ['ti-06', 'What are you doing mostly for the result, and would you still do it if the result never came?', 'after the Bhagavad Gita 2.47', 'On the eve of battle, Krishna tells Arjuna he has a right to his action but never to its fruits. This is the root of karma yoga.', 'Hindu', 'Bhagavad Gita'],
    ['ti-07', 'Which stage of life are you in, and are you living as if you were in another?', 'after the ashrama system', 'Classical Hindu texts describe four ashramas, or life stages: student, householder, forest-dweller (a gradual withdrawal) and renunciant.', 'Hindu', 'Dharma texts'],
    ['ti-08', 'Who or what that you love will change or be gone one day, and how would remembering that change today?', 'after the Five Remembrances (AN 5.57)', 'The Buddha recommends recalling often that ageing, illness, death and separation from what we love will come, and that our actions are what we truly own.', 'Buddhist', 'Theravada'],
    ['ti-09', 'What hurt you this week, and what did you add to it yourself?', 'after the Sallatha Sutta (SN 36.6)', 'The Buddha compares pain to being struck by an arrow, and the worry and resistance we add to being struck by a second one.', 'Buddhist', 'Theravada'],
    ['ti-10', 'What ordinary task is waiting for you that you could do with your whole attention?', 'after Zhaozhou, The Gateless Gate, case 7', 'A new monk asked Zhaozhou for teaching. "Have you eaten your rice porridge?" "Yes." "Then wash your bowl."', 'Buddhist', 'Zen'],
    ['ti-11', 'What are you now so expert at that you have stopped seeing it?', 'after Shunryu Suzuki, Zen Mind, Beginner\'s Mind', 'Suzuki (1970): "In the beginner\'s mind there are many possibilities, but in the expert\'s there are few."', 'Buddhist', 'Zen'],
    ['ti-12', 'What could you put down this season that you are carrying out of habit?', 'after Laozi, Daodejing 48', '"In pursuit of learning, every day something is added. In pursuit of the Dao, every day something is dropped." Translations vary.', 'Daoist', 'Laozi'],
    ['ti-13', 'Think of a death that changed you. What did you understand about change afterwards that you hadn\'t before?', 'after Zhuangzi, chapter 18', 'When his wife died, Zhuangzi was found drumming on a basin and singing. He said he had grieved, then came to see her death as part of the turning of the seasons.', 'Daoist', 'Zhuangzi'],
    ['ti-14', 'If you summed up each decade of your life so far in one line, what would the lines say?', 'after Confucius, Analects 2.4', '"At fifteen I set my heart on learning. At thirty I took my stand. At forty I had no doubts..." Confucius describes his life by decades, up to seventy.', 'Confucian', ''],
    ['ti-15', 'What are you worrying about that isn\'t up to you, and which small part of it is?', 'after Epictetus, Enchiridion 1', 'Epictetus, who was born enslaved, opens his handbook: some things are up to us and some are not.', 'Greek and Roman', 'Stoic'],
    ['ti-16', 'Who or what has been taking your time this month without your agreement?', 'after Seneca, On the Shortness of Life', 'Seneca observes that people guard their money and land closely but let others take their time freely, the one thing it is right to be stingy with.', 'Greek and Roman', 'Stoic'],
    ['ti-17', 'If this were your last month, which conversation would you stop putting off?', 'after Marcus Aurelius, Meditations 2.11', 'Marcus reminds himself that he could leave life at any moment, and lets that shape what he does, says and thinks.', 'Greek and Roman', 'Stoic'],
    ['ti-18', 'What do you want right now, and what happens to you if you get it, and if you don\'t?', 'after Epicurus, Vatican Sayings 71', 'Epicurus proposed asking of every desire: what will happen to me if it is fulfilled, and what if it is not?', 'Greek and Roman', 'Epicurean'],

      rosette(W / 2 + dx, H / 2 + dy, 56, 18, 10, 4, 0.55);

function doShuffle() {
  if (shuffling) return;
  order = shuffleArr(activeIds());
  shuffles++;
  var finish = function () {
    shuffling = false;
    var b = $('#btn-shuffle'); if (b) b.textContent = 'Shuffle again';
    updateDrawControls();
  };
  var cards = $$('#deck .deck-card');
  if (reduceMotion() || !cards.length || !cards[0].animate) { finish(); return; }
  shuffling = true;
  var anims = cards.map(function (c, idx) {
    var side = idx % 2 ? 1 : -1, lift = -4 - idx;
    return c.animate([
      { transform: 'translate(0,0) rotate(0deg)' },
      { transform: 'translate(' + (side * 58) + '%,' + lift + 'px) rotate(' + (side * 7) + 'deg)', offset: 0.36 },
      { transform: 'translate(' + (side * 60) + '%,' + lift + 'px) rotate(' + (side * 7.5) + 'deg)', offset: 0.5 },
      { transform: 'translate(' + (side * 6) + '%,-2px) rotate(' + side + 'deg)', offset: 0.82 },
      { transform: 'translate(0,0) rotate(0deg)' }
    ], { duration: 820, delay: idx * 28, easing: 'cubic-bezier(.3,.7,.2,1)' });
  });
  Promise.all(anims.map(function (a) { return a.finished; })).then(finish, finish);
}
function doDraw() {
  var d = state.draft, sp = SPREADS[d.spread], ids = activeIds();
  if (!shuffles || ids.length < sp.count) return;
  var setAside = {};
  DECK.forEach(function (c) { if (state.marks[c.id] === 'aside') setAside[c.id] = 1; });
  var pool = (order || shuffleArr(ids.slice())).filter(function (id) { return !setAside[id]; });
  if (pool.length < sp.count) pool = shuffleArr(ids.slice());
  var a = d.a.trim(), b = d.b.trim(), pos = sp.positions(a, b);
  var r = {
    id: uid(), date: todayKey(), createdAt: Date.now(), spread: d.spread, bring: d.bring.trim(),
    paths: d.spread === 'cross' ? { a: a, b: b } : { a: '', b: '' }, example: false,
    cards: pool.slice(0, sp.count).map(function (id, i) { return { cardId: id, position: pos[i], answer: '', answeredAt: null }; })
  };
  var deckEl = $('#deck'), from = deckEl ? deckEl.getBoundingClientRect() : null;
  state.readings.push(r);
  state.draft = emptyDraft();
  save();
  order = null; shuffles = 0; dealtId = r.id; flipped = new Set(); putbackOpen = false;
  render();
  animateDeal(from);
  var h = $('#today-h'); if (h) h.focus({ preventScroll: true });
}
function animateDeal(from) {
  if (!from || reduceMotion()) return;
  $$('.dealt .flip').forEach(function (el, i) {
    if (!el.animate) return;
    var to = el.getBoundingClientRect();
    if (!to.width) return;
    var dx = from.left - to.left, dy = from.top - to.top, s = from.width / to.width;
    el.animate([
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')', opacity: 0.4 },
      { transform: 'translate(0,0) scale(1)', opacity: 1 }
    ], { duration: 680, delay: i * 170, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards' });
  });
}
function turn(i, keepFocus) {
  var el = $('.flip[data-flip="' + i + '"]');
  if (!el || flipped.has(i)) return;
  flipped.add(i);
  var front = $('.flip-front', el), back = $('.flip-back', el), after = el.parentElement.querySelector('.after-flip');
  var hadFocus = back && document.activeElement === back;
  front.removeAttribute('inert');
  el.classList.add('is-flipped');
  var done = function () { if (back && back.parentNode) back.parentNode.removeChild(back); el.classList.add('static'); };
  if (reduceMotion()) done(); else setTimeout(done, 780);
  if (after) after.hidden = false;
  if (hadFocus && !keepFocus) { var c = $('.card', front); if (c) c.focus({ preventScroll: true }); }
  var r = todaysReading();
  if (r && r.cards.every(function (c, j) { return flipped.has(j); })) { var tr = $('#turn-row'); if (tr) tr.hidden = true; }
}

/* ---------- About the randomness ---------- */
function renderAbout() {
  var n = activeIds().length, pct1 = (100 / n).toFixed(1), pct3 = (300 / n).toFixed(1), even = evenOddsDay(n);
  view.innerHTML =
    '<div class="about">' +
      '<div class="prose">' +
        '<div><h1 class="view-title" tabindex="-1">About the randomness</h1></div>' +
        '<p class="lede">A plain account of what the shuffle does and what it can’t do.</p>' +
        '<h2>What the shuffle does</h2>' +
        '<p>When you press Shuffle, the app puts the cards in a new order using your browser’s cryptographic random number generator (<code>crypto.getRandomValues</code>) and the Fisher-Yates method. Every possible order of the deck is equally likely. With ' + n + ' cards in play there are about ' + ordersHTML(n) + ' orders, so the one you get has almost certainly never been dealt before. Drawing takes cards from the top of that order.</p>' +
        '<p>Shuffling more than once doesn’t make the order more random. One shuffle is already fair. Shuffle as many times as you like; that part is for you.</p>' +
        '<h2>What chance knows</h2>' +
        '<p>Nothing. It can’t see what you wrote, what day it is or how you feel. The card has no message meant for you. Its use is that you didn’t choose it. Left to ourselves we tend to pick the questions we already know how to answer, and a random card interrupts that habit by handing you one you might have avoided.</p>' +
        '<p>If a question lands, that is because of what you brought to it. If it doesn’t, put it down, or set it aside in The deck.</p>' +
        '<h2>Fairness</h2>' +
        '<p>Cards you set aside are taken out until you restore them. Cards you keep close are not weighted; they have the same chance as every other card. Within one reading no card appears twice. Between readings the whole deck goes back together, so questions do return, sooner than most people expect: drawing one card a day from ' + n + ' cards, there is an even chance of a repeat by day ' + even + '. This is the birthday problem, and it is why Returning questions fills up.</p>' +
        '<h2>An old practice</h2>' +
        '<p>People have used chance to get unstuck for a long time. The I Ching is consulted by dividing yarrow stalks or throwing coins. In Book 8 of his Confessions, Augustine hears a child’s voice in a Milan garden saying “take up and read”, opens Paul’s letters at random and reads the first passage he sees. Tarot began as a card game in 15th-century Italy and was only later used for divination. This deck uses the same gesture without claiming the cards know anything.</p>' +
      '</div>' +
      '<aside class="figures" aria-label="The numbers right now"><p class="mini-label">The numbers right now</p><dl>' +
        '<div><dt>Cards in the deck</dt><dd>' + n + '<small>' + (DECK.length - n ? (DECK.length - n) + ' set aside' : 'none set aside') + '</small></dd></div>' +
        '<div><dt>Possible orders</dt><dd>' + ordersHTML(n) + '<small>' + n + ' factorial</small></dd></div>' +
        '<div><dt>A given card, one-card spread</dt><dd>1 in ' + n + '<small>' + pct1 + '% per draw</small></dd></div>' +
        '<div><dt>A given card, three-card spread</dt><dd>3 in ' + n + '<small>' + pct3 + '% per draw</small></dd></div>' +
        '<div><dt>Even odds of a repeat</dt><dd>Day ' + even + '<small>drawing one card a day</small></dd></div>' +
        '<div><dt>Generator in this browser</dt><dd class="dd-text">' + (HAS_CRYPTO ? 'crypto.getRandomValues' : 'Math.random') + '<small>' + (HAS_CRYPTO ? 'cryptographic, with rejection sampling so no card is favoured' : 'this browser has no cryptographic generator; draws are unpredictable but less rigorously random') + '</small></dd></div>' +
      '</dl></aside>' +
    '</div>';
}

var app = document.getElementById('app');

app.addEventListener('click', function (e) {
  var t = e.target.closest('button, .deck');
  if (!t || !app.contains(t)) return;

  var v = t.getAttribute('data-view');
  if (v) { go(v, true); return; }
  var g = t.getAttribute('data-goto');
  if (g) {
    if (g === 'deck') { deckStatus = t.getAttribute('data-status') || 'all'; deckSuit = 'all'; deckFam = 'all'; }
    go(g, true); return;
  }
  if (t.id === 'deck' || t.id === 'btn-shuffle') { doShuffle(); return; }
  if (t.id === 'btn-draw') { doDraw(); return; }
  if (t.id === 'btn-turn-all') {
    var r = todaysReading(); if (!r) return;
    r.cards.forEach(function (c, i) { setTimeout(function () { turn(i, true); }, reduceMotion() ? 0 : i * 220); });
    setTimeout(function () { var c = $('.dealt .card'); if (c) c.focus({ preventScroll: true }); }, reduceMotion() ? 10 : r.cards.length * 220 + 100);
    return;
  }
  var ti = t.getAttribute('data-turn');
  if (ti !== null) { turn(Number(ti)); return; }

  var mk = t.getAttribute('data-mark');
  if (mk) {
    var id = t.getAttribute('data-card'), cur = state.marks[id];
    if (mk === 'keep') { if (cur === 'keep') delete state.marks[id]; else state.marks[id] = 'keep'; }
    else if (mk === 'aside') state.marks[id] = 'aside';
    else if (mk === 'restore') delete state.marks[id];
    save();
    var sel = mk === 'keep' ? '[data-mark="keep"][data-card="' + id + '"]' : '[data-card="' + id + '"][data-mark="' + (state.marks[id] === 'aside' ? 'restore' : 'aside') + '"]';
    rerenderKeeping(sel);
    return;
  }
  var bs = t.getAttribute('data-book-suit');
  if (bs) { bookSuit = bs; rerenderKeeping('[data-book-suit="' + bs + '"]'); return; }
  var ds = t.getAttribute('data-deck-suit');
  if (ds) { deckSuit = ds; rerenderKeeping('[data-deck-suit="' + ds + '"]'); return; }

  var act = t.getAttribute('data-action');
  if (!act) return;
  if (act === 'clear-examples') {
    state.readings = state.readings.filter(function (r) { return !r.example; });
    state.examplesCleared = true;
    save(); render();
    setToast('Examples cleared. Everything here from now on is yours.');
    var h = $('.view-title', view); if (h) h.focus();
  } else if (act === 'putback') { putbackOpen = true; rerenderKeeping('[data-action="putback-no"]'); }
  else if (act === 'putback-no') { putbackOpen = false; rerenderKeeping('[data-action="putback"]'); }
  else if (act === 'putback-yes') {
    var tr = todaysReading();
    if (tr && !tr.cards.some(function (c) { return c.answer.trim(); })) {
      state.readings = state.readings.filter(function (r) { return r !== tr; });
      state.draft = { bring: tr.bring, spread: tr.spread, a: tr.paths.a, b: tr.paths.b };
      save();
    }
    putbackOpen = false; dealtId = null; flipped = new Set(); render();
    var h2 = $('#today-h'); if (h2) h2.focus();
  } else if (act === 'edit') { editing = t.getAttribute('data-key'); render(); var ta = $('textarea[data-answer="' + editing + '"]'); if (ta) ta.focus(); }
  else if (act === 'edit-done') { var k = t.getAttribute('data-key'); editing = null; render(); var eb = $('[data-action="edit"][data-key="' + k + '"]'); if (eb) eb.focus(); }
  else if (act === 'book-reset') { bookSuit = 'all'; bookFam = 'all'; render(); }
  else if (act === 'deck-reset') { deckSuit = 'all'; deckFam = 'all'; deckStatus = 'all'; render(); }
  else if (act === 'copy') {
    var ex = $('#export-text'), st = $('#copy-status');
    ex.value = exportJSON();
    var fallback = function () { ex.focus(); ex.select(); st.textContent = 'Couldn’t copy automatically. The text is selected: press Ctrl+C (or Cmd+C on a Mac).'; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ex.value).then(function () { st.textContent = 'Copied ' + plural(state.readings.length, 'reading') + ' to the clipboard.'; }, fallback);
      } else fallback();
    } catch (err) { fallback(); }
  } else if (act === 'import') {
    var ist = $('#import-status'), txt = $('#import-text').value.trim();
    if (!txt) { ist.textContent = 'Paste exported JSON into the box first.'; return; }
    var parsed;
    try { parsed = JSON.parse(txt); } catch (err) { ist.textContent = 'That isn’t valid JSON. Check that you copied the whole export, from the first { to the last }.'; return; }
    var data = normalize(parsed && parsed.data ? parsed.data : parsed);
    if (!data) { ist.textContent = 'That JSON doesn’t look like a Question Deck export. It needs a list of readings.'; return; }
    state = data; dealtId = null; flipped = new Set(); save(); render();
    var ist2 = $('#import-status');
    if (ist2) ist2.textContent = 'Imported ' + plural(state.readings.length, 'reading') + ' and ' + plural(Object.keys(state.marks).length, 'card mark') + '.';
  } else if (act === 'erase') { $('#erase-confirm').hidden = false; $('[data-action="erase-no"]').focus(); }
  else if (act === 'erase-no') { $('#erase-confirm').hidden = true; $('[data-action="erase"]').focus(); }
  else if (act === 'erase-yes') {
    state = freshState(false); dealtId = null; flipped = new Set(); order = null; shuffles = 0;
    try { window.localStorage.removeItem(KEY); } catch (err) { /* ignore */ }
    save(); render();
    var es = $('#erase-status'); if (es) es.textContent = 'Everything on this device has been erased.';
    var eh = $('.view-title', view); if (eh) eh.focus();
  }
});

function rerenderKeeping(selector) {
  var y = window.scrollY;
  render();
  window.scrollTo(0, y);
  var el = selector ? $(selector, view) : null;
  if (el) el.focus({ preventScroll: true });
}

var answerTimers = {};
app.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'bring') { state.draft.bring = t.value; saveSoon(); return; }
  if (t.id === 'path-a' || t.id === 'path-b') {
    state.draft[t.id === 'path-a' ? 'a' : 'b'] = t.value; saveSoon();
    var sl = $('#slots'); if (sl) sl.innerHTML = slotsHTML();
    return;
  }
  var key = t.getAttribute('data-answer');
  if (key) {
    var p = key.split(':'), r = findReading(p[0]), i = Number(p[1]);
    if (!r || !r.cards[i]) return;
    r.cards[i].answer = t.value.slice(0, 20000);
    r.cards[i].answeredAt = Date.now();
    var pb = $('#putback'); if (pb && t.value.trim()) pb.hidden = true;
    clearTimeout(answerTimers[key]);
    answerTimers[key] = setTimeout(function () {
      save();
      $$('[data-status="' + key + '"]').forEach(function (s) { s.textContent = savedNote(); });
    }, 500);
  }
});
app.addEventListener('change', function (e) {
  var t = e.target;
  if (t.name === 'spread') { state.draft.spread = t.value; saveSoon(); updateDrawControls(); return; }
  if (t.id === 'book-fam') { bookFam = t.value; rerenderKeeping('#book-fam'); return; }
  if (t.id === 'deck-status') { deckStatus = t.value; rerenderKeeping('#deck-status'); return; }
  if (t.id === 'deck-fam') { deckFam = t.value; rerenderKeeping('#deck-fam'); return; }
});
window.addEventListener('beforeunload', function () { if (saveTimer) save(); });

// Theme changes: repaint plates and backs in the new inks.
try {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onTheme = function () { requestAnimationFrame(repaintAll); };
  if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
} catch (e) { /* ignore */ }

// The reading is pinned for the day; at midnight it moves into the book.
var lastDay = todayKey();
setInterval(function () {
  var k = todayKey();
  if (k !== lastDay) {
    lastDay = k;
    var active = document.activeElement;
    if (current === 'today' && !(active && active.tagName === 'TEXTAREA')) { dealtId = null; render(); }
  }
}, 60000);

$('#tagline').textContent = 'Shuffle, draw one of ' + DECK.length + ' questions taken from real traditions and writers, carry it through the day, and write your own answer.';
makeBack();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { $$('canvas[data-pattern]').forEach(paintPattern); });
})();
</script>
</body>
</html>
