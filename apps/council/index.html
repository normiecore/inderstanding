<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Council</title>
<style>
/* Design plan.
   Layout: a chamber. In a hearing the green baize table, seen from above, holds one side and the
   speaker's floor the other; the casebook reads as a bound law report (citation, catchwords, headnote,
   held, ratio). The boldness is the baize table and its brass needle; everything else is paper and ink. */
:root {
  --paper: #EDF0EB;      /* report page: cool grey-green, deliberately not cream */
  --ink: #18211D;        /* green-black */
  --baize: #2B5944;      /* the table */
  --brass: #A8781C;      /* speaker, needle, focus */
  --claret: #8C2C2A;     /* overruled, struck through */
  --font-display: "Libre Caslon Display", "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --font-text: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --font-label: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;

  /* derived tokens */
  --leaf: #F8FAF6;
  --muted: #55615A;
  --rule: #C7CEC5;
  --rule-strong: #8E998F;
  --brass-ink: #7A5410;
  --brass-lit: #D9AE4A;
  --ink-on-brass: #1E1708;
  --rim: #3D3127;
  --on-baize: #E8F0EA;
  --wash: #E1E7E0;
  --shadow: 0 1px 0 rgba(24, 33, 29, .06), 0 10px 28px -18px rgba(24, 33, 29, .45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1512; --ink: #E3E9E2; --baize: #285640; --brass: #D3A546; --claret: #E58C80;
    --leaf: #161E1A; --muted: #9EAAA2; --rule: #2B3630; --rule-strong: #52615A; --brass-ink: #E2BC66;
    --brass-lit: #E0B451; --rim: #2E241C; --on-baize: #E8F0EA; --wash: #1E2924;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -18px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1512; --ink: #E3E9E2; --baize: #285640; --brass: #D3A546; --claret: #E58C80;
  --leaf: #161E1A; --muted: #9EAAA2; --rule: #2B3630; --rule-strong: #52615A; --brass-ink: #E2BC66;
  --brass-lit: #E0B451; --rim: #2E241C; --on-baize: #E8F0EA; --wash: #1E2924;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 28px -18px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-text); font-size: 17px; line-height: 1.55; }
.council { padding-inline: clamp(16px, 4vw, 40px); padding-block: 0 56px; }
.frame { max-width: 1240px; margin-inline: auto; }
h1, h2, h3 { text-wrap: balance; font-weight: 400; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Masthead: a running head with a double rule, as on a law report page */
.masthead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.mast { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 24px; padding-block: 16px 8px; border-bottom: 3px double var(--ink); }
.brand { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; }
.brand-name { font-family: var(--font-display); font-size: 38px; line-height: 1; letter-spacing: .01em; }
.brand-sub { font-family: var(--font-label); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 2px 4px; flex-wrap: wrap; margin-inline: -8px; }
.tab { font-family: var(--font-label); font-size: 14px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px; min-height: 40px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brass); }
.badge { font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: 0; padding: 0 6px; border-radius: 9px; background: var(--wash); color: var(--ink); line-height: 18px; }
.badge.due { background: var(--brass-lit); color: var(--ink-on-brass); }
@media (max-width: 640px) {
  .masthead { position: static; }
  .brand-name { font-size: 32px; }
  .tabs { width: 100%; margin-inline: 0; justify-content: space-between; flex-wrap: nowrap; }
  .tab { font-size: 12.5px; letter-spacing: .05em; padding-inline: 0; gap: 4px; }
}

.example-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 10px; border-bottom: 1px solid var(--rule); font-size: 15px; }
.example-bar p { max-width: 60rem; }
.tag { display: inline-block; font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--brass); color: var(--brass-ink); padding: 0 6px; border-radius: 2px; line-height: 18px; vertical-align: middle; font-style: normal; }

/* Buttons */
.btn { font-family: var(--font-label); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; padding: 10px 16px; min-height: 44px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 2px; cursor: pointer; text-align: center; }
.btn:hover { background: var(--wash); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--ink); opacity: .88; }
.btn-danger { border-color: var(--claret); color: var(--claret); }
.btn-danger-solid { border-color: var(--claret); background: var(--claret); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-text { background: none; border: 0; padding: 4px 0; min-height: 32px; font-family: var(--font-label); font-size: 14px; letter-spacing: .03em; color: var(--ink); text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 3px; cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }

/* Shared type */
.kicker, .legend, .field > label, .k { font-family: var(--font-label); font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend { display: block; margin: 0 0 8px; padding: 0; }
.view-head { padding-block: 28px 8px; display: grid; gap: 8px; }
.view-title { font-family: var(--font-display); font-size: clamp(34px, 5vw, 52px); line-height: 1.05; margin: 0; }
.lede { font-size: 18px; max-width: 40rem; color: var(--ink); }
.hint { font-size: 14.5px; color: var(--muted); max-width: 40rem; }
.err { color: var(--claret); font-size: 15px; }
.err:empty { display: none; }
.status { font-family: var(--font-label); font-size: 14px; color: var(--muted); }

/* The chamber: table on one side, speaker's floor on the other */
.chamber { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 24px 48px; align-items: start; margin-top: 24px; }
.table-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); }
@media (max-width: 880px) {
  .chamber { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .table-col { position: static; }
}
.table-svg { display: block; width: 100%; height: auto; max-width: 500px; margin-inline: auto; }
.t-shadow { fill: var(--ink); opacity: .10; }
.t-rim { fill: var(--rim); }
.t-top { fill: var(--baize); }
.t-inlay { fill: none; stroke: var(--brass); stroke-width: 1.2; opacity: .6; }
.seat { cursor: pointer; }
.s-disc { fill: var(--leaf); stroke: var(--ink); stroke-width: 1.5; }
.s-glyph { fill: var(--ink); font-family: var(--font-text); font-style: italic; font-size: 17px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.s-label { fill: var(--ink); font-family: var(--font-label); font-size: 16px; text-anchor: middle; }
.seat.is-done .s-disc { fill: var(--ink); }
.seat.is-done .s-glyph { fill: var(--paper); }
.seat.is-passed .s-disc { stroke: var(--muted); stroke-dasharray: 4 3; }
.seat.is-passed .s-glyph { fill: var(--muted); }
.seat.is-current .s-disc { fill: var(--brass-lit); stroke: var(--brass); stroke-width: 2.5; }
.seat.is-current .s-glyph { fill: var(--ink-on-brass); }
.seat.is-current .s-label { font-weight: 600; }
.seat.is-focus .s-disc { stroke: var(--brass); stroke-width: 3.5; }
.seat.is-ghost { cursor: default; }
.seat.is-ghost .s-disc { fill: none; stroke: var(--rule-strong); stroke-dasharray: 3 4; }
.s-halo { fill: none; stroke: var(--brass); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
@keyframes halo { from { transform: scale(1); opacity: .85; } to { transform: scale(1.45); opacity: 0; } }
.s-dissent { fill: var(--claret); }
.s-dissent-t { fill: var(--paper); font-family: var(--font-label); font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.chair-r { fill: var(--leaf); stroke: var(--brass); stroke-width: 2; }
.chair-t { fill: var(--ink); font-family: var(--font-label); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-anchor: middle; dominant-baseline: central; }
.needle { transition: transform .7s cubic-bezier(.3, .7, .2, 1); }
.nd-blade { fill: var(--brass-lit); stroke: var(--rim); stroke-width: 1; }
.nd-tail { fill: var(--on-baize); opacity: .55; }
.nd-hub { fill: var(--brass); stroke: var(--rim); stroke-width: 1.5; }
.table-cap { text-align: center; font-family: var(--font-label); font-size: 14px; color: var(--muted); margin-top: 4px; }
.table-cap b { color: var(--ink); font-weight: 600; }

.order { list-style: none; margin: 12px auto 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 18px; max-width: 30rem; }
.order button { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 6px 4px; font-family: var(--font-text); font-size: 15px; color: var(--ink); cursor: pointer; min-height: 36px; }
.order button:hover { background: var(--wash); }
.order .n { font-family: var(--font-label); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 1.2em; }
.order .st { margin-left: auto; font-family: var(--font-label); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.order button[aria-current="true"] { background: var(--wash); }
.order button[aria-current="true"] .st { color: var(--brass-ink); font-weight: 600; }
@media (min-width: 600px) and (max-width: 880px) { .order { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: none; } }

/* Open matter header and steps */
.matter-head { padding-block: 24px 0; }
.matter-title { font-family: var(--font-display); font-size: clamp(32px, 5.2vw, 54px); line-height: 1.05; margin: 4px 0 0; overflow-wrap: anywhere; }
.matter-title .re { font-style: normal; }
.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 0 18px; padding: 0; margin: 16px 0 0; border-bottom: 1px solid var(--rule); }
.steps button { font-family: var(--font-label); font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 0; min-height: 40px; color: var(--muted); cursor: pointer; }
.steps button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--ink); }
.steps button:disabled { opacity: .45; cursor: default; }
.steps .n { font-variant-numeric: tabular-nums; margin-right: 5px; color: var(--brass-ink); }

/* Speaker's floor */
.stage { max-width: 41rem; display: grid; gap: 14px; align-content: start; }
.speaker { font-family: var(--font-display); font-size: clamp(30px, 4vw, 44px); line-height: 1.08; margin: 0; }
.speaker:focus { outline: none; }
.strand { font-style: italic; color: var(--muted); margin-top: -6px; }
.framing { font-size: 19px; line-height: 1.6; }
.questions { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.questions li { font-style: italic; font-size: 18px; line-height: 1.5; }
.questions li::marker { font-style: normal; font-family: var(--font-label); color: var(--brass-ink); }
.terms { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; padding-block: 10px; border-block: 1px solid var(--rule); font-size: 15px; }
.terms dt { font-style: italic; font-weight: 700; }
.terms dd { margin: 0; color: var(--muted); }
@media (max-width: 520px) { .terms { grid-template-columns: minmax(0, 1fr); gap: 0; } .terms dd { margin-bottom: 6px; } }
.dissent-note { font-family: var(--font-label); font-size: 13px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--claret); }
.matter-sum { border-block: 1px solid var(--rule); padding-block: 8px; font-size: 15.5px; }
.matter-sum summary { cursor: pointer; font-family: var(--font-label); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-height: 32px; display: flex; align-items: center; }
.matter-sum .facts { margin-top: 8px; }

/* Forms */
.form { display: grid; gap: 22px; max-width: 42rem; }
.field { display: grid; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
fieldset.field { min-width: 0; }
input[type="text"], input[type="date"], textarea, select { font-family: var(--font-text); font-size: 17px; line-height: 1.45; color: var(--ink); background: var(--leaf); border: 1px solid var(--rule-strong); border-radius: 2px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 4.6em; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
.prefixed { display: flex; align-items: center; gap: 10px; }
.prefixed > span { font-family: var(--font-display); font-size: 24px; }
input[type="range"] { width: 100%; accent-color: var(--brass); min-height: 32px; }
.scale-ends { display: flex; justify-content: space-between; font-family: var(--font-label); font-size: 13px; color: var(--muted); }
output { font-family: var(--font-label); color: var(--ink); text-transform: none; letter-spacing: 0; margin-left: 6px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.chip span { display: inline-flex; align-items: center; min-height: 40px; padding: 6px 13px; border: 1px solid var(--rule-strong); border-radius: 2px; font-family: var(--font-label); font-size: 15px; background: var(--leaf); }
.chip input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip input:focus-visible + span { outline: 3px solid var(--brass); outline-offset: 2px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 16px; }
.ratio-line { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: 12px; align-items: start; }
.ratio-line label { font-family: var(--font-label); font-size: 14px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-top: 12px; text-align: right; }
@media (max-width: 520px) { .ratio-line { grid-template-columns: minmax(0, 1fr); gap: 2px; } .ratio-line label { text-align: left; } }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--claret); background: var(--leaf); }
.confirm p { flex: 1 1 16rem; font-size: 15.5px; }

/* Precedent */
.prec-list { display: grid; gap: 14px; }
.prec { padding: 14px 16px; background: var(--leaf); border: 1px solid var(--rule); display: grid; gap: 10px; }
.prec-cite { font-size: 16px; }
.prec-cite .cite { font-family: var(--font-label); font-size: 14px; font-variant-numeric: tabular-nums; margin-left: 4px; }
.why { display: block; font-family: var(--font-label); font-size: 13px; color: var(--muted); margin-top: 2px; }
.prec-ratio { font-size: 16px; line-height: 1.5; }
/* When / I / because: upright small caps, so the "I" never reads as a slash */
.w { font-family: var(--font-label); font-style: normal; font-size: .7em; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); vertical-align: .08em; }

/* Roster */
.bench-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 6px; border-block: 1px solid var(--rule); }
.bench-count { font-family: var(--font-label); font-size: 15px; font-variant-numeric: tabular-nums; }
.roster { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); gap: 0 22px; }
.seat-pick { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 9px 4px; color: var(--ink); cursor: pointer; min-height: 56px; }
.seat-pick:hover { background: var(--wash); }
.seat-pick .g { grid-row: span 2; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-style: italic; font-size: 15px; }
.seat-pick .nm { font-size: 16.5px; line-height: 1.3; }
.seat-pick .sd { grid-column: 2; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.seat-pick .on { grid-column: 3; grid-row: 1 / span 2; font-family: var(--font-label); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.seat-pick[aria-pressed="true"] { background: var(--wash); }
.seat-pick[aria-pressed="true"] .g { background: var(--brass-lit); border-color: var(--brass); color: var(--ink-on-brass); }
.seat-pick[aria-pressed="true"] .on { color: var(--ink); font-weight: 600; }

/* Record and transcript */
.intro-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 40px; padding-block: 24px 0; }
.intro { font-size: 18px; line-height: 1.6; max-width: 46rem; }
.citation { font-family: var(--font-label); font-size: 15px; letter-spacing: .03em; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--ink); }
.citation .sep { color: var(--muted); }
.transcript { list-style: none; margin: 4px 0 0; padding: 0; }
.transcript > li { padding-block: 18px; border-top: 1px solid var(--rule); display: grid; gap: 8px; scroll-margin-top: 110px; }
.transcript > li.is-focus { background: linear-gradient(var(--wash), var(--wash)) no-repeat; background-size: 100% 100%; box-shadow: -12px 0 0 var(--wash), 12px 0 0 var(--wash); }
.tr-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.tr-name { font-family: var(--font-display); font-size: 24px; line-height: 1.2; }
.tr-q { font-style: italic; }
.tr-answer { font-size: 16.5px; }
.tr-answer .k { color: var(--ink); margin-right: 8px; }
.tr-passed { font-family: var(--font-label); font-size: 14px; color: var(--muted); }
.ruling-block { border-top: 3px double var(--ink); padding-top: 18px; display: grid; gap: 12px; }

/* Casebook and principles: a side column (title, index) and the reports */
.split { display: grid; grid-template-columns: minmax(0, 19rem) minmax(0, 1fr); gap: 24px 56px; align-items: start; }
.split-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); max-height: calc(100dvh - 110px); overflow-y: auto; display: grid; gap: 14px; padding-block: 28px 8px; }
.split-side .view-head { padding-block: 0; }
.split-side .lede { font-size: 17px; }
.split-main { min-width: 0; padding-top: 34px; display: grid; gap: 22px; align-content: start; }
@media (max-width: 880px) {
  .split { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .split-side { position: static; max-height: none; overflow: visible; }
  .split-main { padding-top: 0; }
}
.toc { margin-top: 6px; }
.toc ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--ink); }
.toc button { display: grid; gap: 1px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 8px 2px; font-family: var(--font-text); font-size: 15.5px; color: var(--ink); cursor: pointer; }
.toc button:hover { background: var(--wash); }
.toc .c { font-family: var(--font-label); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toc .struck { text-decoration: line-through; text-decoration-color: var(--claret); }
.reports { min-width: 0; }
.report { padding-block: 26px; border-bottom: 1px solid var(--rule); display: grid; gap: 12px; scroll-margin-top: 110px; }
.report:first-child { padding-top: 4px; }
.report.flash { animation: flash 2.4s ease-out; }
@keyframes flash { from { background: var(--wash); } to { background: transparent; } }
.case-name { font-family: var(--font-display); font-size: clamp(26px, 3.4vw, 36px); line-height: 1.12; margin: 0; overflow-wrap: anywhere; }
.case-name .re { font-style: normal; }
.catchwords { font-style: italic; color: var(--muted); font-size: 16px; }
.headnote { max-width: 42rem; }
.facts { display: grid; grid-template-columns: 10.5rem minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 15.5px; max-width: 46rem; }
.facts dt { font-family: var(--font-label); font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 3px; }
.facts dd { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
@media (max-width: 560px) { .facts { grid-template-columns: minmax(0, 1fr); gap: 0; } .facts dd { margin-bottom: 8px; } }
.held { max-width: 42rem; }
.held .k, .annot .k { color: var(--ink); font-weight: 600; margin-right: 6px; }
.ratio { padding: 14px 18px; background: var(--leaf); border: 1px solid var(--rule); max-width: 44rem; display: grid; gap: 6px; box-shadow: var(--shadow); }
.ratio-text { font-size: 19px; line-height: 1.5; }
.ratio .meta { font-family: var(--font-label); font-size: 13.5px; color: var(--muted); }
.ratio.is-overruled { box-shadow: none; }
.ratio.is-overruled .ratio-text { text-decoration: line-through; text-decoration-color: var(--claret); text-decoration-thickness: 1.5px; color: var(--muted); }
.overruled-note { color: var(--claret); font-size: 15.5px; }
.annot { font-size: 15.5px; max-width: 44rem; }
.annot ul { margin: 4px 0 0; padding-left: 1.1em; display: grid; gap: 4px; }
.review-box { padding: 16px; background: var(--leaf); border: 1px solid var(--rule-strong); max-width: 44rem; display: grid; gap: 14px; }
.due-list { display: grid; gap: 14px; margin-top: 8px; }
.cite-link { background: none; border: 0; padding: 0; font-family: var(--font-text); font-style: italic; font-size: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--brass); text-underline-offset: 3px; cursor: pointer; text-align: left; }

/* Principles */
.pgroup { margin-bottom: 26px; }
.pgroup h2 { font-family: var(--font-label); font-size: 14px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin: 0; }
.plist { list-style: none; padding: 0; margin: 0; }
.plist li { padding-block: 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.ptext { font-size: clamp(19px, 2.3vw, 24px); line-height: 1.45; max-width: 46rem; }
.psrc { font-family: var(--font-label); font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.psrc .cite-link { font-size: 15.5px; }

/* Records */
.records { display: grid; gap: 40px; max-width: 46rem; margin-top: 12px; }
.records section { display: grid; gap: 12px; }
.records h2 { font-family: var(--font-display); font-size: 28px; margin: 0; }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; line-height: 1.45; min-height: 12em; }

.foot { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--rule); font-family: var(--font-label); font-size: 13.5px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .s-halo { animation: none; opacity: .7; }
  .needle { transition: none; }
  .report.flash { animation: none; }
  html { scroll-behavior: auto; }
}

function normData(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.cases)) return null;
  const cases = d.cases.map(normCase).filter(Boolean);
  const out = { v: 1, cases: cases, openId: null, examplesCleared: !!d.examplesCleared };
  if (d.openId && cases.some(function (c) { return c.id === d.openId && c.status === 'open'; })) out.openId = d.openId;

}

  const raw = storeGet();

/* ---------- Precedent: same type, or shared words with an earlier principle ---------- */
const STOP = new Set(('that this with have from they them their there what when your would could should about which will just been were into than then also only some more most very much over such because while where after before again being does doing done each other these those whom whose yours mine ours make made want wants still even ever never always really thing things like onto upon itself myself without within around through down back take took give gave keep kept need needs know knew think year years month months week weeks time times good well many first last next whether people person').split(' '));
function words(s) {
  const out = new Set();
  String(s || '').toLowerCase().replace(/['’]/g, '').split(/[^a-z]+/).forEach(function (w) {
    if (w.length < 4 || STOP.has(w)) return;

    return o.id !== c.id && !o.overruledBy && !!o.example === !!c.example;
  }).map(function (o) {
    const theirs = words([o.title, o.ruling.when, o.ruling.i, o.ruling.because].join(' '));
    const shared = Array.from(mine).filter(function (w) { return theirs.has(w); });
    const sameType = !!c.type && o.type === c.type;
    return { o: o, shared: shared, sameType: sameType, score: (sameType ? 3 : 0) + shared.length };
  }).filter(function (r) { return r.sameType || r.shared.length >= 2; })
    .sort(function (a, b) { return b.score - a.score; }).slice(0, 5);
}

const CX = 260, CY = 192, SRX = 205, SRY = 140;

    else if (mode !== 'bench' && a.done) cls += ' is-done';
    if (mode === 'record' && ui.focusSeat === id) cls += ' is-focus';
    const ly = p.y < CY - 30 ? p.y - 34 : p.y + 42;
    seats += '<g class="' + cls + '" data-action="goto-seat" data-seat="' + id + '">';
    if (i === cur) seats += '<circle class="s-halo" cx="' + x + '" cy="' + y + '" r="24"/>';
    seats += '<circle class="s-disc" cx="' + x + '" cy="' + y + '" r="23"/>';
    seats += '<text class="s-glyph" x="' + x + '" y="' + y + '">' + esc(seatGlyph(id, c)) + '</text>';
    seats += '<text class="s-label" x="' + x + '" y="' + ly.toFixed(1) + '">' + esc(trunc(seatShort(id, c), 15)) + '</text>';
    if (id === c.dissent) {
      seats += '<circle class="s-dissent" cx="' + (p.x + 18).toFixed(1) + '" cy="' + (p.y - 18).toFixed(1) + '" r="9"/>' +
        '<text class="s-dissent-t" x="' + (p.x + 18).toFixed(1) + '" y="' + (p.y - 18).toFixed(1) + '">D</text>';
    }
    seats += '</g>';
  });

  const chairY = CY + SRY;
  const chair = '<g class="chair"><rect class="chair-r" x="' + (CX - 38) + '" y="' + (chairY - 17) + '" width="76" height="34" rx="4"/>' +
    '<text class="chair-t" x="' + CX + '" y="' + chairY + '">CHAIR</text>' +
    '<text class="s-label" x="' + CX + '" y="' + (chairY + 42) + '">You</text></g>';
  const needle = '<g class="needle" data-to="' + to.toFixed(1) + '" style="transform-origin:' + CX + 'px ' + CY + 'px;transform:rotate(' + prev.toFixed(1) + 'deg)">' +
    '<path class="nd-tail" d="M' + CX + ' ' + (CY - 3) + ' L' + (CX - 30) + ' ' + CY + ' L' + CX + ' ' + (CY + 3) + ' Z"/>' +
    '<path class="nd-blade" d="M' + CX + ' ' + (CY - 6) + ' L' + (CX + 84) + ' ' + CY + ' L' + CX + ' ' + (CY + 6) + ' Z"/>' +
    '<circle class="nd-hub" cx="' + CX + '" cy="' + CY + '" r="8"/></g>';

  return '<svg class="table-svg" viewBox="0 0 520 400" role="img" aria-label="' + esc(tableLabel(c, mode, ids, cur)) + '">' +
    '<ellipse class="t-shadow" cx="' + CX + '" cy="' + (CY + 8) + '" rx="156" ry="100"/>' +
    '<ellipse class="t-rim" cx="' + CX + '" cy="' + CY + '" rx="152" ry="97"/>' +
    '<ellipse class="t-top" cx="' + CX + '" cy="' + CY + '" rx="142" ry="87"/>' +
    '<ellipse class="t-inlay" cx="' + CX + '" cy="' + CY + '" rx="128" ry="75"/>' +
    needle + seats + chair + '</svg>';
}

function tableLabel(c, mode, ids, cur) {
  if (!ids.length) return 'The council table, seen from above. No one is seated yet; the chair is at the foot.';
  const names = ids.map(function (id) { return seatName(id, c); }).join(', ');
  let s = 'The council table, seen from above, with ' + ids.length + ' seats in speaking order: ' + names + '.';
  if (cur >= 0) s += ' Speaking now: ' + seatName(ids[cur], c) + '.';
  if (c.dissent) s += ' Dissent: ' + seatName(c.dissent, c) + '.';
  return s;
}

function tableCaption(c, mode) {
  if (!c || mode === 'empty') return 'The chair sits at the foot of the table. Seats fill when a matter is brought.';
  if (mode === 'matter') return 'The council is seated in the next step.';
  const ids = speakingOrder(c);
  if (mode === 'bench') return '<b>' + ids.length + ' seated</b>, speaking clockwise from your left' + (c.dissent ? ', dissent last' : '');
  if (mode === 'hearing') {
    const i = clamp(c.turn, 0, ids.length - 1);
    return 'Seat ' + (i + 1) + ' of ' + ids.length + ': <b>' + esc(seatName(ids[i], c)) + '</b> is speaking';
  }
  if (mode === 'ruling') return 'The council has been heard. <b>The chair rules.</b>';
  return 'Heard by ' + ids.length + ' seats. Choose a seat to read what it asked.';
}

function orderList(c, mode) {
  const ids = speakingOrder(c);
  if (!ids.length) return '';
  const cur = mode === 'hearing' ? clamp(c.turn, 0, ids.length - 1) : -1;
  return '<ol class="order" aria-label="Order of speaking">' + ids.map(function (id, i) {
    const a = answerOf(c, id);
    let st = a.passed ? 'passed' : (a.done ? 'heard' : 'waiting');
    if (i === cur) st = 'speaking';
    if (mode === 'bench') st = id === c.dissent ? 'dissent' : 'seated';
    const isCur = i === cur || (mode === 'record' && ui.focusSeat === id);
    const label = esc(seatName(id, c)) + (id === c.dissent && mode !== 'bench' ? ' (dissent)' : '');
    if (mode === 'bench') return '<li><button type="button" disabled><span class="n">' + (i + 1) + '</span><span>' + label + '</span><span class="st">' + st + '</span></button></li>';
    return '<li><button type="button" data-action="goto-seat" data-seat="' + id + '"' + (isCur ? ' aria-current="true"' : '') + '><span class="n">' + (i + 1) + '</span><span>' + label + '</span><span class="st">' + st + '</span></button></li>';
  }).join('') + '</ol>';
}

function tableInner(c, mode) {
  return tableSVG(c, mode) + '<p class="table-cap">' + tableCaption(c, mode) + '</p>' + (c && mode !== 'matter' && mode !== 'empty' ? orderList(c, mode) : '');
}
function tableCol(c, mode) { return '<div class="table-col"><div id="table-wrap">' + tableInner(c, mode) + '</div></div>'; }
function refreshTable(c, mode) {
  const w = document.getElementById('table-wrap');
  if (w) { w.innerHTML = tableInner(c, mode); animateNeedle(); }
}
function animateNeedle() {
  const nd = document.querySelector('.needle[data-to]');
  if (!nd) return;
  const to = nd.getAttribute('data-to');
  requestAnimationFrame(function () { requestAnimationFrame(function () { nd.style.transform = 'rotate(' + to + 'deg)'; }); });
}

/* ---------- Small builders ---------- */
function chip(name, id, value, label, checked) {
  return '<label class="chip"><input type="radio" name="' + esc(name) + '" id="' + esc(id) + '" value="' + esc(value) + '"' + (checked ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
}
function leaningText(c) { return c.leaning.trim() ? esc(c.leaning.trim()) + ' (' + c.strength + ' of 5)' : 'None stated'; }
function matterFacts(c) {
  return '<dl class="facts"><dt>Options</dt><dd>' + esc(c.options.trim() || 'None recorded') + '</dd><dt>Leaning at opening</dt><dd>' + leaningText(c) + '</dd></dl>';
}
function reviewMark(c) {
  const r = c.review;
  if (!r) return '';
  if (r.done) return (HELD[r.held] || 'Reviewed') + ' on review';
  return isDue(c) ? 'Review due' : 'Review listed for ' + fmtDate(r.due);
}
function ratioBox(c) {
  const bits = [CONF[(c.ruling.conf || 2) - 1]];
  const rm = reviewMark(c);
  if (rm) bits.push(rm);
  let h = '<div class="ratio' + (c.overruledBy ? ' is-overruled' : '') + '"><span class="k">Ratio</span><p class="ratio-text">' + ratioHTML(c.ruling) + '</p><p class="meta">' + esc(bits.join(' · ')) + '</p></div>';
  if (c.overruledBy) {
    const o = byId(c.overruledBy);
    h += '<p class="overruled-note">Overruled by ' + (o ? '<button type="button" class="cite-link" data-action="goto-report" data-id="' + esc(o.id) + '">' + esc(citeText(o)) + '</button>' : 'a later case') +
      (c.overruledAt ? ' on ' + fmtDate(c.overruledAt) : '') + (c.overruleReason ? ': “' + esc(c.overruleReason) + '”' : '.') + '</p>';
  }
  return h;
}

const INTRO = 'Council turns a real decision into a hearing. You state the matter, seat five to seven voices from different traditions and from your own life, and answer what each one asks. Then you rule on it yourself and write down the principle underneath. Rulings collect in a casebook and come back as precedent when a similar matter arrives, so over time the casebook shows the philosophy you actually decide by.';

/* ---------- Hearing view ---------- */
function renderHearing() {
  const open = openCase();
  let r = ui.recordId ? byId(ui.recordId) : null;
  if (r && r.status === 'ruled') return renderRecord(r, open);
  if (open) return renderOpen(open);
  r = latestRuled();
  if (r) return renderRecord(r, null);
  return renderEmpty();
}

function renderEmpty() {
  return '<div class="frame chamber">' + tableCol(null, 'empty') +
    '<div class="stage"><p class="kicker">The chamber</p><h1 class="speaker" id="stage-h" tabindex="-1">No matter is before the council</h1>' +
    '<p class="intro">' + INTRO + '</p>' +
    '<p class="hint">Bring a decision you are actually facing. It works best with something specific and not yet settled.</p>' +
    '<div class="actions"><button type="button" class="btn btn-primary" data-action="new-matter">Bring a matter</button></div></div></div>';
}

function transcriptItem(c, id) {
  const sc = seatContent(id, c);
  const a = answerOf(c, id);
  return '<li id="tr-' + id + '"' + (ui.focusSeat === id ? ' class="is-focus"' : '') + '>' +
    '<div class="tr-head"><span class="tr-name">' + esc(seatName(id, c)) + '</span>' + (sc.dissent ? '<span class="tag">Dissent</span>' : '') + '</div>' +
    '<p class="hint">' + esc(SEAT[id].strand) + '</p>' +
    '<p>' + esc(sc.f) + '</p>' + sc.qs.map(function (q) { return '<p class="tr-q">' + esc(q) + '</p>'; }).join('') +
    (a.passed || !a.text.trim() ? '<p class="tr-passed">The chair passed.</p>' : '<p class="tr-answer"><span class="k">The chair</span>' + esc(a.text) + '</p>') +
    '</li>';
}

function renderRecord(c, open) {
  const ids = speakingOrder(c);
  let h = '<div class="frame">';
  if (open) {
    h += '<div class="intro-row"><p class="intro">You have an open matter: <i>Re: ' + esc(caseTitle(open)) + '</i>.</p><div class="actions"><button type="button" class="btn btn-primary" data-action="return-open">Return to the open matter</button></div></div>';
  } else {
    const showIntro = hasExamples() || ruledCases().length < 3;
    h += '<div class="intro-row">' + (showIntro ? '<p class="intro">' + INTRO + '</p>' : '<p class="intro">The last hearing on record.</p>') +
      '<div class="actions"><button type="button" class="btn btn-primary" data-action="new-matter">Bring a new matter</button></div></div>';
  }
  h += '<div class="chamber">' + tableCol(c, 'record') + '<div class="stage">';
  h += '<p class="kicker">Hearing record ' + (c.example ? '<span class="tag">Example</span>' : '') + '</p>';
  h += '<h1 class="matter-title" id="stage-h" tabindex="-1"><span class="re">Re:</span> <i>' + esc(caseTitle(c)) + '</i></h1>';
  h += '<p class="citation"><span>' + esc(citeTail(c)) + '</span><span class="sep">·</span><span>' + esc(typeLabel(c.type)) + '</span><span class="sep">·</span><span>ruled ' + esc(fmtDate(c.ruledAt)) + '</span></p>';
  h += '<p class="headnote">' + esc(c.decision) + '</p>' + matterFacts(c);
  h += '<ol class="transcript" aria-label="What each seat asked, and the answers">' + ids.map(function (id) { return transcriptItem(c, id); }).join('') + '</ol>';
  h += '<section class="ruling-block" aria-label="The ruling"><p class="held"><span class="k">Held:</span>' + esc(c.ruling.held) + '</p>' + ratioBox(c) +
    '<div class="actions"><button type="button" class="btn-text" data-action="goto-report" data-id="' + esc(c.id) + '">Read the report in the casebook</button></div></section>';
  h += '</div></div></div>';
  return h;
}

function renderOpen(c) {
  const step = c.step || 'matter';
  const okMatter = matterProblems(c).length === 0;
  const okBench = okMatter && benchProblems(c).length === 0;
  const enabled = { matter: true, bench: okMatter, hearing: okBench, ruling: okBench && c.closed };
  const steps = [['matter', 'Matter'], ['bench', 'Bench'], ['hearing', 'Hearing'], ['ruling', 'Ruling']];
  let h = '<div class="frame"><div class="matter-head"><p class="kicker">Open matter</p>' +
    '<h1 class="matter-title"><span class="re">Re:</span> <i id="open-title">' + esc(caseTitle(c)) + '</i></h1>' +
    '<ol class="steps" aria-label="Steps">' + steps.map(function (s, i) {
      return '<li><button type="button" data-action="step" data-step="' + s[0] + '"' + (s[0] === step ? ' aria-current="step"' : '') + (enabled[s[0]] || s[0] === step ? '' : ' disabled') + '><span class="n">' + (i + 1) + '</span>' + s[1] + '</button></li>';
    }).join('') + '</ol></div>';
  const body = step === 'bench' ? stepBench(c) : step === 'hearing' ? stepHearing(c) : step === 'ruling' ? stepRuling(c) : stepMatter(c);
  h += '<div class="chamber">' + tableCol(c, step) + '<div class="stage">' + body + '</div></div></div>';
  return h;
}

function precPreview(c) {
  const list = precedentsFor(c);
  if (!list.length) {
    const any = ruledCases().some(function (o) { return !!o.example === !!c.example; });
    return '<p class="hint">' + (any ? 'No earlier ruling looks related yet. Precedent appears here when the kind of matter or the wording matches an earlier principle.' : 'Your casebook has no rulings yet, so there is no precedent. Your first rulings become precedent for later ones.') + '</p>';
  }
  return '<div class="field"><span class="legend">Precedent on file</span><div class="prec-list">' + list.map(function (r) {
    return '<div class="prec"><p class="prec-cite">' + citeHTML(r.o) + '<span class="why">' + esc(whyLine(r)) + '</span></p><p class="prec-ratio">' + ratioHTML(r.o.ruling) + '</p></div>';
  }).join('') + '</div><p class="hint">When you rule, you will say whether to follow, distinguish or overturn each one.</p></div>';
}

function confirmBlock(kind, question, yesLabel, yesId, noLabel) {
  return '<div class="confirm" role="group" aria-label="Confirm"><p>' + esc(question) + '</p>' +
    '<button type="button" class="btn btn-danger-solid" data-action="' + kind + '-yes" id="' + yesId + '">' + esc(yesLabel) + '</button>' +
    '<button type="button" class="btn" data-action="' + kind + '-no">' + esc(noLabel) + '</button></div>';
}

function stepMatter(c) {
  let h = '<form class="form" data-form="matter" novalidate>';
  h += '<h2 class="speaker" id="stage-h" tabindex="-1">Bring the matter</h2>';
  h += '<p class="hint">Describe the decision as it stands today. You can come back and change this before the hearing.</p>';
  h += '<div class="field"><label for="matter-title">Name the matter</label><div class="prefixed"><span aria-hidden="true">Re:</span><input type="text" id="matter-title" data-bind="title" maxlength="80" value="' + esc(c.title) + '" placeholder="Leaving the firm"></div><p class="hint">A short name, the way a case is named. It becomes the citation.</p></div>';
  h += '<div class="field"><label for="matter-decision">What is the decision?</label><textarea id="matter-decision" data-bind="decision" rows="3" placeholder="Whether to ...">' + esc(c.decision) + '</textarea></div>';
  h += '<div class="field"><label for="matter-options">The options as you see them now</label><textarea id="matter-options" data-bind="options" rows="3" placeholder="One per line">' + esc(c.options) + '</textarea></div>';
  h += '<div class="field"><label for="matter-leaning">Which way are you leaning?</label><input type="text" id="matter-leaning" data-bind="leaning" maxlength="140" value="' + esc(c.leaning) + '" placeholder="The option you would pick if you had to choose today"></div>';
  h += '<div class="field"><label for="matter-strength">How strongly <output id="strength-out" for="matter-strength">' + c.strength + ' of 5</output></label><input type="range" id="matter-strength" data-bind="strength" min="1" max="5" step="1" value="' + c.strength + '"><div class="scale-ends" aria-hidden="true"><span>Barely</span><span>Firmly</span></div></div>';
  h += '<fieldset class="field"><legend class="legend">What kind of matter is it?</legend><div class="chips">' + TYPES.map(function (t) { return chip('matter-type', 'type-' + t.id, t.id, t.label, c.type === t.id); }).join('') + '</div><p class="hint" id="type-hint">' + (TYPE[c.type] ? esc(TYPE[c.type].label + ': ' + TYPE[c.type].hint) : 'The kind of matter shapes what each seat asks, and which earlier rulings are cited.') + '</p></fieldset>';
  h += '<div id="prec-preview">' + precPreview(c) + '</div>';
  h += '<p class="err" id="matter-err" role="alert"></p>';
  h += '<div class="actions"><button type="submit" class="btn btn-primary">Seat the council</button>' + (ui.confirm === 'withdraw' ? '' : '<button type="button" class="btn-text" data-action="withdraw">Withdraw this matter</button>') + '</div>';
  if (ui.confirm === 'withdraw') h += confirmBlock('withdraw', 'Withdraw this matter and delete what you have written for it?', 'Yes, withdraw it', 'withdraw-yes', 'Keep working');
  h += '</form>';
  return h;
}

function stepBench(c) {
  const pick = function (s) {
    const on = c.seats.indexOf(s.id) >= 0;
    return '<li><button type="button" class="seat-pick" id="pick-' + s.id + '" data-action="toggle-seat" data-seat="' + s.id + '" aria-pressed="' + on + '">' +
      '<span class="g" aria-hidden="true">' + esc(seatGlyph(s.id, c)) + '</span><span class="nm">' + esc(s.name) + '</span><span class="sd">' + esc(s.desc) + '</span>' +
      '<span class="on">' + (on ? 'Seated' : 'Seat') + '</span></button></li>';
  };
  let h = '<div class="form">';
  h += '<h2 class="speaker" id="stage-h" tabindex="-1">Seat the council</h2>';
  h += '<p class="hint">Choose five to seven seats. They speak in turn, clockwise from your left. The suggested bench for ' + esc(typeLabel(c.type).toLowerCase()) + ' mixes traditions that read this kind of matter differently; change it freely.</p>';
  h += '<div class="bench-bar"><span class="bench-count" id="bench-count">' + c.seats.length + ' seated (five to seven)</span><button type="button" class="btn-text" data-action="suggest">Use the suggested bench</button></div>';
  h += '<div><span class="legend">Traditions</span><ul class="roster">' + SEATS.filter(function (s) { return s.kind === 'tradition'; }).map(pick).join('') + '</ul></div>';
  h += '<div><span class="legend">Personal seats</span><ul class="roster">' + SEATS.filter(function (s) { return s.kind === 'personal'; }).map(pick).join('') + '</ul></div>';
  h += '<div class="two"><div class="field"><label for="bench-affected">Who is most affected by this?</label><input type="text" id="bench-affected" data-bind="affected" maxlength="40" value="' + esc(c.affected) + '" placeholder="Their name"></div>' +
    '<div class="field"><label for="bench-admired">Someone you admire</label><input type="text" id="bench-admired" data-bind="admired" maxlength="40" value="' + esc(c.admired) + '" placeholder="Their name"></div></div>';
  h += '<div class="field"><label for="bench-dissent">Dissent</label><select id="bench-dissent"><option value="">No dissent</option>' + c.seats.map(function (id) {
    return '<option value="' + id + '"' + (c.dissent === id ? ' selected' : '') + '>' + esc(seatName(id, c)) + '</option>';
  }).join('') + '</select><p class="hint">The dissenting seat is assigned to argue against your leaning, from inside its own tradition, and speaks last.</p></div>';
  h += '<p class="err" id="bench-err" role="alert"></p>';
  h += '<div class="actions"><button type="button" class="btn" data-action="step" data-step="matter">Back to the matter</button><button type="button" class="btn btn-primary" data-action="open-hearing">Open the hearing</button></div></div>';
  return h;
}

function stepHearing(c) {
  const ids = speakingOrder(c);
  const i = clamp(c.turn, 0, ids.length - 1);
  const id = ids[i];
  const s = SEAT[id];
  const sc = seatContent(id, c);
  const a = answerOf(c, id);
  const last = i === ids.length - 1;
  let h = '<details class="matter-sum"><summary>The matter</summary><p>' + esc(c.decision) + '</p>' + matterFacts(c) + '</details>';
  h += '<p class="kicker">Seat ' + (i + 1) + ' of ' + ids.length + ' · ' + esc(typeLabel(c.type)) + '</p>';
  h += '<h2 class="speaker" id="stage-h" tabindex="-1">' + esc(seatName(id, c)) + '</h2>';
  h += '<p class="strand">' + esc(s.strand) + '</p>';
  if (sc.dissent) h += '<p class="dissent-note">Dissent: assigned to argue against your leaning</p>';
  h += '<p class="framing">' + esc(sc.f) + '</p>';
  h += '<ol class="questions">' + sc.qs.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ol>';
  if (s.terms && s.terms.length) h += '<dl class="terms" aria-label="Key terms">' + s.terms.map(function (t) { return '<dt>' + esc(t[0]) + '</dt><dd>' + esc(t[1]) + '</dd>'; }).join('') + '</dl>';
  h += '<div class="field"><label for="answer-text">Your answer</label><textarea id="answer-text" rows="6" data-seat="' + id + '">' + esc(a.text) + '</textarea><p class="hint">Write what is true, at whatever length. You can pass.</p></div>';
  h += '<p class="err" id="answer-err" role="alert"></p>';
  h += '<div class="actions"><button type="button" class="btn" data-action="prev-seat"' + (i === 0 ? ' disabled' : '') + '>Previous seat</button>' +
    '<button type="button" class="btn" data-action="pass-seat">Pass</button>' +
    '<button type="button" class="btn btn-primary" data-action="answer-seat">' + (last ? 'Save answer and close the hearing' : 'Save answer, next seat') + '</button></div>';
  return h;
}

function precReasonLabel(t) {
  return t === 'distinguish' ? 'Why is this case different?' : t === 'overturn' ? 'Why does the old principle no longer hold?' : 'Note (optional)';
}
function precTreat(c, r) {
  const o = r.o;
  const p = c.prec[o.id] || { t: '', reason: '' };
  const opts = [['follow', 'Follow'], ['distinguish', 'Distinguish'], ['overturn', 'Overturn'], ['none', 'Does not apply']];
  const show = p.t && p.t !== 'none';
  return '<div class="prec"><p class="prec-cite">' + citeHTML(o) + '<span class="why">' + esc(whyLine(r)) + '</span></p>' +
    '<p class="prec-ratio">' + ratioHTML(o.ruling) + '</p>' +
    '<div class="chips" role="radiogroup" aria-label="How ' + esc(citeText(o)) + ' applies">' + opts.map(function (x) { return chip('prec-' + o.id, 'prec-' + o.id + '-' + x[0], x[0], x[1], p.t === x[0]); }).join('') + '</div>' +
    '<div class="field" id="precf-' + o.id + '"' + (show ? '' : ' hidden') + '><label for="prec-' + o.id + '-reason" id="precl-' + o.id + '">' + precReasonLabel(p.t) + '</label>' +
    '<textarea id="prec-' + o.id + '-reason" rows="2" data-prec-reason="' + o.id + '">' + esc(p.reason) + '</textarea></div></div>';
}

function stepRuling(c) {
  const ids = speakingOrder(c);
  const answered = ids.filter(function (id) { const a = answerOf(c, id); return a.done && !a.passed && a.text.trim(); }).length;
  const precs = precedentsFor(c);
  const rd = c.ruling.reviewDays == null ? 90 : Number(c.ruling.reviewDays);
  let h = '<form class="form" data-form="ruling" novalidate>';
  h += '<h2 class="speaker" id="stage-h" tabindex="-1">The chair rules</h2>';
  h += '<p class="hint">The council has been heard: ' + answered + ' answered, ' + (ids.length - answered) + ' passed. The decision is yours. Write what you have decided, then the principle underneath it.</p>';
  h += '<div class="field"><label for="ruling-held">Held: what you have decided</label><textarea id="ruling-held" rows="3" data-rbind="held">' + esc(c.ruling.held) + '</textarea></div>';
  h += '<fieldset class="field"><legend class="legend">Ratio: the principle the decision rests on</legend>' +
    '<div class="ratio-line"><label for="ruling-when">When</label><textarea id="ruling-when" rows="2" data-rbind="when" placeholder="the kind of situation, put generally">' + esc(c.ruling.when) + '</textarea></div>' +
    '<div class="ratio-line"><label for="ruling-i">I</label><textarea id="ruling-i" rows="2" data-rbind="i" placeholder="what you do">' + esc(c.ruling.i) + '</textarea></div>' +
    '<div class="ratio-line"><label for="ruling-because">because</label><textarea id="ruling-because" rows="2" data-rbind="because" placeholder="the reason, as you understand it now">' + esc(c.ruling.because) + '</textarea></div>' +
    '<p class="hint">Write it so it could govern a later case, not only this one. Later matters will cite it.</p></fieldset>';
  h += '<fieldset class="field"><legend class="legend">How sure are you?</legend><div class="chips">' + CONF.map(function (l, k) { return chip('ruling-conf', 'conf-' + (k + 1), k + 1, l, Number(c.ruling.conf) === k + 1); }).join('') + '</div></fieldset>';
  if (precs.length) {
    h += '<fieldset class="field"><legend class="legend">Precedent</legend><p class="hint">These earlier rulings bear on this matter. Say how each applies. An overturned principle stays in the casebook, struck through, with your reason beside it.</p><div class="prec-list">' + precs.map(function (r) { return precTreat(c, r); }).join('') + '</div></fieldset>';
  }
  h += '<fieldset class="field"><legend class="legend">List for review</legend><div class="chips">' + REVIEW_CHOICES.map(function (x) { return chip('ruling-review', 'review-' + x[0], x[0], x[1], rd === x[0]); }).join('') + '</div><p class="hint">When the date comes, the casebook asks how it turned out and whether the principle held.</p></fieldset>';
  h += '<p class="err" id="ruling-err" role="alert"></p>';
  h += '<div class="actions"><button type="button" class="btn" data-action="step" data-step="hearing">Back to the hearing</button><button type="submit" class="btn btn-primary">Enter the ruling in the casebook</button></div></form>';
  return h;
}

/* ---------- Casebook ---------- */
function reviewForm(c, due) {
  const id = c.id;
  return '<div class="review-box" id="review-' + id + '">' +
    '<p class="prec-cite">' + citeHTML(c) + (c.example ? ' <span class="tag">Example</span>' : '') + '<span class="why">Ruled ' + esc(fmtDate(c.ruledAt)) + ' · review listed for ' + esc(fmtDate(c.review.due)) + '</span></p>' +
    '<p class="prec-ratio">' + ratioHTML(c.ruling) + '</p>' +
    '<p class="hint">Held: ' + esc(c.ruling.held) + '</p>' +
    '<div class="field"><label for="rv-' + id + '-outcome">How did it turn out?</label><textarea id="rv-' + id + '-outcome" rows="3"></textarea></div>' +
    '<fieldset class="field"><legend class="legend">Did the principle hold?</legend><div class="chips">' + Object.keys(HELD).map(function (k) { return chip('rv-' + id + '-held', 'rv-' + id + '-' + k, k, HELD[k], false); }).join('') + '</div></fieldset>' +
    '<p class="err" id="rv-' + id + '-err" role="alert"></p>' +
    '<div class="actions"><button type="button" class="btn btn-primary" data-action="save-review" data-id="' + esc(id) + '">Record the review</button>' +
    (due ? '<button type="button" class="btn-text" data-action="snooze-review" data-id="' + esc(id) + '">Ask me again in two weeks</button>' : '<button type="button" class="btn-text" data-action="cancel-review" data-id="' + esc(id) + '">Not now</button>') +
    '</div></div>';
}

function reviewLine(c) {
  const r = c.review;
  if (!r) return '';
  if (r.done) {
    return '<div class="annot"><span class="k">On review</span>' + esc(fmtDate(r.doneAt)) + ': ' + esc(HELD[r.held] || 'Reviewed') + '. ' + esc(r.outcome || '') +
      (r.held === 'failed' && !c.overruledBy ? ' <button type="button" class="btn-text" data-action="revisit" data-id="' + esc(c.id) + '">Bring a new matter to revisit it</button>' : '') + '</div>';
  }
  if (isDue(c)) return '<p class="annot"><span class="k">Review</span>Due since ' + esc(fmtDate(r.due)) + '. <button type="button" class="btn-text" data-action="goto-review" data-id="' + esc(c.id) + '">Go to the review</button></p>';
  if (ui.reviewOpen[c.id]) return reviewForm(c, false);
  return '<p class="annot"><span class="k">Review</span>Listed for ' + esc(fmtDate(r.due)) + '. <button type="button" class="btn-text" data-action="review-now" data-id="' + esc(c.id) + '">Review it now</button></p>';
}

function report(c) {
  const order = speakingOrder(c);
  const precs = Object.keys(c.prec).map(function (id) { return { o: byId(id), p: c.prec[id] }; }).filter(function (x) { return x.o && TREAT_PAST[x.p.t]; });
  const later = laterTreatment(c).filter(function (x) { return x.p.t !== 'overturn'; });
  const cw = [typeLabel(c.type)];
  precs.forEach(function (x) { cw.push('precedent ' + TREAT_PAST[x.p.t]); });
  if (c.overruledBy) cw.push('overruled');
  if (c.review) cw.push(c.review.done ? 'reviewed' : (isDue(c) ? 'review due' : 'listed for review'));
  let h = '<article class="report' + (ui.flash === c.id ? ' flash' : '') + '" id="report-' + c.id + '" tabindex="-1" aria-label="' + esc(citeText(c)) + '">';
  h += '<h2 class="case-name"><span class="re">Re:</span> <i>' + esc(caseTitle(c)) + '</i></h2>';
  h += '<p class="citation"><span>' + esc(citeTail(c)) + '</span><span class="sep">·</span><span>Ruled ' + esc(fmtDate(c.ruledAt)) + '</span>' + (c.example ? '<span class="tag">Example</span>' : '') + '</p>';
  h += '<p class="catchwords">' + esc(cw.join(' · ')) + '</p>';
  h += '<p class="headnote">' + esc(c.decision) + '</p>';
  h += '<dl class="facts"><dt>Options</dt><dd>' + esc(c.options.trim() || 'None recorded') + '</dd><dt>Leaning at opening</dt><dd>' + leaningText(c) + '</dd>' +
    '<dt>Bench</dt><dd>' + esc(order.filter(function (id) { return id !== c.dissent; }).map(function (id) { return seatName(id, c); }).join(', ')) + '</dd>' +
    (c.dissent ? '<dt>Dissenting seat</dt><dd>' + esc(seatName(c.dissent, c)) + '</dd>' : '') + '</dl>';
  h += '<p class="held"><span class="k">Held:</span>' + esc(c.ruling.held) + '</p>';
  h += ratioBox(c);
  if (precs.length) {
    h += '<div class="annot"><span class="k">Precedent considered</span><ul>' + precs.map(function (x) {
      return '<li><button type="button" class="cite-link" data-action="goto-report" data-id="' + esc(x.o.id) + '">' + esc(citeText(x.o)) + '</button> ' + TREAT_PAST[x.p.t] + (x.p.reason ? ': “' + esc(x.p.reason) + '”' : '.') + '</li>';
    }).join('') + '</ul></div>';
  }
  if (later.length) {
    h += '<div class="annot"><span class="k">Subsequent treatment</span><ul>' + later.map(function (x) {
      return '<li>' + TREAT_IN[x.p.t] + ' <button type="button" class="cite-link" data-action="goto-report" data-id="' + esc(x.o.id) + '">' + esc(citeText(x.o)) + '</button>' + (x.p.reason ? ': “' + esc(x.p.reason) + '”' : '') + '</li>';
    }).join('') + '</ul></div>';
  }
  h += reviewLine(c);
  h += '<div class="actions"><button type="button" class="btn-text" data-action="read-record" data-id="' + esc(c.id) + '">Read the hearing record</button></div>';
  h += '</article>';
  return h;
}

function renderCasebook() {
  const ruled = ruledCases().slice().reverse();
  const btn = '<div class="actions"><button type="button" class="btn' + (ruled.length ? '' : ' btn-primary') + '" data-action="new-matter">' + (openCase() ? 'Return to the open matter' : (ruled.length ? 'Bring a new matter' : 'Bring a matter')) + '</button></div>';
  let side = '<header class="view-head"><h1 class="view-title" id="view-h" tabindex="-1">Casebook</h1>' +
    '<p class="lede">Every ruling you have made, reported the way courts report cases: what was asked, who sat, what was held, and the principle it rests on.</p></header>' + btn;
  let main = ui.notice ? '<p class="status" role="status">' + esc(ui.notice) + '</p>' : '';
  if (!ruled.length) {
    main += '<p class="intro">No rulings yet. Your casebook fills as you rule on matters, and each ruling becomes precedent for the next.</p>';
  } else {
    side += '<nav class="toc" aria-labelledby="toc-h"><h2 class="legend" id="toc-h">Table of cases</h2><ol>' + ruled.map(function (c) {
      return '<li><button type="button" data-action="goto-report" data-id="' + esc(c.id) + '"><span' + (c.overruledBy ? ' class="struck"' : '') + '><i>Re: ' + esc(caseTitle(c)) + '</i></span>' +
        '<span class="c">' + esc(citeTail(c) + ' · ' + typeLabel(c.type) + (c.overruledBy ? ' · overruled' : '') + (c.example ? ' · Example' : '')) + '</span></button></li>';
    }).join('') + '</ol></nav>';
    const due = ruled.filter(isDue);
    if (due.length) {
      main += '<section aria-labelledby="due-h"><h2 class="legend" id="due-h">Listed for review</h2><div class="due-list">' + due.map(function (c) { return reviewForm(c, true); }).join('') + '</div></section>';
    }
    main += '<div class="reports">' + ruled.map(report).join('') + '</div>';
  }
  side += '<p class="hint">Citations read [year] CB number; examples are cited as Ex. The ratio is the principle a decision rests on. When a later case overturns one, it stays here struck through, with the reason.</p>';
  return '<div class="frame split"><div class="split-side">' + side + '</div><div class="split-main">' + main + '</div></div>';
}

/* ---------- Principles ---------- */
function renderPrinciples() {
  const ruled = ruledCases();
  const standing = ruled.filter(function (c) { return !c.overruledBy; });
  const over = ruled.length - standing.length;
  const kinds = new Set(standing.map(function (c) { return c.type; })).size;
  const tested = standing.filter(function (c) { return c.review && c.review.done; }).length;
  let h = '<div class="frame split"><div class="split-side"><header class="view-head"><h1 class="view-title" id="view-h" tabindex="-1">Standing principles</h1>' +
    '<p class="lede">The principles your rulings rest on, grouped by the kind of matter. Nothing here was declared in advance; each one came out of a decision you made. A principle leaves this list only when a later case overturns it.</p>';
  if (standing.length) h += '<p class="status">' + standing.length + (standing.length === 1 ? ' principle' : ' principles') + ' across ' + kinds + (kinds === 1 ? ' kind' : ' kinds') + ' of matter · ' + tested + ' tested on review</p>';
  h += '</header>';
  if (over) h += '<p class="hint">' + over + (over === 1 ? ' overruled principle is' : ' overruled principles are') + ' kept in the casebook, struck through, with the reason it was overturned.</p>';
  h += '</div><div class="split-main">';
  if (!standing.length) {
    h += '<p class="intro">No standing principles yet. Each ruling adds one.</p></div></div>';
    return h;
  }
  TYPES.forEach(function (t) {
    const g = standing.filter(function (c) { return c.type === t.id; }).reverse();
    if (!g.length) return;
    h += '<section class="pgroup" aria-label="' + esc(t.label) + '"><h2>' + esc(t.label) + '</h2><ul class="plist">' + g.map(function (c) {
      const bits = [CONF[(c.ruling.conf || 2) - 1]];
      const rm = reviewMark(c);
      if (rm) bits.push(rm);
      return '<li><p class="ptext">' + ratioHTML(c.ruling) + '</p><p class="psrc"><span>From</span><button type="button" class="cite-link" data-action="goto-report" data-id="' + esc(c.id) + '">' + esc(citeText(c)) + '</button>' +
        (c.example ? '<span class="tag">Example</span>' : '') + '<span>' + esc(bits.join(' · ')) + '</span></p></li>';
    }).join('') + '</ul></section>';
  });
  h += '</div></div>';
  return h;
}

/* ---------- Records ---------- */
function renderRecords() {
  let h = '<div class="frame"><header class="view-head"><h1 class="view-title" id="view-h" tabindex="-1">Records</h1>' +
    '<p class="lede">Your casebook lives only in this browser. Copy it out to keep a backup or move it to another device.</p>' +
    (ui.notice ? '<p class="status" role="status">' + esc(ui.notice) + '</p>' : '') + '</header><div class="records">';
  h += '<section aria-labelledby="exp-h"><h2 id="exp-h">Export</h2><p class="hint">Every case, hearing, ruling and review, as JSON.</p>' +
    '<label class="vh" for="export-text">Exported data</label><textarea id="export-text" class="mono" rows="10" readonly>' + esc(JSON.stringify(data, null, 2)) + '</textarea>' +
    '<div class="actions"><button type="button" class="btn" data-action="copy-export">Copy to clipboard</button><span class="status" id="export-status" role="status"></span></div></section>';
  h += '<section aria-labelledby="imp-h"><h2 id="imp-h">Import</h2><p class="hint">Paste JSON exported from Council. It replaces everything stored here now.</p>' +
    '<label class="vh" for="import-text">Data to import</label><textarea id="import-text" class="mono" rows="8" placeholder="{ &quot;v&quot;: 1, &quot;cases&quot;: [ ... ] }"></textarea>' +
    '<div class="actions"><button type="button" class="btn" data-action="import">Import and replace</button><span class="status" id="import-status" role="status"></span></div></section>';
  if (!hasExamples()) {
    h += '<section aria-labelledby="exa-h"><h2 id="exa-h">Examples</h2><p class="hint">Put the two example cases back beside your own. They stay marked as examples.</p><div class="actions"><button type="button" class="btn" data-action="restore-examples">Show the examples again</button></div></section>';
  }
  h += '<section aria-labelledby="era-h"><h2 id="era-h">Erase</h2><p class="hint">Removes every case, ruling and review Council has stored in this browser. This cannot be undone.</p>' +
    (ui.confirm === 'erase' ? confirmBlock('erase', 'Erase everything Council has stored on this device?', 'Yes, erase everything', 'erase-yes', 'Keep my data') :
      '<div class="actions"><button type="button" class="btn btn-danger" data-action="erase" id="erase-btn">Erase everything on this device</button></div>') + '</section>';
  h += '</div></div>';
  return h;
}

/* ---------- Render ---------- */
const VIEWS = { hearing: renderHearing, casebook: renderCasebook, principles: renderPrinciples, records: renderRecords };
function render(opts) {
  opts = opts || {};
  document.querySelectorAll('.tab').forEach(function (b) {
    if (b.getAttribute('data-view') === ui.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const n = ruledCases().length;
  const d = ruledCases().filter(isDue).length;
  const badge = document.getElementById('badge-cases');
  badge.textContent = d ? d + ' due' : String(n);
  badge.setAttribute('aria-label', n + (n === 1 ? ' case' : ' cases') + (d ? ', ' + d + ' due for review' : ''));
  badge.classList.toggle('due', d > 0);
  document.getElementById('example-bar').hidden = !hasExamples();
  Object.keys(VIEWS).forEach(function (v) {
    const el = document.getElementById('view-' + v);
    const on = v === ui.view;
    el.hidden = !on;
    el.innerHTML = on ? VIEWS[v]() : '';
  });
  ui.notice = '';
  animateNeedle();
  if (ui.refocus) {
    const r = document.querySelector(ui.refocus);
    ui.refocus = null;
    if (r) r.focus({ preventScroll: true });
  } else if (ui.scrollTo) {
    const t = document.getElementById(ui.scrollTo);
    ui.scrollTo = null;
    if (t) { t.scrollIntoView({ block: 'start' }); t.focus({ preventScroll: true }); }
  } else if (opts.focus) {
    const f = document.getElementById(opts.focus) || document.getElementById('stage-h') || document.getElementById('view-h');
    if (f) f.focus({ preventScroll: !!opts.noScroll });
  }
  ui.flash = null;
}

/* ---------- Actions ---------- */
function newCase(preset) {
  const c = normCase(Object.assign({ id: uid(), createdAt: new Date().toISOString(), status: 'open', step: 'matter' }, preset || {}));
  data.cases.push(c);
  data.openId = c.id;
  return c;
}
function setErr(id, msgs) {
  const el = document.getElementById(id);
  if (el) el.textContent = Array.isArray(msgs) ? msgs.join(' ') : msgs;
}
function applyDefaultBench(c) {
  const d = DEFAULT_BENCH[c.type];
  if (!d) return;
  c.seats = d.seats.slice();
  c.dissent = d.dissent;
}
function advance(c) {
  const n = speakingOrder(c).length;
  if (c.turn < n - 1) c.turn += 1;
  else { c.closed = true; c.step = 'ruling'; }
  save();
  render({ focus: 'stage-h' });
}
function scrollToEl(id, focusId) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ block: 'start' });
  const f = document.getElementById(focusId || id);
  if (f) f.focus({ preventScroll: true });
}

const ACTIONS = {
  nav: function (el) {
    ui.view = el.getAttribute('data-view');
    ui.confirm = null;
    if (ui.view === 'hearing' && openCase()) ui.recordId = null;
    render({ focus: 'view-h', noScroll: true });
    window.scrollTo(0, 0);
  },
  'clear-examples': function () {
    const gone = new Set(data.cases.filter(function (c) { return c.example; }).map(function (c) { return c.id; }));
    data.cases = data.cases.filter(function (c) { return !c.example; });
    data.cases.forEach(function (c) {
      Object.keys(c.prec).forEach(function (k) { if (gone.has(k)) delete c.prec[k]; });
      if (gone.has(c.overruledBy)) { c.overruledBy = null; c.overruleReason = ''; c.overruledAt = null; }
    });
    data.examplesCleared = true;
    ui.recordId = null; ui.focusSeat = null; ui.view = 'hearing';
    save();
    render({ focus: 'stage-h', noScroll: true });
  },
  'restore-examples': function () {
    const ex = makeExamples().map(normCase);
    data.cases = ex.concat(data.cases.filter(function (c) { return !c.example; }));
    data.examplesCleared = false;
    save();
    ui.notice = 'The two example cases are back in the casebook.';
    render();
  },
  'new-matter': function () {
    ui.recordId = null; ui.focusSeat = null; ui.confirm = null; ui.view = 'hearing';
    if (!openCase()) { newCase(); save(); }
    render({ focus: 'matter-title' });
    window.scrollTo(0, 0);
  },
  'return-open': function () { ui.recordId = null; render({ focus: 'stage-h' }); window.scrollTo(0, 0); },
  withdraw: function () { ui.confirm = 'withdraw'; ui.refocus = '#withdraw-yes'; render(); },
  'withdraw-no': function () { ui.confirm = null; render({ focus: 'stage-h' }); },
  'withdraw-yes': function () {
    const c = openCase();
    if (c) data.cases = data.cases.filter(function (x) { return x.id !== c.id; });
    data.openId = null; ui.confirm = null;
    save();
    render({ focus: 'stage-h' });
  },
  step: function (el) {
    const c = openCase();
    if (!c) return;
    const s = el.getAttribute('data-step');
    if (s !== 'matter' && matterProblems(c).length) return;
    if ((s === 'hearing' || s === 'ruling') && benchProblems(c).length) return;
    if (s === 'bench' && !c.seats.length) applyDefaultBench(c);
    c.step = s; ui.confirm = null;
    save();
    render({ focus: 'stage-h' });
  },
  'toggle-seat': function (el) {
    const c = openCase();
    if (!c) return;
    const id = el.getAttribute('data-seat');
    const i = c.seats.indexOf(id);
    if (i >= 0) {
      c.seats.splice(i, 1);
      if (c.dissent === id) c.dissent = '';
    } else {
      if (c.seats.length >= 7) { setErr('bench-err', 'The bench is full at seven. Unseat someone first.'); return; }
      c.seats.push(id);
    }
    save();
    ui.refocus = '#pick-' + id;
    render();
  },
  suggest: function () {
    const c = openCase();
    if (!c) return;
    applyDefaultBench(c);
    save();
    ui.refocus = '#bench-count';
    render({ focus: 'stage-h' });
  },
  'open-hearing': function () {
    const c = openCase();
    if (!c) return;
    const p = benchProblems(c);
    if (p.length) { setErr('bench-err', p); return; }
    const ids = speakingOrder(c);
    const first = ids.findIndex(function (id) { return !answerOf(c, id).done; });
    c.turn = first >= 0 ? first : 0;
    c.step = 'hearing';
    save();
    render({ focus: 'stage-h' });
  },
  'goto-seat': function (el) {
    const id = el.getAttribute('data-seat');
    const open = openCase();
    const recording = ui.view === 'hearing' && (!open || (ui.recordId && byId(ui.recordId) && byId(ui.recordId).status === 'ruled'));
    if (recording) {
      ui.focusSeat = id;
      render();
      scrollToEl('tr-' + id);
      return;
    }
    if (!open || (open.step !== 'hearing' && open.step !== 'ruling')) return;
    const idx = speakingOrder(open).indexOf(id);
    if (idx < 0) return;
    open.turn = idx; open.step = 'hearing';
    save();
    render({ focus: 'stage-h' });
  },
  'prev-seat': function () {
    const c = openCase();
    if (!c || c.turn <= 0) return;
    c.turn -= 1;
    save();
    render({ focus: 'stage-h' });
  },
  'pass-seat': function () {
    const c = openCase();
    if (!c) return;
    const id = speakingOrder(c)[clamp(c.turn, 0, c.seats.length - 1)];
    c.answers[id] = Object.assign({}, answerOf(c, id), { done: true, passed: true });
    advance(c);
  },
  'answer-seat': function () {
    const c = openCase();
    if (!c) return;
    const id = speakingOrder(c)[clamp(c.turn, 0, c.seats.length - 1)];
    const ta = document.getElementById('answer-text');
    const text = ta ? ta.value : '';
    if (!text.trim()) { setErr('answer-err', 'Write an answer, or choose Pass.'); if (ta) ta.focus(); return; }
    c.answers[id] = { text: text, done: true, passed: false };
    advance(c);
  },
  'goto-report': function (el, id) {
    ui.view = 'casebook'; ui.flash = id; ui.scrollTo = 'report-' + id;
    render();
  },
  'read-record': function (el, id) {
    ui.recordId = id; ui.focusSeat = null; ui.view = 'hearing';
    render({ focus: 'stage-h', noScroll: true });
    window.scrollTo(0, 0);
  },
  'review-now': function (el, id) { ui.reviewOpen[id] = true; ui.refocus = '#rv-' + id + '-outcome'; render(); },
  'cancel-review': function (el, id) { delete ui.reviewOpen[id]; ui.scrollTo = 'report-' + id; render(); },
  'goto-review': function (el, id) { scrollToEl('review-' + id, 'rv-' + id + '-outcome'); },
  'snooze-review': function (el, id) {
    const c = byId(id);
    if (!c || !c.review) return;
    c.review.due = addDays(new Date().toISOString(), 14);
    save();
    ui.notice = 'Review of ' + citeText(c) + ' moved to ' + fmtDate(c.review.due) + '.';
    render({ focus: 'view-h' });
  },
  'save-review': function (el, id) {
    const c = byId(id);
    if (!c || !c.review) return;
    const ta = document.getElementById('rv-' + id + '-outcome');
    const pick = document.querySelector('input[name="rv-' + id + '-held"]:checked');
    if (!pick) { setErr('rv-' + id + '-err', 'Say whether the principle held.'); return; }
    c.review.done = true;
    c.review.doneAt = new Date().toISOString();
    c.review.held = pick.value;
    c.review.outcome = ta ? ta.value.trim() : '';
    delete ui.reviewOpen[id];
    save();
    ui.notice = 'Review recorded for ' + citeText(c) + '.';
    ui.flash = id; ui.scrollTo = 'report-' + id;
    render();
  },
  revisit: function (el, id) {
    const old = byId(id);
    if (!old) return;
    if (!openCase()) newCase({ type: old.type, title: 'Revisiting ' + old.title, example: false });
    ui.recordId = null; ui.view = 'hearing';
    save();
    render({ focus: 'matter-title' });
    window.scrollTo(0, 0);
  },
  'copy-export': function () {
    const ta = document.getElementById('export-text');
    const st = document.getElementById('export-status');
    const fallback = function () {
      try { ta.focus(); ta.select(); } catch (e) { /* ignore */ }
      st.textContent = 'Selected. Press Ctrl+C or Cmd+C to copy.';
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function () { st.textContent = 'Copied to the clipboard.'; }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  },
  'import': function () {
    const ta = document.getElementById('import-text');
    const st = document.getElementById('import-status');
    let d = null;
    try { d = normData(JSON.parse(ta.value)); } catch (e) { d = null; }
    if (!d) { st.textContent = 'That is not a Council export. It needs to be JSON with a "cases" list.'; ta.focus(); return; }
    data = d;
    ui.recordId = null; ui.focusSeat = null; ui.reviewOpen = {}; ui.confirm = null;
    save();
    ui.notice = 'Imported ' + d.cases.length + (d.cases.length === 1 ? ' case.' : ' cases.');
    render({ focus: 'view-h' });
  },
  erase: function () { ui.confirm = 'erase'; ui.refocus = '#erase-yes'; render(); },
  'erase-no': function () { ui.confirm = null; ui.refocus = '#erase-btn'; render(); },
  'erase-yes': function () {
    storeDel();
    data = blankData();
    data.examplesCleared = true;
    ui.confirm = null; ui.recordId = null; ui.focusSeat = null; ui.reviewOpen = {};
    ui.notice = 'Erased. Council has nothing stored on this device now.';
    render({ focus: 'view-h' });
  }
};

function submitMatter() {
  const c = openCase();
  if (!c) return;
  const p = matterProblems(c);
  if (p.length) {
    setErr('matter-err', p);
    const first = !c.title.trim() ? 'matter-title' : !c.decision.trim() ? 'matter-decision' : 'type-' + TYPES[0].id;
    const f = document.getElementById(first);
    if (f) f.focus();
    return;
  }
  if (!c.seats.length) applyDefaultBench(c);
  c.step = 'bench';
  save();
  render({ focus: 'stage-h' });
}

function submitRuling() {
  const c = openCase();
  if (!c) return;
  const r = c.ruling;
  const p = [];
  if (!r.held.trim()) p.push('Write what you have decided.');
  if (!r.when.trim() || !r.i.trim() || !r.because.trim()) p.push('Complete the principle: when, I, because.');
  const precs = precedentsFor(c);
  precs.forEach(function (x) {
    const t = c.prec[x.o.id];
    if (t && (t.t === 'distinguish' || t.t === 'overturn') && !(t.reason || '').trim()) p.push('Give a reason for how you treated ' + citeText(x.o) + '.');
  });
  if (p.length) { setErr('ruling-err', p); return; }
  const keep = {};
  precs.forEach(function (x) {
    const t = c.prec[x.o.id];
    if (t && TREAT_PAST[t.t]) keep[x.o.id] = { t: t.t, reason: (t.reason || '').trim() };
  });
  c.prec = keep;
  c.status = 'ruled';
  c.step = 'done';
  c.ruledAt = new Date().toISOString();
  c.no = nextNo();
  ['held', 'when', 'i', 'because'].forEach(function (k) { r[k] = r[k].trim().replace(/[.\s]+$/, k === 'held' ? '.' : ''); });
  const days = Number(r.reviewDays) || 0;
  c.review = days ? { days: days, due: addDays(c.ruledAt, days), done: false, doneAt: null, held: '', outcome: '' } : null;
  Object.keys(keep).forEach(function (pid) {
    if (keep[pid].t !== 'overturn') return;
    const o = byId(pid);
    if (o) { o.overruledBy = c.id; o.overruleReason = keep[pid].reason; o.overruledAt = c.ruledAt; }
  });
  data.openId = null;
  ui.recordId = null; ui.view = 'casebook'; ui.flash = c.id; ui.scrollTo = 'report-' + c.id;
  ui.notice = 'Entered as ' + citeText(c) + '.';
  save();
  render();
}

/* ---------- Wiring ---------- */
const app = document.getElementById('app');
app.addEventListener('click', function (e) {
  const el = e.target.closest('[data-action]');
  if (!el || !app.contains(el)) return;
  if (el.disabled) return;
  const fn = ACTIONS[el.getAttribute('data-action')];
  if (fn) { e.preventDefault(); fn(el, el.getAttribute('data-id'), e); }
});
app.addEventListener('submit', function (e) {
  e.preventDefault();
  const f = e.target.getAttribute('data-form');
  if (f === 'matter') submitMatter();
  else if (f === 'ruling') submitRuling();
});
app.addEventListener('input', function (e) {
  const t = e.target;
  const c = openCase();
  if (!c) return;
  const k = t.getAttribute('data-bind');
  if (k) {
    c[k] = k === 'strength' ? Number(t.value) : t.value;
    if (k === 'strength') { const o = document.getElementById('strength-out'); if (o) o.textContent = t.value + ' of 5'; }
    if (k === 'title') { const h = document.getElementById('open-title'); if (h) h.textContent = caseTitle(c); }
    if (k === 'title' || k === 'decision' || k === 'options' || k === 'leaning') { const pp = document.getElementById('prec-preview'); if (pp) pp.innerHTML = precPreview(c); }
    if (k === 'affected' || k === 'admired') {
      refreshTable(c, 'bench');
      const g = document.querySelector('#pick-' + k + ' .g'); if (g) g.textContent = seatGlyph(k, c);
      const opt = document.querySelector('#bench-dissent option[value="' + k + '"]'); if (opt) opt.textContent = seatName(k, c);
    }
    saveSoon();
    return;
  }
  if (t.id === 'answer-text') {
    const sid = t.getAttribute('data-seat');
    c.answers[sid] = Object.assign({}, answerOf(c, sid), { text: t.value });
    setErr('answer-err', '');
    saveSoon();
    return;
  }
  const rk = t.getAttribute('data-rbind');
  if (rk) { c.ruling[rk] = t.value; saveSoon(); return; }
  const pr = t.getAttribute('data-prec-reason');
  if (pr) { c.prec[pr] = Object.assign({ t: '', reason: '' }, c.prec[pr], { reason: t.value }); saveSoon(); }
});
app.addEventListener('change', function (e) {
  const t = e.target;
  const c = openCase();
  if (!c || !t.name && t.id !== 'bench-dissent') return;
  if (t.name === 'matter-type') {
    c.type = t.value;
    const hint = document.getElementById('type-hint');
    if (hint && TYPE[c.type]) hint.textContent = TYPE[c.type].label + ': ' + TYPE[c.type].hint;
    const pp = document.getElementById('prec-preview'); if (pp) pp.innerHTML = precPreview(c);
    save();
  } else if (t.name === 'ruling-conf') { c.ruling.conf = Number(t.value); save(); }
  else if (t.name === 'ruling-review') { c.ruling.reviewDays = Number(t.value); save(); }
  else if (t.id === 'bench-dissent') { c.dissent = t.value; save(); refreshTable(c, 'bench'); }
  else if (t.name && t.name.indexOf('prec-') === 0) {
    const pid = t.name.slice(5);
    c.prec[pid] = Object.assign({ t: '', reason: '' }, c.prec[pid], { t: t.value });
    const f = document.getElementById('precf-' + pid);
    const l = document.getElementById('precl-' + pid);
    if (f) f.hidden = !(t.value && t.value !== 'none');
    if (l) l.textContent = precReasonLabel(t.value);
    save();
  }
});
window.addEventListener('pagehide', function () { if (saveTimer) save(); });

render();
})();
</script>
