<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism</title>
<style>
:root{
  /* Design plan: Prism.
     Concept: light through glass. A moment is white light; each lens splits it.
     The interface itself stays colourless (frosted glass, lead-black ink). Colour only
     appears where light has been split: tradition swatches, and the resonance map,
     which sits on a dark optics bench in both themes. That bench is the one bold element.
     Layout: a single reading column (max 72rem) with the bench at full column width. */
  --bg:#edf0f4;        /* frosted glass */
  --surface:#fafbfc;   /* a pane */
  --ink:#0f131a;       /* lead */
  --muted:#4d5664;
  --line:#c6cdd8;
  --bench:#0a0d13;     /* optics bench, where the light shows */
  --f-display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* supporting tokens */
  --surface-2:#f2f4f7;
  --ink-inv:#fafbfc;
  --focus:#1d4ed8;
  --sw-stroke:rgba(15,19,26,.38);
  --bench-ink:#eef1f6;
  --bench-muted:#a7b1c1;
  --bench-line:#252d3a;
  --danger:#a1222b;
  --ok:#0f6a40;
  --pane-hi:rgba(255,255,255,.85);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b0e13; --surface:#121720; --surface-2:#171d27; --ink:#e7ebf1; --ink-inv:#0b0e13;
    --muted:#9ea8b8; --line:#2c3543; --bench:#05070b; --bench-line:#1e2531;
    --focus:#93b6ff; --sw-stroke:rgba(255,255,255,.4); --danger:#ff9096; --ok:#76d8a6;
    --pane-hi:rgba(255,255,255,.04);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e13; --surface:#121720; --surface-2:#171d27; --ink:#e7ebf1; --ink-inv:#0b0e13;
  --muted:#9ea8b8; --line:#2c3543; --bench:#05070b; --bench-line:#1e2531;
  --focus:#93b6ff; --sw-stroke:rgba(255,255,255,.4); --danger:#ff9096; --ok:#76d8a6;
  --pane-hi:rgba(255,255,255,.04);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:72rem;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:18px 56px}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.15}
h2{font-family:var(--f-display);font-size:clamp(2rem,1.3rem + 2.6vw,3.1rem);letter-spacing:-.01em}
h3{font-family:var(--f-display);font-size:1.45rem}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;padding:1px 6px;line-height:1.5;white-space:nowrap}
.sw{width:13px;height:13px;flex:none;vertical-align:-1px}

/* header */
.top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px 16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:46px;height:30px;flex:none}
.brand-name{font-family:var(--f-display);font-style:italic;font-size:1.9rem;line-height:1;font-weight:500}
.brand-sub{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.top nav{grid-column:1 / -1}
.nav{display:flex;flex-wrap:wrap;gap:4px 2px;list-style:none;margin:0;padding:0}
.nav button{background:none;border:0;padding:8px 10px 6px;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.nav button:hover{color:var(--ink)}
@media (max-width:560px){.nav .nl{display:none}.nav button{padding:8px 7px 6px;letter-spacing:.03em}.nav{gap:2px 0}.brand-sub{display:none}}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
#theme-btn{justify-self:end}
@media (min-width:900px){
  .top{grid-template-columns:auto 1fr auto}
  .top nav{order:2;grid-column:auto}
  #theme-btn{order:3}
  .nav{justify-content:center}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:.55em 1em;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer;font-weight:700;font-size:.95rem;line-height:1.3;text-align:left}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--ink-inv)}
.btn.primary:hover{opacity:.88}
.btn.quiet{border-color:var(--line);font-weight:400}
.btn.small{font-size:.85rem;padding:.4em .75em}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--ink-inv)}
.btn.link{border:0;padding:.3em 0;background:none;text-decoration:underline;text-underline-offset:3px;font-weight:400;color:var(--muted)}
.btn.link:hover{color:var(--ink);background:none}
.btn:disabled{opacity:.55;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* banner */
.examples{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding:10px 14px;border:1px dashed var(--muted);background:var(--surface)}
.examples p{flex:1 1 20rem}

/* views */
.view{padding-top:28px}
.view-head{display:grid;gap:12px;margin-bottom:22px}
@media (min-width:920px){.view-head.split{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:end;gap:12px 40px}}
.lede{max-width:62ch;font-size:1.06rem}
.section{margin-top:36px}
.section > h3{margin-bottom:10px}

/* how it works */
.how{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);grid-template-columns:1fr}
.how li{background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.how .n{font-family:var(--f-display);font-size:1.7rem;line-height:1;grid-row:span 2}
.how strong{font-size:1rem}
.how span.d{color:var(--muted);font-size:.93rem}
@media (min-width:760px){.how{grid-template-columns:repeat(3,1fr)}}

/* chips */
.chips{border:0;padding:0;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:6px}
.chips legend{padding:0;margin-bottom:8px;width:100%}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip label{display:inline-block;padding:.32em .7em;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.9rem;border-radius:2px}
.chip label:hover{border-color:var(--ink)}
.chip input:checked + label{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
.chip input:focus-visible + label{outline:2px solid var(--focus);outline-offset:2px}
.form-chips{margin-bottom:18px}
.form-chips legend{font-weight:700}
.chip .ct{font-family:var(--f-mono);font-size:.75rem;opacity:.75;margin-left:4px}

/* bench (resonance map) */
.bench{margin:0;background:var(--bench);color:var(--bench-ink);padding:clamp(10px,2vw,22px);border:1px solid var(--bench-line);border-radius:3px}
.bench-svg svg{display:block;width:100%;height:auto}
.bench .t-name{font-family:var(--f-body);font-weight:700;fill:var(--bench-ink)}
.bench .t-meta{font-family:var(--f-mono);fill:var(--bench-muted)}
.bench .t-cap{font-family:var(--f-mono);fill:var(--bench-muted);letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;padding-top:12px;border-top:1px solid var(--bench-line);font-family:var(--f-mono);font-size:.74rem;color:var(--bench-muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:8px}
.bench-empty{font-family:var(--f-mono);font-size:.85rem;color:var(--bench-muted);padding:6px 4px 0}
@media (prefers-reduced-motion: no-preference){
  .animate .band{animation:bandIn .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 50ms)}
  .animate .refl{animation:bandIn 1.1s ease both;animation-delay:.5s}
  @keyframes bandIn{from{opacity:0}}
}

.map-cols{display:grid;gap:36px;margin-top:30px}
.map-cols > div,.new-grid > *,.data-grid > section{min-width:0}
@media (min-width:920px){.map-cols{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.table-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
caption{text-align:left;padding:10px 12px 4px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
th,td{padding:.5em .75em;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tr.untried th,tr.untried td{color:var(--muted)}
tbody th{font-weight:700}
tbody th .sw{margin-right:6px}
.caveat{font-size:.92rem;color:var(--muted);border-left:0;margin-bottom:12px}
.qlist{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.qlist li{padding:12px 14px;background:var(--surface);border:1px solid var(--line);font-size:.98rem}
.bytheme{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.bytheme h4{margin-bottom:4px}
.bytheme h4 .label{margin-left:6px}
.bytheme p{font-size:.93rem}
.bytheme b{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;font-weight:500;color:var(--muted);margin-right:4px}

/* new moment */
.new-grid{display:grid;gap:30px}
@media (min-width:920px){.new-grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label,.field legend{font-weight:700}
.hint{font-size:.88rem;color:var(--muted);font-weight:400}
textarea,input[type="text"],input[type="date"],select{width:100%;padding:.6em .7em;border:1px solid var(--line);background:var(--surface);border-radius:2px;color:var(--ink)}
input[type="date"]{max-width:14rem}
select{max-width:20rem}
textarea{resize:vertical;min-height:3.2em;line-height:1.5}
textarea:focus,input:focus,select:focus{border-color:var(--ink)}
.err{color:var(--danger);font-weight:700;font-size:.93rem}
.ok{color:var(--ok);font-weight:700;font-size:.93rem}
.aside{border:1px solid var(--line);background:var(--surface);padding:16px 18px;align-self:start;display:grid;gap:10px;font-size:.95rem}
.aside h3{font-size:1.2rem}
.aside ul{margin:0;padding-left:1.1em;display:grid;gap:6px}

/* the moment as white light */
.beam{position:relative;background:var(--bench);color:var(--bench-ink);padding:18px 20px 16px;border-radius:3px;display:grid;gap:8px;overflow:hidden;margin-bottom:18px}
.beam .label{color:var(--bench-muted)}
.beam-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.beam-what{font-size:1.08rem;max-width:62ch;overflow-wrap:anywhere;position:relative}
.beam-felt{color:var(--bench-muted);max-width:62ch;overflow-wrap:anywhere;position:relative}
.beam .btn{border-color:var(--bench-muted);color:var(--bench-ink);justify-self:start;position:relative}
.beam .btn:hover{background:rgba(255,255,255,.08)}
.beam-art{display:none}
@media (min-width:900px){
  .beam{padding-right:230px}
  .beam-art{display:block;position:absolute;right:14px;top:50%;transform:translateY(-50%);width:200px;height:96px}
}

.lens-tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:4px 0 18px}
.lens-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,29rem),1fr))}
.lens{background:var(--surface);border:1px solid var(--line);padding:18px 20px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 var(--pane-hi);min-width:0}
.lens[data-mark="lands"],.lens[data-mark="unsure"],.lens[data-mark="pushes"]{border-color:var(--muted)}
.lens-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.lens-name{font-family:var(--f-display);font-style:italic;font-size:1.55rem;line-height:1.15;outline-offset:4px}
.lens .idea{font-size:.98rem}
.term{font-size:.93rem;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line)}
.term dfn{font-style:italic;font-weight:700}
.frame{display:grid;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
.frame-text{font-size:1.04rem}
.quote{margin:0;padding:0 0 0 14px;border-left:1px solid var(--ink);font-family:var(--f-display);font-style:italic;font-size:1.06rem;line-height:1.4}
.quote footer{font-family:var(--f-mono);font-style:normal;font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.4}
.note{font-size:.84rem;color:var(--muted)}
.qs{border:0;padding:0;margin:0;display:grid;gap:6px}
.qs legend{padding:0;margin-bottom:4px}
.q{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.q input{margin:.3em 0 0;accent-color:var(--ink);width:1rem;height:1rem}
.q label{cursor:pointer;font-size:.98rem}
.ans{display:grid;gap:4px}
.marks{border:0;padding:12px 0 0;margin:0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.marks legend{padding:0;float:left;width:100%;margin-bottom:8px;font-weight:700}
.marks legend .hint{display:block;font-weight:400}
.mark{position:relative}
.mark input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.mark label{display:inline-flex;align-items:center;gap:8px;padding:.45em .8em;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:.92rem;border-radius:2px}
.mark label:hover{border-color:var(--ink)}
.mark svg{width:18px;height:18px;flex:none}
.mark input:checked + label{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
.mark input:focus-visible + label{outline:2px solid var(--focus);outline-offset:2px}
.lens-foot{display:flex;justify-content:flex-end}
.save-bar{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}

.browse{margin:0 0 22px;border:1px solid var(--line);background:var(--surface);padding:16px 18px}
.browse-fam{padding:12px 0;border-top:1px solid var(--line)}
.browse-fam:first-of-type{border-top:0}
.browse-fam h4{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.browse ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.browse li{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.browse li p{font-size:.9rem;color:var(--muted)}
@media (max-width:560px){.browse li{grid-template-columns:1fr}}

.saved{border:1px solid var(--line);background:var(--surface);padding:22px;display:grid;gap:14px;max-width:44rem}

/* doors */
.door-fam{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.door-fam > h3{display:flex;align-items:center;gap:10px}
.door-fam > p{max-width:64ch;margin-top:8px}
.door-list{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr))}
.door{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.door h4{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.3rem}
.door .why{font-size:.96rem}
.door .idea{font-size:.9rem;color:var(--muted)}
.door .btn{align-self:flex-start;margin-top:auto}
.door[data-tried="0"]{border-color:var(--ink)}
.checks{border:1px solid var(--line);background:var(--surface);padding:14px 16px;margin:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr))}
.checks legend{font-weight:700;padding:0 4px}
.check{display:flex;gap:8px;align-items:center}
.check input{width:1.05rem;height:1.05rem;accent-color:var(--ink);margin:0}

/* archive */
.arch-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.arch-tools label{font-weight:700}
.moments{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.moment{background:var(--surface);border:1px solid var(--line);padding:18px 20px;display:grid;gap:10px}
.moment-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.moment-what{font-size:1.04rem;max-width:66ch;overflow-wrap:anywhere}
.moment-felt{color:var(--muted);max-width:66ch;overflow-wrap:anywhere}
.resp{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.resp li{display:grid;gap:4px}
.resp-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.resp-head strong{font-weight:700}
.resp-mark{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.resp-mark svg{width:16px;height:16px}
.resp-ans{font-size:.94rem;padding-left:20px;overflow-wrap:anywhere}
.resp-ans q{display:block;color:var(--muted);font-size:.86rem;quotes:none}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--danger)}
.confirm p{flex:1 1 16rem}
.empty{padding:22px;border:1px dashed var(--line);display:grid;gap:12px;justify-items:start}

/* data */
.data-grid{display:grid;gap:30px}
@media (min-width:920px){.data-grid{grid-template-columns:1fr 1fr}}
.data-grid section{display:grid;gap:10px;align-content:start}
.data-grid textarea{font-family:var(--f-mono);font-size:.8rem;min-height:11rem}
.radios{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:14px}
.radios legend{font-weight:700;padding:0;margin-bottom:6px;width:100%}

.foot{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 46 30" aria-hidden="true" focusable="false">
        <line x1="0" y1="19" x2="15" y2="16" stroke="currentColor" stroke-width="1.6"/>
        <path d="M22 3 33 25H11Z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <g stroke-width="1.6">
          <line x1="27" y1="15" x2="46" y2="7" stroke="#ff5b57"/>
          <line x1="27.4" y1="16" x2="46" y2="11" stroke="#ffc145"/>
          <line x1="27.8" y1="17" x2="46" y2="15" stroke="#4fd38f"/>
          <line x1="28.2" y1="18" x2="46" y2="19" stroke="#4ab1f7"/>
          <line x1="28.6" y1="19" x2="46" y2="23" stroke="#9a78f5"/>
        </g>
      </svg>
      <div>
        <h1 class="brand-name">Prism</h1>
        <div class="brand-sub">one moment, many lenses</div>
      </div>
    </div>
    <button type="button" class="btn quiet small" id="theme-btn" data-act="toggle-theme">Use dark theme</button>
    <nav aria-label="Prism sections">
      <ul class="nav" id="nav">
        <li><button type="button" data-act="nav" data-view="map" aria-label="Resonance map"><span class="nl">Resonance </span>map</button></li>
        <li><button type="button" data-act="nav" data-view="new">Bring a moment</button></li>

  buddhism:{name:'Buddhism', short:'Buddhism', hue:'#ff5b57',

  christianity:{name:'Christianity', short:'Christianity', hue:'#ff8c42',
    intro:'If the Christianity you grew up with was mostly services, creeds and being told what to believe, these strands start somewhere else: silence, close attention to your own inner life, action alongside the poor, or honest doubt. All of them are old, mainstream parts of the tradition. They are just taught less often on a Sunday.',
    more:'Not yet in Prism: Eastern Orthodox practice and the Jesus Prayer, Franciscan simplicity, Dietrich Bonhoeffer.'},
  confucianism:{name:'Confucianism', short:'Confucianism', hue:'#ffc145',
    intro:'If Confucian values reached you as pressure to obey and to succeed, the Analects are about becoming a good person through relationships, and Confucius is sharp about ritual done without feeling.',
    more:'Not yet in Prism: Mencius on human goodness, Xunzi\'s opposing view, Wang Yangming on the unity of knowing and acting.'},
  daoism:{name:'Daoism', short:'Daoism', hue:'#e9e35a',

  hinduism:{name:'Hinduism', short:'Hinduism', hue:'#36c9c6',

  humanism:{name:'Secular humanism', short:'Humanism', hue:'#4ab1f7',

/* Each lens: core idea, a key term in its own vocabulary, one question it always asks,
   and a framing plus a question for each of the ten themes ([framing, question]). */
var LENSES = [
{id:'desert', fam:'christianity', known:false,
 name:'Desert Fathers and Mothers, and the contemplatives', short:'Desert and contemplative',
 idea:'From the 3rd and 4th centuries, Christians went into the Egyptian desert to pray alone, and their sayings were passed down. The contemplatives who followed, such as Julian of Norwich and Thomas Merton, treat faith as patient attention more than argument: you sit still long enough to see what is actually going on in you.',
 term:'hesychia', gloss:'stillness; an inner quiet in which God, and your own heart, can be noticed.',
 ask:'If you sat alone with this for an hour without trying to fix it, what would come up first?',
 quote:{text:'Go, sit in your cell, and your cell will teach you everything.', by:'Abba Moses, Sayings of the Desert Fathers'},
 door:'If church felt like a lot of talking, believing the right things and keeping busy, the desert tradition is mostly silence and paying attention. Practice comes first and doctrine sits in the background.',
 t:{
  loss:['The desert monks expected grief and did not hurry it; tears were sometimes counted as a gift. Julian of Norwich, who lived through the plague years, held that all shall be well without pretending anything was well yet.','What would it be like to let this grief stay as long as it needs to?'],
  failure:['One of the sayings has a monk ask what to do now that he has fallen, and the answer is simply: get up again, as many times as it takes. Merton would ask whether the hurt belongs to your true self or to the false self that needed to look good.','Which part of you is most upset: the part that cares about the thing, or the part that cares how it looks?'],
  conflict:['The desert sayings are severe about judging others. Abba Moses, called to judge a brother, arrived carrying a leaking jug of water and said his own faults were running out behind him unseen. Look at your own part first.','What is trailing behind you in this conflict that you have not looked at?'],
  love:['Contemplatives treat love as attention: seeing a person as they are, not as you need them to be. Julian describes God\'s love as courteous and homely, meaning close and ordinary.','Where did you see this person clearly, and where were you seeing what you needed?'],
  work:['Desert monks wove baskets and rope as part of their prayer; John Cassian tells of one who burned a year\'s worth because he lived too far from any market to sell them. The work was a way of staying present, and its results came second.','If no one ever saw the results of this work, what would still make it worth doing?'],
  change:['Merton\'s best-known prayer begins by admitting he has no idea where he is going and cannot see the road ahead. The contemplative stance keeps attention on the next honest step rather than the whole map.','What is the next honest step, if you set the whole map aside?'],
  uncertainty:['The Cloud of Unknowing, a 14th-century English guide, says God is reached by love rather than by thought. Not knowing is treated as a normal condition of the spiritual life, not a problem to solve first.','What would change if not knowing was a place you were allowed to stay for a while?'],
  joy:['Julian of Norwich describes being shown a little thing, the size of a hazelnut, in the palm of her hand: all that is made, kept in being because it is loved. Joy, in this strand, is noticing that things are held.','What small thing in this moment would you hold in your palm and look at?'],
  injustice:['Merton was a monk who rarely left his monastery, and he wrote against racism, the Vietnam War and nuclear weapons. Silence made him see the world more clearly, and then speak.','Has stillness ever made you see an injustice more clearly rather than less?'],
  stuck:['The desert monks named acedia, the noonday demon: a restless listlessness that makes you want to be anywhere but here. Their advice was to stay in your cell and keep going.','Is this stuckness asking you to leave, or to stay put and look closer?']
 }},
{id:'ignatian', fam:'christianity', known:false,
 name:'Ignatian spirituality', short:'Ignatian',
 idea:'Ignatius of Loyola, a 16th-century soldier who founded the Jesuits, taught that God can be found in all things, including your own moods and desires. His Spiritual Exercises train you to notice those inner movements and use them to make decisions.',
 term:'consolation and desolation', gloss:'consolation is any inner movement toward faith, hope and love; desolation is the pull toward turmoil, discouragement and turning in on yourself.',
 ask:'Looking back over today, where did you feel most alive, and where most drained?',
 quote:{text:'In time of desolation never make a change.', by:'Ignatius of Loyola, Spiritual Exercises, rules for discernment (common rendering)'},
 door:'If faith arrived as rules handed down, Ignatian practice starts from your own experience. Your moods and desires are treated as information worth reading, and big decisions get a careful method.',
 t:{
  loss:['Grief usually brings desolation, and Ignatius advises against making big decisions in that state. The examen, a short daily review, would also ask you to notice any moments of consolation that still turned up beside the loss.','In the middle of this loss, was there a moment that felt like a small consolation?'],
  failure:['The examen looks back without condemning: notice what happened, notice where you moved toward love and where away from it, then ask for help with tomorrow. Failure becomes material for discernment.','Looking back on this, where did you move toward what you care about, and where away from it?'],
  conflict:['The Exercises open by asking you to be readier to put a good interpretation on another person\'s words than to condemn them, and to ask what they meant before correcting them.','What is the most generous honest reading of what the other person said or did?'],
  love:['Ignatius notes that love shows itself more in deeds than in words, and that it consists in sharing what each has with the other. Your own desires are taken seriously as clues to what you are being drawn toward.','What would love do here, in deeds rather than words?'],
  work:['Vocation is found by discernment: imagine each option, live with it in prayer for a while, and notice which one brings lasting consolation rather than a quick thrill.','If you picture yourself a year into each option, which brings a quieter, steadier peace?'],
  change:['Ignatius changed course while recovering from a cannonball wound. He noticed that daydreams of glory left him dry afterward, while daydreams of service left him content. That noticing became his method.','Which version of the future, when you daydream it, leaves you content afterward, and which leaves you flat?'],
  uncertainty:['Discernment exists for uncertainty. Ignatius suggests weighing reasons on both sides, imagining what you would advise a stranger in your place, and imagining how you would want to have chosen at the end of your life.','What would you advise a stranger in exactly your position?'],
  joy:['Joy is a sign of consolation, and the examen begins with gratitude. Ignatius would ask you to savour it rather than move on, and to notice which way it points.','Where is this joy pointing you?'],
  injustice:['Since 1975 the Jesuits have described their mission as the service of faith and the promotion of justice. An Ignatian reading asks what this injustice stirs in you and what concrete response follows from that.','What does this stir in you, and what is one concrete thing it asks of you?'],
  stuck:['Stuckness may be desolation, which Ignatius said passes. His advice: do not change course in the dark, keep to the good decisions you made before, and act a little against the pull of the low mood.','Was the decision you made before this stuckness a good one? What would keeping faith with it look like?']
 }},
{id:'quaker', fam:'christianity', known:false,
 name:'Quaker (Religious Society of Friends)', short:'Quaker',
 idea:'Quakers hold that there is "that of God in every one" and that ordinary people can be guided directly by an inner light, without clergy or creeds. Worship is often an hour of shared silence, broken only when someone feels moved to speak.',
 term:'testimonies', gloss:'the ways belief shows up in conduct, often summarised as simplicity, peace, integrity, community, equality and stewardship.',
 ask:'If you sat in silence with this and waited, what might rise that you did not plan to say?',
 quote:{text:'Walk cheerfully over the world, answering that of God in every one.', by:'George Fox, letter of 1656'},
 door:'No sermon, no creed and usually no minister. If the words and the hierarchy got in the way, a Quaker meeting is mostly silence, and trust that ordinary people can be led from within.',
 t:{
  loss:['Quakers hold memorial meetings in silence, where anyone may stand and say something about the person who died. Grief is shared without anyone needing to find the right words first.','If people who knew what you lost sat in silence together, what would you want said aloud?'],
  failure:['The integrity testimony asks for the same truth in public and in private. A failure met honestly is less of a problem, in this view, than the instinct to tidy up the story.','Is there any part of this you have been tempted to tell differently from how it happened?'],
  conflict:['The peace testimony goes beyond refusing war to looking for "that of God" even in an opponent. Quakers use slow, listening meetings to work through hard disagreements without forcing a vote.','What in the other person might be answering to something good, even if they are wrong about this?'],
  love:['A Quaker wedding traditionally has no officiant: the couple make their promises to each other during a silent meeting, with everyone present as witnesses. Love is a commitment held within a community.','Who witnesses this love, and what might they see that you do not?'],
  work:['"Let your life speak" is a Quaker saying: your conduct is your message. Quaker traders were known for fixed prices and plain dealing at a time when haggling was the norm.','If your work were the only thing that spoke for you, what would it be saying?'],
  change:['Quakers speak of proceeding "as way opens": take the step you can see, then wait for the next one rather than forcing it.','What way is opening, if you stop pushing on the door that is closed?'],
  uncertainty:['A clearness committee is a few trusted people who meet with you, ask only honest open questions, give no advice, and help you hear your own inner guidance.','If a few people asked you only honest questions about this, which question would you dread most?'],
  joy:['Simplicity, in Quaker practice, clears space for what matters. A joy that needs nothing added to it is close to what they mean.','Would this joy survive if you took away all the extras around it?'],
  injustice:['Quakers were among the earliest organised opponents of slavery and remain active in prison reform and peace work. "Speak truth to power" became a Quaker phrase through a 1955 pamphlet of that name.','What truth here needs saying to someone with power, and who is in a position to say it?'],
  stuck:['Quakers treat waiting in silence as a kind of action. Being stuck might be a period of waiting before a clear leading arrives.','What would it be like to treat this as waiting rather than as failing to move?']
 }},
{id:'liberation', fam:'christianity', known:false,
 name:'Liberation theology and the social gospel', short:'Liberation theology',
 idea:'Liberation theology grew in Latin America from the late 1960s (Gustavo Gutiérrez, A Theology of Liberation, 1971). It reads the Bible from the side of the poor and judges faith by what it does. The earlier social gospel in North America, led by Walter Rauschenbusch, also saw sin in social structures as well as in individuals.',
 term:'the preferential option for the poor', gloss:'the conviction that God sides with the poor and oppressed, so faithful people look at the world from their side first. Its partner idea is praxis: acting, reflecting on the action, and acting again.',
 ask:'Who else is affected by this moment, and who has the least say in it?',
 quote:{text:'When I give food to the poor, they call me a saint. When I ask why the poor have no food, they call me a communist.', by:'Dom Hélder Câmara, archbishop of Olinda and Recife'},
 note:'Contested within the Catholic Church: the Vatican criticised parts of it in the 1980s, while the preferential option for the poor became mainstream Catholic teaching.',
 door:'If Christianity seemed private, otherworldly or comfortable, this strand reads the gospel as being about bread, land, debt and who gets left out, here and now.',
 t:{
  loss:['Liberation theology asks whose losses are mourned in public and whose go unmarked. Your grief is real, and it can also connect you to the many who lose things without anyone noticing.','Who else has lost something like this, with less support than you had?'],
  failure:['Failure is read in context: which structures made success harder or easier for you? This is an honest accounting of what was yours and what belonged to the situation, and it is not meant as an excuse.','Which part of this failure was yours, and which part belonged to the situation you were in?'],
  conflict:['Not every conflict is between equals. This strand asks who holds the power, and warns that calls for calm can sometimes protect the stronger side.','Who holds more power in this conflict, and how does that change what fairness looks like?'],
  love:['Love reaches past private affection into solidarity: standing with people in their actual situation. Gutiérrez saw love of God and love of neighbour as one thing.','Does this love make you more open to others, or close a circle around the two of you?'],
  work:['Work is judged by whom it serves and what it builds. In Latin American base communities, small groups read scripture together and then acted on what it said about their own lives.','Who benefits from your work, and who pays for it?'],
  change:['This strand expects that things can and should change, and treats hope as something practised with other people. Personal change is tied to the change of conditions around you.','What would need to change around you, and not only in you?'],
  uncertainty:['Praxis means acting, then reflecting, then acting again. You do not need certainty to begin; you learn by doing alongside others.','What is one small action you could take and then learn from?'],
  joy:['Base communities celebrated together even in poverty. Joy here is shared, and it does not wait until everything is fixed.','Who could share this joy with you, especially someone who does not get much of it?'],
  injustice:['This is the strand\'s home ground. Sin is also structural, built into laws and economies, and faith asks you to name it and act with the people it affects.','Is this injustice a one-off, or the result of how something is set up?'],
  stuck:['Stuckness may not be only personal. Liberation theology asks whether forces you could name, and resist with others, are holding your situation in place.','Is something outside you keeping you stuck, and who else is stuck in the same place?']
 }},
{id:'kierkegaard', fam:'christianity', known:false,
 name:'Kierkegaard', short:'Kierkegaard',
 idea:'Søren Kierkegaard (1813 to 1855), a Danish philosopher, attacked comfortable Christianity and argued that the truths that matter have to be lived by the single individual, not just agreed with. Faith, for him, is a passionate commitment made without proof.',
 term:'the leap', gloss:'a decisive commitment that reasoning cannot complete for you. "Leap of faith" is a later summary of his idea rather than his own phrase.',
 ask:'What decision here is yours alone, the kind no argument can make for you?',
 quote:{text:'Life can only be understood backwards; but it must be lived forwards.', by:'Søren Kierkegaard, journals, 1843'},
 door:'If belief was presented as settled and comfortable, Kierkegaard thought settled, comfortable Christianity was the problem. He takes doubt, dread and despair seriously and asks you to be honest about them.',
 t:{
  loss:['In Works of Love, Kierkegaard calls love for the dead the most unselfish and faithful love, because the dead cannot repay it. Grief becomes a way of keeping faith with someone.','What does faithfulness to what you lost look like from here?'],
  failure:['He saw despair as the failure to become yourself, and thought most people are in it without knowing. A visible failure can be more honest than a quiet life of evasion.','Does this failure show you something about who you are trying to be?'],
  conflict:['Kierkegaard distrusted "the crowd" and held that truth is reached by the single individual. In a conflict he would ask whether you are speaking for yourself or for a side.','Are you speaking for yourself here, or for a group you feel you have to defend?'],
  love:['Works of Love separates preferential love, for partners and friends, from love of the neighbour, which is owed to everyone. He thought the second keeps the first honest.','Would you still owe this person care if they stopped giving you anything back?'],
  work:['At 22 he wrote in his journal that he needed to find a truth that is true for him, an idea he could live and die for. He would ask whether this work is that, or a way of avoiding the question.','Is there an idea you could live for in this work, or are you doing what was expected?'],
  change:['He described stages of life (the aesthetic, the ethical and the religious) and thought moving between them takes a leap, not a gradual slide. Change that matters asks for commitment.','What change here needs a commitment you have been putting off?'],
  uncertainty:['Kierkegaard called anxiety "the dizziness of freedom": it appears because you really could choose. Uncertainty is the condition in which real choices happen.','If this anxiety is the feeling of having real options, which option frightens you most, and why?'],
  joy:['He could be gloomy, but he wrote discourses on the lilies of the field and the birds of the air as teachers of joy: being wholly present today, without borrowing worry from tomorrow.','Can you be wholly in this joy today, without worrying whether it lasts?'],
  injustice:['He spent his last years attacking the Danish state church, which he thought had turned faith into a social convenience. He would ask whether you are going along with something you know is wrong.','Where are you going along with something because everyone else is?'],
  stuck:['Kierkegaard thought endless reflection can become a way to avoid choosing. At some point more thinking stops helping and only a decision moves you.','Have you thought about this long enough that more thinking is now a way to avoid deciding?']
 }},
{id:'mussar', fam:'judaism', known:false,
 name:'Mussar', short:'Mussar',
 idea:'Mussar is a Jewish practice of ethical self-development, revived in 19th-century Lithuania by Rabbi Israel Salanter. It treats character traits as things you can work on deliberately, one at a time, over a lifetime.',
 term:'middot', gloss:'soul traits, such as patience (savlanut), humility (anavah), gratitude (hakarat hatov) and trust (bitachon). Each has a healthy middle you aim for, neither too much nor too little.',
 ask:'Which trait was tested in this moment, and was it too strong or too weak?',
 quote:{text:'If I am not for myself, who will be for me? And if I am only for myself, what am I? And if not now, when?', by:'Hillel, Pirkei Avot 1:14'},
 door:'If Judaism felt like rules and ritual without much inner life, Mussar turns the same tradition toward your character: concrete, patient work on who you are with other people.',
 t:{
  loss:['Grief tests trust and patience. Mussar would not ask you to feel less, but to notice which of your traits you are leaning on and which one has worn thin.','Which of your strengths is carrying you through this, and which has gone thin?'],
  failure:['Mussar uses cheshbon hanefesh, an accounting of the soul, to review your conduct honestly. A failure is data about a trait, written down without self-punishment so you can work on it.','If you wrote this failure in a ledger of character, which trait would it go under?'],
  conflict:['Honour (kavod) and humility (anavah) are tested here. Humility in Mussar means taking up your rightful space, no more and no less, rather than shrinking.','In this conflict, were you taking up more space than was yours, or less?'],
  love:['Loving-kindness (chesed) is a core middah: giving beyond what is required. Mussar teachers warn that it can tip into giving that serves your own need to be needed.','Is your care here for them, or partly for your need to be the one who gives?'],
  work:['Order (seder), zeal (zerizut) and equanimity (menuchat hanefesh) are all middot. How you work is a direct expression of character, in this view.','Which trait does your work most need from you right now?'],
  change:['Mussar expects change to be slow. You choose one trait, practise it for weeks, and expect relapses as part of the process.','If you chose one trait to work on for the next month, which would this moment suggest?'],
  uncertainty:['Bitachon, trust, is the trait in play: doing your part fully, then trusting God with what is not yours to control.','What is your part here, and what is not yours to carry?'],
  joy:['Gratitude, hakarat hatov, literally means "recognising the good". It is a trait to practise rather than wait for: seeing good you would otherwise take for granted.','What good is in this moment that you would normally take for granted?'],
  injustice:['Salanter is remembered for telling his community to eat on Yom Kippur during an 1848 cholera epidemic, putting lives ahead of strict observance. The inner work is meant to make you more just toward others.','Which of your traits would need strengthening for you to act on this?'],
  stuck:['Mussar holds that the gap between knowing and doing is where the work is. Small actions, repeated, shift a trait more than insight does.','What small action, repeated daily, would loosen this?']
 }},
{id:'wrestling', fam:'judaism', known:false,
 name:'Wrestling and questioning', short:'Wrestling and questioning',
 idea:'Jacob wrestles all night with a mysterious figure and is renamed Israel, often read as "one who struggles with God" (Genesis 32). Abraham argues with God over Sodom, and the Talmud preserves the losing opinions alongside the winning ones. In this strand, questioning and arguing are forms of devotion, and the work they point to is tikkun olam, repairing the world.',
 term:'machloket l\'shem shamayim', gloss:'argument for the sake of heaven: disagreement aimed at truth rather than at winning (Pirkei Avot 5:17).',
 ask:'If you argued with this moment out loud, as an equal, what would you say?',
 quote:{text:'It is not your duty to finish the work, but neither are you free to desist from it.', by:'Rabbi Tarfon, Pirkei Avot 2:16'},
 door:'If religion meant accepting answers, this strand prizes the question. Arguing with God and with the text is a sign of taking both seriously.',
 t:{
  loss:['Job demands an explanation for his losses, and at the end God says Job spoke rightly, unlike the friends who defended God with neat answers (Job 42:7). Grief is allowed to be angry and to demand an answer.','If you could demand an answer about this loss, what exactly would you ask?'],
  failure:['Jacob leaves the wrestling match limping and blessed. The tradition expects you to come out of a struggle changed, and possibly marked.','What did this struggle leave you with, besides the injury?'],
  conflict:['The schools of Hillel and Shammai argued for generations, and the Talmud says both spoke "the words of the living God". Hillel\'s school prevailed partly because they taught their opponents\' views before their own (Eruvin 13b).','Could you state the other side\'s view so well that they would agree you had it right?'],
  love:['In this strand, love includes argument. Abraham pleads with God on behalf of strangers in Sodom, and the relationship survives the disagreement.','Is there an argument this love could hold that you have been avoiding?'],
  work:['Tikkun olam gives work a wider frame: each task can be a small repair. Rabbi Tarfon\'s line says you do not have to finish the work, but you cannot walk away from it.','What part of repairing the world does your work touch, even slightly?'],
  change:['Jacob gets a new name after the struggle. Change in this tradition often comes through a contest rather than around it.','If this moment gave you a new name, what would it be?'],
  uncertainty:['The Talmud sometimes ends a debate with "teiku": let it stand, unresolved. Leaving a question open is a legitimate outcome.','Which question here could you let stand unresolved for now?'],
  joy:['Joy (simcha) is commanded at festivals, and arguing over a text with a study partner (chavruta) is one of the tradition\'s pleasures.','Who would you want to argue with about this joy, for the pleasure of it?'],
  injustice:['Abraham\'s question at Sodom, "Shall not the Judge of all the earth do justly?" (Genesis 18:25), sets the pattern: you may hold even the highest authority to its own standard.','Who here needs to be held to their own standard?'],
  stuck:['Jacob refused to let go until he was blessed. Sometimes staying in the struggle is the work, rather than escaping it.','What blessing would you hold out for before letting go of this?']
 }},
{id:'sufi', fam:'islam', known:true,
 name:'Sufism', short:'Sufism',
 idea:'Sufism is the mystical strand of Islam, focused on knowing God directly through love, remembrance and the taming of the ego. Its poets, especially Jalal al-Din Rumi in the 13th century, describe the soul as a lover longing to return to its source.',
 term:'dhikr', gloss:'remembrance: repeating names of God or short phrases, alone or in a gathering, to keep the heart turned toward God. Its opposite pull is the nafs, the grasping self.',
 ask:'What would it mean to welcome this feeling as a guest rather than an intruder?',
 quote:{text:'This being human is a guest house. Every morning a new arrival.', by:'Rumi, "The Guest House", in Coleman Barks\'s English version'},
 note:'Barks\'s popular Rumi versions are loose English renderings and often soften the Islamic references in the Persian originals.',
 door:'If Islam reached you as law and obligation, Sufism shows the same faith from the inside: longing, music, poetry and love.',
 t:{
  loss:['Rumi\'s Masnavi opens with a reed flute crying because it was cut from the reed bed. Sufis hear longing and grief as signs of a deeper separation, and so as a kind of homing signal.','What does the longing in this loss tell you about what you love?'],
  failure:['Sufis speak of the nafs, the grasping ego, which failure bruises. A bruised nafs can be an opening, because the ego is what stands between you and the Beloved.','Which part of you was hurt by this: you, or your pride?'],
  conflict:['A Rumi poem, in Barks\'s version, speaks of a field out beyond ideas of wrongdoing and rightdoing where he will meet you. Sufis try to see something of God in the person across from them, even in the middle of an argument.','What would meeting this person out beyond right and wrong look like?'],
  love:['Love is the centre of Sufi practice. Human love is real and also a doorway: it teaches the heart how to love God.','What is this love teaching your heart to do?'],
  work:['Many Sufi orders combined ordinary trades with practice, keeping up remembrance while they worked. The question is less what work you do than whether your heart stays awake in it.','Can you stay present to what matters in this work, or does it put you to sleep?'],
  change:['The guest house poem asks you to welcome each arrival, even a crowd of sorrows, because each may be clearing you out for some new delight.','If this change is a guest, what might it be clearing room for?'],
  uncertainty:['Sufis speak of hayra, a holy bewilderment, where the mind\'s maps run out. Not knowing can be closer to God than certainty.','What if not knowing here is closer to the truth than any answer you could give?'],
  joy:['Sufi gatherings use music, poetry and, in the Mevlevi order, turning (sama) to express joy. Joy is itself a form of remembrance.','What does this joy remember?'],
  injustice:['Sufi teachers tie inner purification to outward conduct: the ego that grasps for itself is also the root of cruelty to others.','Where is grasping, yours or someone else\'s, behind this injustice?'],
  stuck:['Rumi\'s poems often say that what you are looking for is closer than you think. Being stuck may mean looking too far away.','What is closer than you have been looking?']
 }},
{id:'ihsan', fam:'islam', known:false,
 name:'Ihsan: everyday excellence, patience and gratitude', short:'Ihsan',
 idea:'In a famous hadith, the angel Gabriel asks the Prophet Muhammad about faith, and ihsan is defined as worshipping God as though you see Him, knowing that even if you do not see Him, He sees you. Everyday Muslim ethics builds on this with patience, gratitude and trust.',
 term:'ihsan', gloss:'excellence, or doing what is beautiful: acting with full care because you are seen. Alongside it: sabr (patient endurance), shukr (gratitude) and tawakkul (trust in God after doing your part).',
 ask:'If you acted as though you were fully seen, what would you do differently here?',
 quote:{text:'Tie it, and trust in God.', by:'The Prophet Muhammad, asked whether to tie his camel or simply trust God (hadith in al-Tirmidhi, common rendering)'},
 door:'If Islam was presented as a list of dos and don\'ts, ihsan is about the spirit behind them: doing ordinary things beautifully and with attention.',
 t:{
  loss:['On hearing of a death, Muslims say "inna lillahi wa inna ilayhi raji\'un": we belong to God and to Him we return (Quran 2:156). Sabr includes tears; the Prophet wept at the death of his infant son.','What would patient endurance look like here, with the tears included?'],
  failure:['Tawakkul means doing your part fully and leaving the outcome with God. If you did your part, the result is not a verdict on you; if you did not, repentance (tawba) is always open.','Did you tie the camel? If you did, what is still yours to carry?'],
  conflict:['The Quran asks believers to repel evil with what is better, so that an enemy may become like a close friend (41:34). Ihsan in conflict means responding better than you were treated.','What would responding better than you were treated look like, concretely?'],
  love:['The Quran describes spouses as placed together with affection and mercy between them (30:21). Love shows in ordinary kindness and kept promises.','Where is mercy, and not only affection, needed in this love?'],
  work:['A hadith says God has prescribed ihsan in all things. Doing work well, even when no one sees, is a form of worship.','What would doing this work beautifully, even unseen, involve?'],
  change:['The Quran says God does not change a people\'s condition until they change what is in themselves (13:11). Change is partly a gift and partly your responsibility.','What in yourself would this change need?'],
  uncertainty:['Istikhara is a prayer for guidance when deciding: you pray, you act, and you trust that what follows is good for you. Uncertainty is met with both effort and surrender.','Having done your part, what would trusting the outcome free you to do?'],
  joy:['Shukr is both a feeling and a practice, said as "alhamdulillah", praise be to God, over small things and large. The Quran says that if you are grateful, more will be given (14:7).','How would you give thanks for this joy, and to whom?'],
  injustice:['The Quran tells believers to stand firm for justice even against themselves or their own families (4:135). A well-known hadith says to change a wrong with your hand, or your tongue, or at the least your heart.','Can you change this with your hands, your words, or only your heart for now?'],
  stuck:['Sabr is active perseverance rather than passive waiting. The Quran pairs hardship with ease: "with hardship comes ease" (94:5-6).','What would persevering look like here, as opposed to only waiting?']
 }},
{id:'gita', fam:'hinduism', known:true,
 name:'Bhagavad Gita: karma yoga', short:'Karma yoga',
 idea:'In the Bhagavad Gita, the warrior Arjuna freezes before a battle and the god Krishna talks him through it. One of the paths Krishna teaches is karma yoga: do the work that is yours, fully, without clinging to its results.',
 term:'svadharma', gloss:'your own duty or path, fitted to your nature and situation. The Gita says it is better to do your own imperfectly than someone else\'s well (3.35).',
 ask:'What is the action here that is yours to do, however it turns out?',
 quote:{text:'You have a right to your actions, but never to their fruits.', by:'Bhagavad Gita 2.47 (common rendering)'},
 note:'Karma here means action. The popular sense of karma as cosmic payback is a related but different idea.',
 door:'If Hinduism came to you as festivals and family ritual, the Gita is a practical philosophy of action that speaks to work and hard decisions.',
 t:{
  loss:['Krishna tells Arjuna that the self is not born and does not die, so the wise grieve neither for the living nor the dead (2.11, 2.20). Many readers find this hard. The Gita still asks you to keep acting in the face of loss.','Is there an action that would honour this loss, rather than only feeling it?'],
  failure:['If you acted rightly, the outcome was never yours to own. Karma yoga separates the quality of your effort from the result.','Setting the result aside, how well did you act?'],
  conflict:['The whole Gita is set on a battlefield between cousins. It asks what your duty is in the conflict, not how to avoid discomfort. It has been read as a call to literal battle and, by Gandhi among others, as an allegory of inner struggle.','Setting aside what you want to happen, what is your duty in this conflict?'],
  love:['Bhakti, loving devotion, is another of the Gita\'s paths, and Krishna says such devotees are dear to him (chapter 12). Love offered without bargaining is close to what the Gita means by action without attachment.','Is there a bargain hidden in this love?'],
  work:['This is the Gita\'s home ground. Do your work as an offering, fitted to your own nature, and let go of the anxiety about how it will be received.','Is this work fitted to your nature, or to someone else\'s?'],
  change:['The Gita compares the self moving through bodies to a person changing worn-out clothes (2.22). Forms change; the one who acts through them goes on.','What in you stays steady while this changes?'],
  uncertainty:['Arjuna\'s paralysis is where the Gita starts. Krishna does not remove the uncertainty; he gives Arjuna a way to act within it.','What would acting rightly look like, even without knowing how this ends?'],
  joy:['The Gita warns against clinging to pleasant results as much as fearing unpleasant ones. It asks for equanimity (samatva): enjoy what comes without making your action depend on it (2.48).','Can you enjoy this without needing it to happen again?'],
  injustice:['Krishna\'s argument is that refusing to act is also an action. When your role calls for standing up, withdrawing for the sake of your own peace is not neutral.','Is staying out of this a real choice, or a way of keeping your hands clean?'],
  stuck:['Krishna tells Arjuna that no one can remain without acting, even for a moment (3.5). Being stuck may be a refusal to do your own work because the results feel uncertain.','What is the smallest piece of your own work you could do today without needing it to succeed?']
 }},
{id:'theravada', fam:'buddhism', known:true,
 name:'Theravada: insight practice', short:'Theravada insight',
 idea:'The Theravada tradition of Sri Lanka and Southeast Asia keeps the oldest complete collection of the Buddha\'s teachings, in Pali. Insight practice (vipassana) trains you to see three marks in all experience: impermanence (anicca), unsatisfactoriness (dukkha) and non-self (anatta).',
 term:'dukkha', gloss:'often translated "suffering"; closer to unsatisfactoriness or stress, the friction of wanting things to be other than they are.',
 ask:'Where exactly does this moment sit in your body, and does that sensation change as you watch it?',
 quote:{text:'All conditioned things are subject to decay. Strive on with diligence.', by:'The Buddha\'s last words, Mahaparinibbana Sutta (common rendering)'},
 note:'Mindfulness apps often borrow from this tradition while leaving out its ethics and its aim of liberation.',
 door:'If Buddhism reached you as statues, chanting or beliefs about rebirth, insight practice is a method of close observation you can test on your own experience.',
 t:{
  loss:['Everything that arises passes away, and the pain of loss is partly the pain of having wanted permanence. This does not say you should not grieve. It suggests looking closely at what grief is made of.','If you look closely at this grief, what is it made of, moment by moment?'],
  failure:['"My failure" assumes a solid self that failed. Non-self (anatta) invites you to see a process of causes and conditions rather than a verdict on a person.','If you leave out the word "I" for a moment, which causes and conditions led to this?'],
  conflict:['In the Sallatha Sutta the Buddha speaks of two arrows: the first is what happens to you, the second is the reaction you add yourself, which you can sometimes decline.','What is the first arrow here, and what is the second one you added?'],
  love:['Metta, loving-kindness, is cultivated deliberately and extended to everyone. The tradition distinguishes it from attachment, which wants to hold on.','Which part of this love wants the other person to be well, and which part wants to keep them?'],
  work:['Right livelihood is part of the Eightfold Path: earning a living without harming others. Work is also a place to practise attention.','Does this work cause harm anywhere along the line?'],
  change:['Change is not an interruption of normal life; in this view it is all there is. Practice means seeing that clearly, again and again.','What were you assuming would stay the same?'],
  uncertainty:['Craving for certainty is still craving. Insight practice treats the restless need to know as something to watch rather than feed.','Can you watch the wanting-to-know itself, without feeding it?'],
  joy:['Rapture (piti) is listed among the factors of awakening, so joy is part of the path. It is also impermanent, and seeing that can make it gentler without making it smaller.','Can you enjoy this fully while knowing it will pass?'],
  injustice:['In the Vasala Sutta the Buddha rejects the idea that birth decides a person\'s worth: one becomes noble or base by one\'s deeds. Harm comes from greed, hatred and delusion, in individuals and in groups.','Which of greed, hatred or delusion is driving this injustice?'],
  stuck:['Stuckness is impermanent too, even when it does not feel like it. The practice is to look at it closely enough to see it moving.','Is this stuckness really the same from hour to hour, or does it shift when you look?']
 }},
{id:'zen', fam:'buddhism', known:true,
 name:'Zen', short:'Zen',
 idea:'Zen grew in China (as Chan) and spread to Japan, Korea and Vietnam. It puts sitting meditation (zazen) and direct experience ahead of doctrine: seeing this moment as it is, without commentary.',
 term:'shoshin', gloss:'beginner\'s mind: meeting something openly, as if for the first time, even if you know it well.',
 ask:'What is actually here, right now, if you drop the story about it?',
 quote:{text:'In the beginner\'s mind there are many possibilities, but in the expert\'s there are few.', by:'Shunryu Suzuki, Zen Mind, Beginner\'s Mind (1970)'},
 door:'Zen cares little for doctrine and a great deal for direct experience: sit down, pay attention, see for yourself.',
 t:{
  loss:['Dogen wrote that firewood becomes ash and does not turn back into firewood, yet each has its own complete moment. Zen meets loss by being fully in this moment, the grief included.','What does this loss feel like right now, before you think about the next moment?'],
  failure:['A saying often attributed to Shunryu Suzuki: you are perfect as you are, and you could use a little improvement. Failure is something to sit with plainly, without stacking self-judgement on top.','What happened, plainly, without the commentary?'],
  conflict:['Zen stories often show a teacher refusing the terms of an argument altogether. A Zen reading asks what the situation looked like before either of you decided who was right.','What would you see if you met this person with beginner\'s mind?'],
  love:['Love in Zen is close to full attention: being with a person without your ideas about them getting in the way.','When were you last fully with this person, without planning or judging?'],
  work:['Samu, work practice, treats sweeping or cooking as meditation. Layman Pang\'s verse says his supernatural power and marvellous activity is drawing water and carrying firewood.','What would this work be like if it were the practice itself rather than a step toward something else?'],
  change:['There is only this moment, and it is always new. Change does not threaten a fixed self, because Zen holds there was none to begin with.','What would you notice if you met this change as a beginner?'],
  uncertainty:['In a well-known koan a teacher asks a student where he is going. The student says he does not know, and the teacher replies, "Not knowing is most intimate."','What is it like to stay with not knowing, without rushing past it?'],
  joy:['Zen tends to find joy in plain things: tea, a cold morning, a bird on a wire. It warns against holding on, not against delight.','What plain detail in this moment is worth delight on its own?'],
  injustice:['Thich Nhat Hanh, a Vietnamese Zen monk, spoke of engaged Buddhism during the war: practise mindfulness in the middle of suffering and act from that clarity. Zen has its own record of complicity too, such as wartime support for Japanese militarism.','What would acting on this from clarity, rather than anger, look like?'],
  stuck:['Many koans are designed to get you stuck, so that the thinking mind wears itself out. Being stuck can be the moment just before seeing differently.','What if this stuckness is the koan, rather than an obstacle to it?']
 }},
{id:'mahayana', fam:'buddhism', known:false,
 name:'Mahayana: the bodhisattva and compassion', short:'Mahayana compassion',
 idea:'Mahayana Buddhism, dominant in East Asia and Tibet, centres on the bodhisattva: someone who seeks awakening for the sake of all beings, not only for themselves. Compassion and wisdom are treated as the two wings of one bird.',
 term:'tonglen', gloss:'Tibetan "sending and taking": breathing in another\'s pain and breathing out relief, to reverse the habit of self-protection.',
 ask:'Who else is feeling something like this right now, and what would you wish for them?',
 quote:{text:'For as long as space endures, and for as long as living beings remain, until then may I too abide to dispel the misery of the world.', by:'Shantideva, Bodhicaryavatara 10.55'},
 door:'If Buddhism seemed cool and detached, the bodhisattva ideal starts and ends with care for other people.',
 t:{
  loss:['Tonglen would ask you to breathe in your own grief and that of everyone grieving a similar loss, and breathe out comfort to all of them. Your pain becomes a way of understanding others.','Could this grief connect you to others who have lost something similar?'],
  failure:['A bodhisattva vows to keep returning until all beings are free, so one failure is a step in a very long commitment. Compassion for yourself is part of compassion.','What would you say to a friend who failed in exactly this way?'],
  conflict:['Shantideva wrote that an enemy is a rare gift, because without one you cannot practise patience. The difficult person here gives you a chance to practise what a friend cannot teach.','What is this person teaching you that a friend could not?'],
  love:['The four boundless qualities (loving-kindness, compassion, sympathetic joy and equanimity) take ordinary love and widen it. You start with someone easy to love and extend outward.','Could the love you feel here extend to someone you find difficult?'],
  work:['The bodhisattva path frames everything, work included, as a way to benefit beings. The six perfections include generosity, patience and diligence.','Who does this work benefit, and could it benefit more people?'],
  change:['Emptiness (sunyata) means nothing has a fixed nature, which is exactly why change, including your own transformation, is possible.','If nothing here has a fixed nature, what could it become?'],
  uncertainty:['The bodhisattva acts without knowing how things will turn out, from bodhicitta, the wish to awaken for others. You cannot control the outcome, but you can tend your intention.','What is your intention here, whatever the outcome?'],
  joy:['Mudita is sympathetic joy: delight in other people\'s happiness. It is one of the four boundless qualities and an antidote to envy.','Whose joy could you celebrate alongside your own?'],
  injustice:['Compassion extends to everyone involved, including those who cause harm. That does not mean accepting the harm; it means opposing it without hatred.','Can you oppose this without hating the people behind it?'],
  stuck:['Pema Chödrön, an American nun in the Tibetan tradition, writes about staying with discomfort rather than escaping it. Stuckness can soften you toward everyone else who feels stuck.','If you breathed in this stuckness for everyone who feels it, what would change?']
 }},
{id:'laozi', fam:'daoism', known:true,
 name:'Laozi and the Daodejing', short:'Laozi',
 idea:'The Daodejing, traditionally credited to Laozi and probably compiled around the 4th century BCE, describes the Dao, the way things naturally unfold, which cannot be fully named. Its advice is to stop forcing, be soft like water, and return to simplicity.',
 term:'wu wei', gloss:'non-forcing action: moving with how things are already moving rather than against them. It does not mean doing nothing. Its companion image is pu, the uncarved block: simplicity before ambition shapes it.',
 ask:'Where in this are you pushing against the grain of things?',
 quote:{text:'The highest good is like water. Water benefits all things and does not compete.', by:'Daodejing, chapter 8 (common rendering)'},
 note:'English translations of the Daodejing differ a great deal. Treat any single line as one reading among several.',
 door:'The Daodejing is about 5,000 characters long and reads more like advice on not forcing things than like a religion.',
 t:{
  loss:['Chapter 16 describes all things flourishing and then returning to their root. Loss is part of that return rather than a malfunction, though the book never asks you to feel nothing.','What would it mean to see this loss as something returning to its root?'],
  failure:['Chapter 22 says the bent becomes straight and the hollow becomes full. Laozi often turns failure and success upside down: the low place is where water gathers.','What might be gathering in this low place?'],
  conflict:['Water does not fight rocks; it goes around them and, over time, wears them down. Laozi distrusts force, and chapter 68 says a good warrior is not violent and a good fighter is not angry.','What would going around this conflict, like water, look like?'],
  love:['Laozi names three treasures: compassion, frugality, and not putting yourself first (chapter 67). Love here is soft and unforced.','Where are you forcing this love, and what happens if you stop?'],
  work:['Chapter 17 says that when the best leader\'s work is done, the people say "we did it ourselves". Good work, for Laozi, is often invisible.','Could this work go well without anyone knowing it was you?'],
  change:['The Dao is always moving. Chapter 76 says the soft and supple are companions of life, and the hard and stiff are companions of death.','Where are you stiff here, and where could you be supple?'],
  uncertainty:['The Daodejing opens by saying the Dao that can be spoken is not the constant Dao. Laozi is at ease with mystery and suspicious of anyone who claims to have it all worked out.','What if this cannot be fully named yet, and that is all right?'],
  joy:['Laozi ties contentment to knowing when you have enough: there is no greater misfortune than not knowing what is enough (chapter 46).','Is this joy about having enough, or about wanting more?'],
  injustice:['Laozi condemns rulers who dress in finery and hoard wealth while the fields go to weeds and the granaries stand empty (chapter 53), and says that the more laws there are, the more thieves (chapter 57).','Is this injustice the result of too much control, or of someone grasping for too much?'],
  stuck:['Chapter 15 asks who can make muddy water clear, and answers: let it be still, and it clears by itself. Some stuckness comes from stirring the water.','What would happen if you stopped stirring this for a while?']
 }},
{id:'zhuangzi', fam:'daoism', known:false,
 name:'Zhuangzi', short:'Zhuangzi',
 idea:'The Zhuangzi (4th century BCE onward) is a book of stories, jokes and arguments that loosen fixed points of view. Its cast includes a cook whose knife never dulls, a gnarled tree too useless to cut down, and a frog who thinks his well is the whole world.',
 term:'xiaoyao you', gloss:'free and easy wandering: moving through life without being trapped by one perspective or one idea of what is useful.',
 ask:'How would this look to someone, or something, living on a completely different scale?',
 quote:{text:'All men know the use of the useful, but nobody knows the use of the useless!', by:'Zhuangzi, chapter 4, Burton Watson\'s translation'},
 door:'Zhuangzi is funny. If religion felt solemn, this is a book of jokes, odd characters and arguments that pull the rug out from under fixed views.',
 t:{
  loss:['When Zhuangzi\'s wife died, a friend found him drumming on a pot and singing. He said he had grieved at first, then came to see her death as part of a change like the passing of the seasons.','If you saw this loss as part of a larger change, like a season, what would still hurt and what might ease?'],
  failure:['Zhuangzi\'s useless tree lives to a great age because no carpenter wants it. What counts as failure depends on whose idea of usefulness you are using.','Whose idea of success are you failing by?'],
  conflict:['Zhuangzi points out that each side calls itself "this" and the other "that" (chapter 2). From the pivot of the Way, both positions look partial.','What would this conflict look like from a point between the two of you?'],
  love:['Zhuangzi tells of a marquis who welcomed a seabird with wine and court music until it died of fright (chapter 18). He fed it what he liked rather than what a bird needs.','Are you giving this person what they need, or what you would want?'],
  work:['Cook Ding carves oxen for nineteen years without sharpening his knife, because he follows the natural gaps in the joints (chapter 3). Skill comes from attention to the grain of the work.','Where is the natural gap in this work, the place where it goes easily?'],
  change:['Zhuangzi dreams he is a butterfly and wakes unsure whether he is a man who dreamed he was a butterfly or a butterfly now dreaming he is a man. He calls this the transformation of things.','What if the person you are becoming is as real as the one you were?'],
  uncertainty:['You cannot talk to a frog in a well about the ocean, because he is limited by his space (chapter 17). Uncertainty can be a sign that your well is getting bigger.','Where is the edge of your well in this situation?'],
  joy:['Zhuangzi and his friend Huizi argue on a bridge over whether Zhuangzi can know the joy of fish. Zhuangzi finally says he knew it from right there, standing above the river.','What do you know about this joy from exactly where you stand?'],
  injustice:['Zhuangzi notes that a man who steals a belt buckle is executed, while a man who steals a whole state becomes a lord (chapter 10).','Who gets to decide what counts as wrong here?'],
  stuck:['The useless tree and the free and easy wanderer suggest stepping outside the frame that says you must be getting somewhere.','What if being "stuck" just means not being useful in the way you expected?']
 }},
{id:'confucian', fam:'confucianism', known:false,
 name:'The Analects and Confucian self-cultivation', short:'Confucianism',
 idea:'Confucius (551 to 479 BCE) taught that a good life is built through relationships and roles: child, parent, friend, colleague, citizen. You become fully human by practising care and respect within them, every day.',
 term:'ren', gloss:'humaneness: the quality of a person who treats others well. It is expressed through li, the forms of courtesy and ritual that let relationships work.',
 ask:'Which relationship is at the heart of this, and what does it ask of you?',
 quote:{text:'What you do not wish for yourself, do not impose on others.', by:'Confucius, Analects 15.24 (common rendering)'},
 note:'Popular distortion: Confucianism is often reduced to obedience. The Analects also say that a good minister should openly oppose a ruler who is wrong (14.22).',
 door:'If Confucian values reached you as pressure to obey and succeed, the Analects are about becoming a good person through relationships, and Confucius is sharp about empty ritual.',
 t:{
  loss:['Mourning rites are central to the tradition because they give grief a shape and a length of time. Confucius said that in mourning, real grief matters more than correct form (Analects 3.4).','What form could you give this grief, so it has somewhere to go?'],
  failure:['Confucius said that to have a fault and not correct it is the real fault (15.30). Self-cultivation never ends, and failure is part of learning.','What would correcting this, rather than only regretting it, involve?'],
  conflict:['The exemplary person seeks harmony without conformity (13.23). Harmony is not sameness; it is people in different roles treating each other with respect.','How could you keep this relationship in harmony without simply giving in?'],
  love:['Love grows outward from the family to others in widening circles. Caring well for those close to you is the practice ground for caring for strangers.','How does this love train you to care for people beyond it?'],
  work:['The junzi, the exemplary person, attends to what is right; the petty person attends to profit (4.16). Work is part of self-cultivation and of service.','In this work, are you thinking about what is right, or only about what pays?'],
  change:['Confucius described his own life in stages: at fifteen he set his heart on learning, at thirty he took his stand, at forty he was free of doubts (2.4). Change is expected, slow and cumulative.','What stage of your life is this change part of?'],
  uncertainty:['Confucius said that knowing what you know, and knowing what you do not know, is knowledge (2.17). Honesty about your limits is part of good character.','What do you actually know here, and what do you not?'],
  joy:['The Analects open with joy: learning something and practising it, and friends arriving from far away (1.1). Joy comes from shared learning and friendship.','Who would you want to share this with, as with a friend arriving from far away?'],
  injustice:['Mencius, Confucius\'s great successor, argued that every person has a heart that cannot bear the suffering of others, and that rulers who abuse the people lose their right to rule.','What does your heart that cannot bear others\' suffering want to do here?'],
  stuck:['Confucius loved learning above almost anything and said that in any group of three people there is a teacher for him (7.22).','Who around you could teach you something about this?']
 }},
{id:'stoic', fam:'hellenistic', known:true,
 name:'Stoicism', short:'Stoicism',
 idea:'Stoicism began in Athens around 300 BCE and is best known through Epictetus, Seneca and Marcus Aurelius. It holds that your judgements and choices are fully yours and outside events are not, and that a good life comes from acting well within that line.',
 term:'the dichotomy of control', gloss:'separating what is up to you (your judgements, intentions and actions) from what is not (other people, outcomes, reputation, your body).',
 ask:'Which part of this is up to you, and which part is not?',
 quote:{text:'It is not things themselves that disturb people, but their judgements about those things.', by:'Epictetus, Enchiridion 5 (common rendering)'},
 note:'Popular distortion: lower-case "stoic" means keeping a stiff upper lip. The Stoics aimed at sound judgement rather than numbness, and they valued good feelings such as joy.',
 door:'Stoicism is a set of daily exercises for judgement rather than a mood of grim endurance.',
 t:{
  loss:['Epictetus advised never saying "I have lost it", only "I have given it back" (Enchiridion 11). Seneca allowed tears for a friend but warned against grief becoming a performance or a permanent home.','Is your grief still about them, or has part of it become about something else?'],
  failure:['Cicero gives the Stoic image of an archer: doing everything to aim well is up to them, but whether the arrow hits is not entirely theirs. A miss in results is not a failure in character.','Did you aim well, even if you missed?'],
  conflict:['Marcus Aurelius began his days expecting to meet people who are meddling, ungrateful and arrogant, and reminding himself that they are kin who act from ignorance (Meditations 2.1).','What might this person not understand that would explain how they acted?'],
  love:['The Stoics saw people as limbs of one body, made to work together. They warned against any love that depends on controlling the other person.','What part of this love depends on things outside your control?'],
  work:['Marcus told himself, on mornings he did not want to get up, that he was rising to do the work of a human being (5.1). Work is a duty to the common good, done well whether or not anyone praises it.','Would you do this work the same way if no one praised it?'],
