  change:['Marcus reminds himself again and again that the universe is change (4.3) and that nature loves to change things and make new ones like them.','What were you treating as permanent that was always changing?'],
  uncertainty:['Seneca recommends rehearsing the worst case in advance (premeditatio malorum) so it loses its grip, leaving you free to act on what is up to you.','If the worst plausible outcome happened, what would still be up to you?'],
  joy:['The Stoics separated shallow pleasure from joy (chara) rooted in acting well. They recommended enjoying what you have while remembering you will not always have it (memento mori).','Can you enjoy this more fully by remembering you will not always have it?'],
  injustice:['The Stoics treated every person as a fellow citizen of one world, and justice is one of their four cardinal virtues. Marcus kept asking what serves the common good.','What does justice ask of you here, as a citizen of the world rather than a bystander?'],
  stuck:['Marcus used the view from above: picture the scene from a great height, among all the cities, crowds and lives (7.48). Your stuckness shrinks to its real size.','From high above, among all the lives being lived, what does this look like?']
 }},
{id:'epicurean', fam:'hellenistic', known:false,
 name:'Epicureanism', short:'Epicureanism',
 idea:'Epicurus (341 to 270 BCE) taught that a good life is a pleasant one, but he meant quiet pleasures: friendship, simple food, conversation and freedom from fear. His school lived and studied together in a garden outside Athens.',
 term:'ataraxia', gloss:'untroubled calm: freedom from mental disturbance, the main goal of the Epicurean life.',
 ask:'What would make this moment simpler, rather than better?',
 quote:{text:'Of everything wisdom provides for a happy life, by far the greatest is friendship.', by:'Epicurus, Principal Doctrines 27 (paraphrase)'},
 note:'Popular distortion: an "epicure" loves luxury food. Epicurus ate simply and thought luxury mostly brought worry.',
 door:'Epicurus is a philosopher of pleasure who mostly recommends friends, simple food and not being afraid.',
 t:{
  loss:['Epicurus argued that death is nothing to the one who dies, since where death is, we are not. For those left behind, he recommended remembering a friend with gratitude rather than lament.','What pleasure you shared with what you lost could you remember with gratitude?'],
  failure:['Much failure hurts because of empty desires, for status or wealth, that have no natural limit. Epicurus would ask whether you failed at a natural need or at one of those.','Was what you failed at a natural need, or a desire with no limit?'],
  conflict:['Epicureans withdrew from public life to their garden because public conflict disturbs the mind. They would ask whether this fight is worth your peace.','Is this conflict worth the calm it is costing you?'],
  love:['Friendship is the centre of Epicurean life. Epicurus was wary of romantic passion, which he thought brought more disturbance than good, and preferred steady friendship.','Does this love bring you calm and friendship, or mostly disturbance?'],
  work:['Epicurus advised living unnoticed (lathe biosas) and needing little, which frees you from work driven by status. Work is good when it supports a simple, secure life among friends.','How much of this work is for status, and how much for a simple good life?'],
  change:['Epicureans thought everything is atoms moving in the void, always recombining. No god is punishing you; change is just nature.','What fear about this change could you set aside?'],
  uncertainty:['The Epicurean four-part cure (tetrapharmakos): do not fear the gods, do not worry about death, what is good is easy to get, and what is terrible is easy to endure.','Is the thing you fear here really as hard to endure as it feels?'],
  joy:['This is Epicurean home ground. Epicurus once asked a friend to send him a little pot of cheese so that he could have a feast whenever he liked. Simple pleasures, shared with friends, are the point.','How simple could this pleasure be and still be complete?'],
  injustice:['Epicurus described justice as an agreement neither to harm nor be harmed (Principal Doctrines 31 to 33). Injustice breaks that agreement and also breeds fear in the one who commits it.','What agreement not to harm has been broken here?'],
  stuck:['Epicureans practised dropping unnecessary desires. Being stuck can mean wanting something you do not actually need.','Which of your wants here could you drop without losing anything real?']
 }},
{id:'camus', fam:'existentialism', known:true,
 name:'Camus and the absurd', short:'Camus',
 idea:'Albert Camus (1913 to 1960) described the absurd: the clash between our hunger for meaning and a universe that does not answer. He rejected both despair and leaps of faith, and argued for living fully and honestly with the absurd, in a stance he called revolt.',
 term:'the absurd', gloss:'neither the world nor us on our own, but the mismatch between our demand for meaning and the world\'s silence.',
 ask:'If there were no hidden meaning in this, how would you still choose to live it?',
 quote:{text:'One must imagine Sisyphus happy.', by:'Albert Camus, The Myth of Sisyphus (1942)'},
 door:'Camus writes about living without final answers while still loving the sun and the sea.',
 t:{
  loss:['Camus offers no consolation that the loss was meant to be. The pain is real, the universe is silent, and you can still love life in the face of both.','Can you hold this loss without needing it to mean something?'],
  failure:['Sisyphus pushes his rock up the hill forever, and Camus imagines him happy, because the struggle toward the heights is enough to fill a heart. Failure can be lived with defiance, and even some humour.','What would it look like to push this rock again, on your own terms?'],
  conflict:['In The Rebel, Camus argues that every act of revolt says "no" to something and so says "yes" to a value worth defending. He opposed any violence that sacrifices people for ideas.','What value is your "no" in this conflict defending?'],
  love:['Camus saw love, friendship and physical life (the sea, the sun, bodies) as reasons to live that need no higher purpose behind them.','Is this love enough of a reason on its own?'],
  work:['Camus wrote that today\'s worker, doing the same tasks every day of his life, has a fate no less absurd than Sisyphus. The question is whether you are conscious of it and how you meet it.','If your work is a rock you will push for a long time, what would let you push it with your eyes open?'],
  change:['Camus did not believe history or fate guarantees improvement. Change is something you make, in revolt and with others, without guarantees.','What change could you make here without any guarantee it will last?'],
  uncertainty:['For Camus, honesty means not pretending to answers you do not have. Living without appeal to final answers is what he calls the absurd life.','What answer have you been pretending to have?'],
  joy:['Camus wrote with real joy about the sea and sun of Algeria. In "Return to Tipasa" he describes finding, in the depths of winter, an invincible summer within himself.','What would it mean to enjoy this without asking what it is for?'],
  injustice:['Camus edited the Resistance newspaper Combat and argued against the death penalty. In The Rebel he wrote "I rebel, therefore we exist": revolt reveals a dignity people share.','Who is in this with you, standing against it?'],
  stuck:['Sisyphus is the patron of being stuck. Camus offers lucidity rather than escape, and writes that there is no fate that cannot be surmounted by scorn.','If you cannot get out of this yet, how could you be in it more clearly?']
 }},
{id:'sartre', fam:'existentialism', known:true,
 name:'Sartre and de Beauvoir: freedom and responsibility', short:'Sartre and de Beauvoir',
 idea:'Jean-Paul Sartre and Simone de Beauvoir held that there is no fixed human nature: existence precedes essence. You become what you make of yourself through your choices, and de Beauvoir stressed that this freedom is always lived in a real situation, alongside other people\'s.',
 term:'bad faith', gloss:'mauvaise foi: deceiving yourself that you are not free, by hiding behind a role, a rule or your circumstances.',
 ask:'Where in this are you telling yourself you had no choice?',
 quote:{text:'Man is condemned to be free.', by:'Jean-Paul Sartre, Existentialism Is a Humanism (1946)'},
 door:'If freedom sounded like a slogan, Sartre and de Beauvoir make it uncomfortable: you are responsible for what you make of your situation.',
 t:{
  loss:['De Beauvoir wrote A Very Easy Death about her mother\'s dying: unsparing and tender. She found no consolation in metaphysics, only in honesty and in being there.','What would it mean to face this loss without any comforting story?'],
  failure:['Sartre held that you are the sum of your actions, not your intentions or hopes. A failure is a fact about what you did, and you remain free to act differently now.','Given what you did, what will you do next?'],
  conflict:['De Beauvoir argued that to want your own freedom you must also want other people\'s (The Ethics of Ambiguity). A conflict can be tested by whether your side respects the other person\'s freedom.','Does your position here respect the other person\'s freedom too?'],
  love:['Sartre and de Beauvoir questioned conventional relationships and wrote about love as two freedoms meeting, which is difficult and unstable. Love that tries to possess the other turns them into an object.','Is this love trying to possess, or to meet another freedom?'],
  work:['Sartre describes a waiter who plays at being a waiter so completely that he hides from his own freedom. Work can become a costume.','Are you playing a role at work so completely that you forget you chose it?'],
  change:['If there is no fixed self, change is always possible. You are not your past; you are what you do with it.','What part of your past are you using as a reason not to change?'],
  uncertainty:['A student asked Sartre whether to join the Resistance or stay to care for his mother. Sartre said no theory could decide it for him: you choose, and in choosing you make your values.','If no theory can decide this, what do you choose?'],
  joy:['Joy, for them, was often found in free creative action: writing, conversation, travel, love. It is made rather than given.','What did you choose that made this joy possible?'],
  injustice:['De Beauvoir\'s The Second Sex showed how women are made "other" by society rather than by nature. When some people\'s choices are constrained by others, that is a moral problem.','Whose freedom is being limited here, and by whom?'],
  stuck:['Being stuck may be bad faith: telling yourself your circumstances decide everything, when some choices remain.','What choice remains open here that you have been treating as closed?']
 }},
{id:'frankl', fam:'existentialism', known:true,
 name:'Frankl and logotherapy', short:'Frankl',
 idea:'Viktor Frankl, a Viennese psychiatrist who survived Auschwitz and other camps, argued that the deepest human drive is a will to meaning. He named three sources of it: creating a work or doing a deed, experiencing something or loving someone, and the attitude you take toward suffering you cannot avoid.',
 term:'logotherapy', gloss:'Frankl\'s therapy built around meaning (logos). It asks what life expects of you, rather than what you expect from life.',
 ask:'What is life asking of you in this moment?',
 quote:{text:'Everything can be taken from a man but one thing: the last of the human freedoms, to choose one\'s attitude in any given set of circumstances, to choose one\'s own way.', by:'Viktor Frankl, Man\'s Search for Meaning'},
 note:'Often misattributed: "Between stimulus and response there is a space" is widely credited to Frankl, but it has not been found in his writing.',
 door:'Frankl tested his ideas in the worst conditions imaginable. His is the least abstract of the existentialist strands.',
 t:{
  loss:['Frankl\'s wife, parents and brother died in the camps. He held that suffering can be given meaning by how it is borne, and that love reaches the beloved even when they are absent or dead.','How do you want to bear this, in a way you could respect later?'],
  failure:['Frankl would point to the meaning you can still create. A failed project does not erase the possibilities that remain open.','What can you still create or do, after this?'],
  conflict:['Frankl insisted that there are decent and indecent people in every group, guards and prisoners included. A conflict does not settle who someone is.','Is there decency on the other side you have overlooked, or indecency on yours?'],
  love:['Frankl called love the ultimate and highest goal a person can aspire to, and said love lets you see another person\'s potential, which they may not yet see themselves.','What potential do you see in this person that they may not see?'],
  work:['Creating a work or doing a deed is the first of Frankl\'s sources of meaning. He thought each person has a task that only they can fulfil.','What in this work could only you do?'],
  change:['Frankl held that people can change themselves at any moment and decide, within the limits of their circumstances, what they become.','Within the limits you have, what do you decide to become?'],
  uncertainty:['In the camps, Frankl saw that those who had a "why", something or someone waiting for them, could bear almost any "how". He was quoting Nietzsche.','What "why" could carry you through this uncertain "how"?'],
  joy:['Frankl describes moments of beauty even in the camps: a sunset, a bird. He took them as evidence that experience itself can give life meaning.','What does this joy tell you is worth living for?'],
  injustice:['Frankl rejected collective guilt and proposed a Statue of Responsibility on America\'s West Coast to balance the Statue of Liberty on the East.','What responsibility comes with the freedom you have here?'],
  stuck:['Logotherapy uses paradoxical intention for some fears: deliberately wishing for the thing you dread, often with humour, to loosen its grip.','What would happen if you leaned into this, with a bit of humour?']
 }},
{id:'humanist', fam:'humanism', known:true,
 name:'Secular humanism and scientific awe', short:'Humanism and awe',
 idea:'Secular humanism holds that people can lead ethical, meaningful lives without the supernatural, using reason, evidence and compassion. Scientific awe adds wonder at the actual universe: its size, its age, and the unlikeliness of us being here to notice.',
 term:'the pale blue dot', gloss:'Voyager 1\'s 1990 photograph of Earth from about 6 billion kilometres away, a single pixel, which Carl Sagan used to talk about humility and care for each other.',
 ask:'What does the evidence actually say about this, apart from how it feels?',
 quote:{text:'Look again at that dot. That\'s here. That\'s home. That\'s us.', by:'Carl Sagan, Pale Blue Dot (1994)'},
 door:'If you grew up secular, humanism can feel like an absence. It has its own history, ethics and sources of awe worth looking at on purpose.',
 t:{
  loss:['With no afterlife on offer, humanism honours a person through memory, through the effects they had, and through love that continues in others. Grief is the cost of a love that was real.','Which effects of this person or thing will carry on in the world?'],
  failure:['Science advances through failed experiments. A humanist reading treats failure as information and asks what you would test next.','If this were an experiment, what did it tell you, and what would you test next?'],
  conflict:['Humanism values reason and evidence in disagreement, and the dignity of every person whatever they believe.','What evidence would change your mind about this conflict?'],
  love:['Love needs no external justification. Sagan wrote that for small creatures such as we, the vastness is bearable only through love.','What makes this love precious, given how brief and small we are?'],
  work:['Humanists see work as one way to add to human flourishing and knowledge, now, in the only life we know we have.','How does this work add to human flourishing, even a little?'],
  change:['Everything in the universe changes, from stars to species. Change is how anything new, including us, came to exist.','What might this change make possible that could not exist before?'],
  uncertainty:['Science treats uncertainty as honest. Holding beliefs in proportion to the evidence, and saying "I don\'t know yet", is a strength.','How confident should you really be here, given the evidence?'],
  joy:['Wonder at the natural world is a deep source of joy for many humanists. The atoms in your body were forged in stars, and that is literally true.','What in this joy would still be wonderful at the scale of the universe?'],
  injustice:['Humanism rests on human rights and dignity. With no divine plan to set things right later, justice is up to us.','If no one else is going to fix this, what is your part?'],
  stuck:['The pale blue dot puts your stuckness in context: brief and small, and also part of the only life we know of anywhere.','Seen from very far away, what would matter most about this?']
 }},
{id:'ubuntu', fam:'ubuntu', known:false,
 name:'Ubuntu', short:'Ubuntu',
 idea:'Ubuntu is a Southern African ethic, summed up in the Nguni saying "umuntu ngumuntu ngabantu": a person is a person through other persons. You become fully human through how you treat others and how they treat you. Desmond Tutu and philosophers such as Mogobe Ramose have written about it at length.',
 term:'ubuntu', gloss:'humanness: being open, generous and bound up with other people, so that what diminishes them diminishes you.',
 ask:'Whose humanity is bound up with yours in this moment?',
 quote:{text:'Umuntu ngumuntu ngabantu. (A person is a person through other persons.)', by:'Nguni saying, isiZulu'},
 note:'Often shortened to "I am because we are", which is closer to a line from John Mbiti\'s African Religions and Philosophy (1969) than to the saying itself.',
 door:'Ubuntu is less a belief system than an ethic of how people make each other.',
 t:{
  loss:['A death is a loss to a whole community, and mourning is done together. Your grief is bound up with other people\'s grief.','Who else is grieving this, and could you grieve together?'],
  failure:['A failure touches the community you belong to, but you are not alone in it either. Ubuntu looks for restoration rather than shame.','Who has been affected by this, and who could help you put it right?'],
  conflict:['Tutu drew on ubuntu in South Africa\'s Truth and Reconciliation Commission, which favoured truth-telling and repair over revenge. Harming another person diminishes you too.','What would restoring the relationship, rather than winning, need?'],
  love:['Love is how personhood is made: care given and received across a whole community. It is less private than the Western romantic ideal.','Who around you is part of this love, beyond the two of you?'],
  work:['Work matters by how it supports others and the community, not only by personal achievement. A person with ubuntu is generous with what they have.','Who does your work make more fully human, including you?'],
  change:['You change as your relationships change. Moving, losing people or gaining them changes who you are.','Which relationships are shifting with this change?'],
  uncertainty:['You do not have to face uncertainty alone. Ubuntu suggests seeking counsel and relying on each other.','Who could you think this through with?'],
  joy:['Joy is shared and grows in company. Joy kept to yourself is smaller.','Who could share this joy with you?'],
  injustice:['Dehumanising others diminishes everyone, including the one who does it. Ubuntu asks for justice that restores dignity on all sides.','How is this injustice diminishing everyone involved, including those causing it?'],
  stuck:['Being stuck can come from isolation. Ubuntu would ask who you have withdrawn from.','Who have you pulled away from while you have been stuck?']
 }},
{id:'kimmerer', fam:'reciprocity', known:false,
 name:'Robin Wall Kimmerer: reciprocity', short:'Kimmerer',
 idea:'Robin Wall Kimmerer is a botanist and an enrolled member of the Citizen Potawatomi Nation. In Braiding Sweetgrass (2013) she brings Indigenous teachings and plant science together around reciprocity: the land gives to us, and we owe care and gifts in return.',
 term:'the Honorable Harvest', gloss:'guidelines she describes for taking from the land: ask permission, never take the first, take only what you need, use it respectfully, share it, and give something back.',
 ask:'What have you been given in this, and what do you owe in return?',
 quote:{text:'All flourishing is mutual.', by:'Robin Wall Kimmerer, Braiding Sweetgrass (2013)'},
 note:'Kimmerer writes from her own Potawatomi heritage and her training as a scientist. She is one voice, not a spokesperson for all Indigenous traditions.',
 door:'Kimmerer writes as a scientist and a Potawatomi woman at once, so the plants are both data and teachers.',
 t:{
  loss:['Kimmerer writes about grief for land and species alongside personal grief. Loss can be met with gratitude for what was given and a wish to give something back.','What were you given by what you lost, and how could you pass that gift on?'],
  failure:['In gardens and forests, things fail and become compost for what comes next. In a reciprocal world, failure feeds new growth.','What could this failure feed?'],
  conflict:['She describes the Three Sisters (corn, beans and squash) growing together, each different and each helping the others. Difference can be a strength in a relationship.','What does each side bring that the other needs?'],
  love:['She asks whether the land loves us back, and finds the answer in her garden, where care and food pass in both directions. Love is shown through gifts given and received.','How is love being given and received here, in both directions?'],
  work:['Kimmerer contrasts a gift economy with a market economy. Work given as a gift builds relationship; work done only for exchange can feel empty.','Which parts of your work feel like gifts, and which only like transactions?'],
  change:['Plants respond to the seasons while staying in relationship with everything around them. Change is natural and happens together.','Which relationships could help you through this change?'],
  uncertainty:['Kimmerer stresses humility about what we do not know, and learning from plants and other beings as teachers.','What could you learn by paying close attention to something other than yourself?'],
  joy:['For Kimmerer, wild strawberries are a gift that shaped her sense of the world as generous. Gratitude is the natural response to joy, and it leads to giving back.','Who or what would you thank for this joy?'],
  injustice:['She writes about the taking of land and the loss of language, and about restoration as both ecological and cultural work.','What would restoration, and not only stopping the harm, look like here?'],
  stuck:['Reciprocity suggests you may be stuck because something has stopped flowing in both directions.','Where has giving or receiving stopped flowing in your life?']
 }}

    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function announce(msg){
  var el = $('live'); if (!el) return;
  el.textContent = '';
  setTimeout(function(){ el.textContent = msg; }, 30);
}
function fmtDate(iso){
  var p = String(iso || '').split('-');
  if (p.length !== 3) return iso;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  try { return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }
  catch (e) { return iso; }
}
function swatch(hue){
  return '<svg class="sw" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M6 1 11.2 11H.8Z" fill="' + hue + '" stroke="var(--sw-stroke)" stroke-width=".8"/></svg>';
}

  return '<svg viewBox="0 0 18 18" aria-hidden="true" focusable="false"><rect x="10" y="2" width="2" height="14" fill="currentColor" opacity=".45"/><path d="M1 14l8.4-5L1 4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1 4l3.6.2M1 4l2 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';

function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function themeLower(t){ return (THEME_LABEL[t] || '').toLowerCase(); }

/* ------------------------------------------------------------------ */
/* Statistics                                                          */
/* ------------------------------------------------------------------ */

function stats(filter){
  var fam = {}, lens = {}, moments = 0, own = 0, examples = 0;
  FAMILY_ORDER.forEach(function(f){ fam[f] = {lands:0, unsure:0, pushes:0, tried:{}}; });
  state.moments.forEach(function(m){
    if (filter && filter !== 'all' && m.theme !== filter) return;
    moments++; if (m.example) examples++; else own++;
    m.lenses.forEach(function(r){
      if (!r.mark || !LENS[r.id]) return;
      var L = LENS[r.id];
      fam[L.fam][r.mark]++;
      fam[L.fam].tried[r.id] = true;
      var s = lens[r.id] || (lens[r.id] = {lands:0, unsure:0, pushes:0, th:{lands:{}, unsure:{}, pushes:{}}});
      s[r.mark]++;
      s.th[r.mark][m.theme] = (s.th[r.mark][m.theme] || 0) + 1;
    });
  });
  return {fam:fam, lens:lens, moments:moments, own:own, examples:examples};
}
function lensCounts(){
  var c = {};
  state.moments.forEach(function(m){ m.lenses.forEach(function(r){ if (r.mark) c[r.id] = (c[r.id] || 0) + 1; }); });
  return c;
}

/* ------------------------------------------------------------------ */
/* Lens selection                                                      */
/* ------------------------------------------------------------------ */

function wpick(arr, wfn){
  var ws = arr.map(wfn), tot = ws.reduce(function(a,b){ return a + b; }, 0), r = Math.random() * tot;
  for (var i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
/* Picks n lenses: alternating familiar and less familiar, at most one per tradition,
   favouring lenses you have not tried yet, and offering one "different door" from a
   tradition you grew up with when there is an untried strand. */
function pickLenses(n, keepIds, avoidIds){
  var counts = lensCounts();
  var taken = {}, fams = {};
  keepIds.forEach(function(id){ taken[id] = true; fams[LENS[id].fam] = true; });
  (avoidIds || []).forEach(function(id){ taken[id] = true; });
  var picks = [];
  var weight = function(l){ return 1 / (1 + 1.6 * (counts[l.id] || 0)); };
  var grew = state.settings.grewUp;
  if (grew.length) {
    var doors = LENSES.filter(function(l){ return grew.indexOf(l.fam) >= 0 && !taken[l.id] && !counts[l.id] && !fams[l.fam]; });
    var already = keepIds.some(function(id){ return grew.indexOf(LENS[id].fam) >= 0; });
    if (doors.length && !already && picks.length < n) {
      var d = wpick(doors, weight); picks.push(d.id); taken[d.id] = true; fams[d.fam] = true;
    }
  }
  var guard = 0;
  while (picks.length < n && guard++ < 50) {
    var all = keepIds.concat(picks);
    var fam = all.filter(function(id){ return LENS[id].known; }).length;
    var wantKnown = fam < Math.ceil((all.length + 1) / 2);
    var pool = LENSES.filter(function(l){ return !taken[l.id] && !fams[l.fam] && l.known === wantKnown; });
    if (!pool.length) pool = LENSES.filter(function(l){ return !taken[l.id] && !fams[l.fam]; });
    if (!pool.length) pool = LENSES.filter(function(l){ return !taken[l.id]; });
    if (!pool.length) break;
    var p = wpick(pool, weight); picks.push(p.id); taken[p.id] = true; fams[p.fam] = true;
  }
  return picks;
}

var weSetTheme = false;
function applyTheme(){
  var root = document.documentElement, t = state.settings.theme;
  if (t === 'light' || t === 'dark') { root.setAttribute('data-theme', t); weSetTheme = true; }
  else if (weSetTheme) { root.removeAttribute('data-theme'); weSetTheme = false; }
  var btn = $('theme-btn');
  if (btn) btn.textContent = effectiveTheme() === 'dark' ? 'Use light theme' : 'Use dark theme';
}
function effectiveTheme(){
  var a = document.documentElement.getAttribute('data-theme');
  if (a === 'dark' || a === 'light') return a;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
}

function mapTable(st, f){
  var rows = FAMILY_ORDER.map(function(k){
    var d = st.fam[k], F = FAMILIES[k], tot = d.lands + d.unsure + d.pushes;
    var tried = Object.keys(d.tried).map(function(id){ return LENS[id].short; }).join(', ');
    return '<tr' + (tot ? '' : ' class="untried"') + '><th scope="row">' + swatch(F.hue) + esc(F.name) + '</th>' +
      '<td class="n">' + d.lands + '</td><td class="n">' + d.unsure + '</td><td class="n">' + d.pushes + '</td>' +
      '<td>' + (tried ? esc(tried) : 'Not tried yet') + '</td></tr>';
  }).join('');
  return '<h3 style="margin-bottom:10px">In words</h3><div class="table-wrap"><table>' +
    '<caption>Marks by tradition' + (f !== 'all' ? ', ' + esc(themeLower(f)) + ' only' : '') + '</caption>' +
    '<thead><tr><th scope="col">Tradition</th><th scope="col" class="n">Landed</th><th scope="col" class="n">Not sure</th><th scope="col" class="n">Pushed back</th><th scope="col">Strands tried</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}
function lensTable(st){
  var ids = Object.keys(st.lens);
  if (!ids.length) return '';
  ids.sort(function(a,b){
    var fa = FAMILY_ORDER.indexOf(LENS[a].fam), fb = FAMILY_ORDER.indexOf(LENS[b].fam);
    return fa - fb || LENS[a].short.localeCompare(LENS[b].short);
  });
  var rows = ids.map(function(id){
    var s = st.lens[id], L = LENS[id];
    return '<tr><th scope="row">' + swatch(FAMILIES[L.fam].hue) + esc(L.short) + '</th><td class="n">' + s.lands + '</td><td class="n">' + s.unsure + '</td><td class="n">' + s.pushes + '</td></tr>';
  }).join('');
  return '<div class="table-wrap" style="margin-top:16px"><table><caption>Marks by lens</caption>' +
    '<thead><tr><th scope="col">Lens</th><th scope="col" class="n">Landed</th><th scope="col" class="n">Not sure</th><th scope="col" class="n">Pushed back</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}

function themeList(obj){
  return Object.keys(obj).map(themeLower).join(' and ');
}
function patternBlock(st, f){
  var qs = [];
  var ids = Object.keys(st.lens);
  ids.forEach(function(id){
    var s = st.lens[id], n = LENS[id].short;
    if (s.lands >= 2 && !s.pushes) qs.push(n + ' has landed ' + s.lands + ' times. What do those moments have in common?');
    if (s.pushes >= 2) qs.push('You have pushed back on ' + n + ' ' + s.pushes + ' times. What, specifically, does it get wrong about your life?');
    if (s.lands && s.pushes) qs.push(n + ' landed on ' + themeList(s.th.lands) + ' but you pushed back on ' + themeList(s.th.pushes) + '. What is different about those moments?');
  });
  FAMILY_ORDER.forEach(function(k){
    var tried = Object.keys(st.fam[k].tried);
    if (tried.length < 2) return;
    var landed = tried.filter(function(id){ return st.lens[id].lands; });
    var pushed = tried.filter(function(id){ return st.lens[id].pushes && !st.lens[id].lands; });
    if (landed.length && pushed.length) qs.push('Within ' + FAMILIES[k].name + ', ' + LENS[landed[0]].short + ' landed and you pushed back on ' + LENS[pushed[0]].short + '. What separates them for you?');
  });
  if (qs.length < 3) {
    ids.forEach(function(id){
      var s = st.lens[id], n = LENS[id].short;
      if (qs.length >= 4) return;
      if (s.lands === 1 && !s.pushes) qs.push(n + ' landed on a moment about ' + themeList(s.th.lands) + '. Would it hold up on a different kind of moment?');
      else if (s.pushes === 1 && !s.lands) qs.push('You pushed back on ' + n + ' on a moment about ' + themeList(s.th.pushes) + '. Would it read differently on another theme, or is the disagreement deeper?');
    });
  }
  var grew = state.settings.grewUp;
  grew.forEach(function(k){
    var untried = LENSES.filter(function(l){ return l.fam === k && !st.fam[k].tried[l.id]; });
    if (untried.length && qs.length < 6) qs.push('You grew up around ' + FAMILIES[k].name + '. You have not yet tried ' + untried.map(function(l){ return l.short; }).slice(0,3).join(', ') + '. Which of those sounds least like the version you knew?');
  });
  qs = qs.slice(0, 6);
  var caveat = st.own < 5
    ? 'Based on ' + plural(st.moments, 'moment') + (st.examples ? ', ' + st.examples + ' of them examples' : '') + '. Patterns need more lived material than that, so treat these as questions to sit with rather than findings.'
    : 'Based on ' + plural(st.moments, 'moment') + '. Prism asks rather than concludes: the answers are yours to work out.';
  return '<h3 style="margin-bottom:10px">Questions the pattern raises</h3><p class="caveat">' + esc(caveat) + '</p>' +
    (qs.length ? '<ul class="qlist">' + qs.map(function(q){ return '<li>' + esc(q) + '</li>'; }).join('') + '</ul>'
               : '<p class="muted">No patterns yet. They appear once a few moments have been marked.</p>');
}
function byThemeBlock(f){
  var groups = {};
  state.moments.forEach(function(m){
    if (f !== 'all' && m.theme !== f) return;
    var g = groups[m.theme] || (groups[m.theme] = {n:0, lands:{}, unsure:{}, pushes:{}});
    g.n++;
    m.lenses.forEach(function(r){ if (r.mark) g[r.mark][r.id] = (g[r.mark][r.id] || 0) + 1; });
  });
  var keys = THEMES.map(function(t){ return t[0]; }).filter(function(k){ return groups[k]; });
  if (!keys.length) return '';
  var line = function(obj, label){
    var ids = Object.keys(obj); if (!ids.length) return '';
    return '<p><b>' + label + '</b>' + esc(ids.map(function(id){ return LENS[id].short + (obj[id] > 1 ? ' (' + obj[id] + ')' : ''); }).join(', ')) + '</p>';
  };
  return '<div class="section" style="margin-top:28px"><h3>By theme</h3><ul class="bytheme">' + keys.map(function(k){
    var g = groups[k];
    return '<li><h4>' + esc(THEME_LABEL[k]) + '<span class="label">' + plural(g.n, 'moment') + '</span></h4>' +
      line(g.lands, 'Landed') + line(g.unsure, 'Not sure') + line(g.pushes, 'Pushed back') + '</li>';
  }).join('') + '</ul></div>';
}

/* The prism drawing. Units in the SVG equal CSS pixels, so text stays readable at any width. */
var lastBenchW = 0;
function drawPrism(){
  var holder = $('bench-svg'); if (!holder || !currentStats) return;
  var W = Math.max(290, Math.round(holder.clientWidth || 340));
  lastBenchW = W;
  holder.innerHTML = prismSVG(currentStats, W, animateNext);
  animateNext = false;
}
function f1(n){ return Math.round(n * 10) / 10; }
function pt(p){ return f1(p[0]) + ',' + f1(p[1]); }
function lerp(a, b, t){ return [a[0] + (b[0]-a[0]) * t, a[1] + (b[1]-a[1]) * t]; }

function prismSVG(st, W, animate){
  var N = FAMILY_ORDER.length, wide = W >= 720;
  var H, cx, cy, side, bandEnd, labelX, top, bottom, refX, refTop, refBottom, nameSize, metaSize;
  if (wide) {
    H = 560; side = Math.min(210, W * 0.2); cx = W * 0.3; cy = 300;
    bandEnd = W - 270; labelX = bandEnd + 16; top = 40; bottom = H - 22;
    refX = 132; refTop = 52; refBottom = 206; nameSize = 16; metaSize = 12;
  } else {
    H = N * 54 + 54; side = Math.min(104, W * 0.26); cx = Math.max(side * 0.62, W * 0.18); cy = H / 2;
    bandEnd = W - 150; labelX = W - 142; top = 36; bottom = H - 16;
    refX = 10; refTop = 44; refBottom = cy - 120; nameSize = 14; metaSize = 11;
  }
  var h = side * Math.sqrt(3) / 2;
  var apex = [cx, cy - 2*h/3], bl = [cx - side/2, cy + h/3], br = [cx + side/2, cy + h/3];
  var entry = lerp(bl, apex, 0.42);
  var slot = (bottom - top) / N;
  var maxLands = 1;
  FAMILY_ORDER.forEach(function(k){ maxLands = Math.max(maxLands, st.fam[k].lands); });
  var beamY = wide ? cy + 36 : cy + 22;
  var bw = st.moments ? Math.min(14, 2.5 + st.moments * 1.6) : 1.5;

  var s = [];
  s.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-labelledby="prism-title prism-desc"' + (animate ? ' class="animate"' : '') + '>');
  s.push('<title id="prism-title">Resonance prism</title>');
  s.push('<desc id="prism-desc">' + esc(prismDesc(st)) + '</desc>');
  s.push('<defs>' +
    '<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".55" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#9fb4ff" stop-opacity=".12"/></linearGradient>' +
    '<linearGradient id="beamfade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>' +
    '<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="' + W + '" height="' + H + '"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '</defs>');

  /* reflected pushback rays */
  var pf = FAMILY_ORDER.filter(function(k){ return st.fam[k].pushes > 0; });
  if (pf.length) {
    s.push('<text class="t-cap" x="' + (wide ? 16 : 10) + '" y="' + (wide ? 26 : 24) + '" font-size="11">PUSHBACK, REFLECTED</text>');
    s.push('<g class="refl">');
    pf.forEach(function(k, i){
      var y = pf.length === 1 ? (refTop + refBottom) / 2 : refTop + i * (refBottom - refTop) / (pf.length - 1);
      var x = wide ? refX : refX + (i % 2) * 6;
      var w = Math.min(10, 1.2 + 2.2 * st.fam[k].pushes);
      s.push('<line x1="' + f1(entry[0]) + '" y1="' + f1(entry[1]) + '" x2="' + f1(x) + '" y2="' + f1(y) + '" stroke="' + FAMILIES[k].hue + '" stroke-width="' + f1(w) + '" stroke-linecap="round" opacity=".85"/>');
      if (wide) s.push('<text class="t-meta" x="' + (x - 10) + '" y="' + f1(y + 4) + '" font-size="12" text-anchor="end">' + esc(FAMILIES[k].short) + ' ' + st.fam[k].pushes + '</text>');
    });
    s.push('</g>');
  }

  /* incoming white light */
  s.push('<line x1="0" y1="' + f1(beamY) + '" x2="' + f1(entry[0]) + '" y2="' + f1(entry[1]) + '" stroke="url(#beamfade)" stroke-width="' + f1(bw) + '" stroke-linecap="round" filter="url(#glow)"' + (st.moments ? '' : ' stroke-dasharray="3 6"') + '/>');
  if (wide) s.push('<text class="t-cap" x="16" y="' + f1(beamY + bw/2 + 20) + '" font-size="11">WHITE LIGHT: ' + esc(plural(st.moments, 'moment').toUpperCase()) + '</text>');
  else s.push('<text class="t-cap" x="8" y="' + f1(bl[1] + 26) + '" font-size="11">WHITE LIGHT</text><text class="t-cap" x="8" y="' + f1(bl[1] + 40) + '" font-size="11">' + esc(plural(st.moments, 'moment').toUpperCase()) + '</text>');

  /* exit points along the far face */
  var exits = FAMILY_ORDER.map(function(k, i){ return 0.36 + (i / (N - 1)) * 0.3; });
  var e0 = lerp(apex, br, exits[0]), eN = lerp(apex, br, exits[N-1]);
  s.push('<polygon points="' + pt(entry) + ' ' + pt(e0) + ' ' + pt(eN) + '" fill="#fff" opacity="' + (st.moments ? .16 : .05) + '"/>');
  s.push('<polygon points="' + pt(apex) + ' ' + pt(br) + ' ' + pt(bl) + '" fill="url(#glass)" stroke="rgba(255,255,255,.7)" stroke-width="1.2" stroke-linejoin="round"/>');
  s.push('<line x1="' + f1(apex[0]) + '" y1="' + f1(apex[1] + 6) + '" x2="' + f1(bl[0] + 8) + '" y2="' + f1(bl[1] - 3) + '" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>');

  /* spectrum bands */
  s.push('<g style="mix-blend-mode:screen">');
  FAMILY_ORDER.forEach(function(k, i){
    var d = st.fam[k], F = FAMILIES[k], tot = d.lands + d.unsure + d.pushes;
    var yc = top + slot * (i + 0.5);
    var a = lerp(apex, br, exits[i] - 0.008), b = lerp(apex, br, exits[i] + 0.008), m = lerp(apex, br, exits[i]);
    if (!tot) {
      s.push('<line class="band" style="--i:' + i + '" x1="' + f1(m[0]) + '" y1="' + f1(m[1]) + '" x2="' + f1(bandEnd) + '" y2="' + f1(yc) + '" stroke="' + F.hue + '" stroke-opacity=".38" stroke-width="1" stroke-dasharray="2 5"/>');
    } else {
      var hh = d.lands ? 3 + (slot * 0.74 - 3) * (d.lands / maxLands) : 1.4;
      var op = d.lands ? 0.38 + 0.62 * (d.lands / tot) : 0.3;
      s.push('<polygon class="band" style="--i:' + i + '" points="' + pt(a) + ' ' + pt(b) + ' ' + f1(bandEnd) + ',' + f1(yc + hh/2) + ' ' + f1(bandEnd) + ',' + f1(yc - hh/2) + '" fill="' + F.hue + '" fill-opacity="' + f1(op * 100) / 100 + '"/>');
    }
  });
  s.push('</g>');

  /* labels */
  FAMILY_ORDER.forEach(function(k, i){
    var d = st.fam[k], F = FAMILIES[k], tot = d.lands + d.unsure + d.pushes;
    var yc = top + slot * (i + 0.5);
    var parts = [];
    if (d.lands) parts.push(d.lands + ' landed');
    if (d.unsure) parts.push(d.unsure + ' not sure');
    if (d.pushes) parts.push(d.pushes + ' pushed back');
    var meta = tot ? parts : ['not tried yet'];
    var lines = [];
    if (wide || meta.join(' · ').length <= 19) lines = [meta.join(' · ')];
    else { lines = [meta.slice(0, Math.min(2, meta.length - 1) || 1).join(' · ')]; var rest = meta.slice(lines[0].split(' · ').length); if (rest.length) lines.push(rest.join(' · ')); }
    var y0 = yc - (lines.length > 1 ? 9 : 3);
    s.push('<text class="t-name" x="' + f1(labelX) + '" y="' + f1(y0) + '" font-size="' + nameSize + '"' + (tot ? '' : ' opacity=".6"') + '>' + esc(F.short) + '</text>');
    lines.forEach(function(ln, j){
      s.push('<text class="t-meta" x="' + f1(labelX) + '" y="' + f1(y0 + metaSize + 4 + j * (metaSize + 2)) + '" font-size="' + metaSize + '">' + esc(ln) + '</text>');
    });
  });
  s.push('</svg>');
  return s.join('');
}
function prismDesc(st){
  if (!st.moments) return 'No moments marked yet, so the light has not split.';
  var landed = FAMILY_ORDER.filter(function(k){ return st.fam[k].lands; }).map(function(k){ return FAMILIES[k].name + ' ' + st.fam[k].lands; });
  var pushed = FAMILY_ORDER.filter(function(k){ return st.fam[k].pushes; }).map(function(k){ return FAMILIES[k].name + ' ' + st.fam[k].pushes; });
  return 'White light from ' + plural(st.moments, 'moment') + ' splits into bands by tradition. Landed: ' + (landed.join(', ') || 'none') + '. Pushed back: ' + (pushed.join(', ') || 'none') + '. The tables below give every figure.';
}

/* ------------------------------------------------------------------ */
/* View: bring a moment                                                */

function newDraft(){
  return {stage:'form', what:'', felt:'', theme:'', date: todayISO(), lenses:[]};
}

function renderNew(){
  if (!state.draft && lastSaved) return renderSaved();
  if (!state.draft) { state.draft = newDraft(); save(); }
  if (state.draft.stage === 'lenses') return renderLensStage();
  var d = state.draft;
  var grew = state.settings.grewUp.map(function(k){ return FAMILIES[k].name; });
  var queued = state.queued.map(function(id){ return LENS[id].short; });
  view.innerHTML =
    '<section class="view" aria-labelledby="h-new">' +
    '<div class="view-head"><h2 id="h-new" tabindex="-1">Bring a moment</h2>' +
    '<p class="lede">One real thing that happened to you, recently or long ago. A few sentences is plenty. Next, four traditions will each frame it their own way.</p></div>' +
    '<div class="new-grid"><form id="moment-form" novalidate>' +
      '<div class="field"><label for="m-what">What happened</label><span class="hint" id="m-what-hint">Specific beats general: "my sister didn\'t call back after the scan" rather than "family stuff".</span>' +
        '<textarea id="m-what" rows="5" aria-describedby="m-what-hint">' + esc(d.what) + '</textarea></div>' +
      '<div class="field"><label for="m-felt">What it felt like <span class="hint">(optional)</span></label>' +
        '<textarea id="m-felt" rows="2">' + esc(d.felt) + '</textarea></div>' +
      '<fieldset class="chips form-chips"><legend>What kind of moment was it?</legend>' +
        THEMES.map(function(t){
          return '<span class="chip"><input type="radio" name="mtheme" id="mt-' + t[0] + '" value="' + t[0] + '"' + (d.theme === t[0] ? ' checked' : '') + '><label for="mt-' + t[0] + '">' + esc(t[1]) + '</label></span>';
        }).join('') +
      '</fieldset>' +
      '<div class="field"><label for="m-date">When</label><input type="date" id="m-date" value="' + esc(d.date) + '"></div>' +
      '<p class="err" id="form-err" role="alert"></p>' +
      '<div class="btn-row"><button type="submit" class="btn primary">Pass it through the lenses</button>' +
      (d.what || d.felt ? '<button type="button" class="btn quiet" data-act="discard-draft">Clear this form</button>' : '') + '</div>' +
    '</form>' +
    '<aside class="aside" aria-label="Notes">' +
      '<h3>Before you start</h3>' +
      '<ul><li>You do not need to know what the moment means. Prism will not tell you either.</li>' +
      '<li>Each lens shows how one tradition tends to frame this kind of moment, and the questions it would ask you.</li>' +
      '<li>You mark each lens: lands, not sure, or pushes back. Pushback is as useful as a match.</li></ul>' +
      '<p class="muted">' + (grew.length ? 'Traditions you grew up with: ' + esc(grew.join(', ')) + '. One of their less familiar strands will usually be in the mix.' : 'If you grew up with a tradition, add it under Different doors and Prism will offer its less familiar strands.') + '</p>' +
      (queued.length ? '<p><strong>Waiting for this moment:</strong> ' + esc(queued.join(', ')) + '</p>' : '') +
    '</aside></div></section>';
}

function renderLensStage(){
  var d = state.draft;
  var cards = d.lenses.map(function(r){ return lensCard(r, d.theme); }).join('');
  view.innerHTML =
    '<section class="view" aria-labelledby="h-lenses">' +
    '<div class="view-head"><h2 id="h-lenses" tabindex="-1">Through the lenses</h2>' +
    '<p class="lede">Each lens shows how one tradition tends to frame a moment like this, and what it would ask you. Mark how each one sits with you. Pushing back is as useful as a match: knowing what does not fit is part of knowing what does.</p></div>' +
    '<div class="beam">' +
      '<div class="beam-meta"><span class="label">Your moment</span><span class="label">' + esc(fmtDate(d.date)) + '</span><span class="tag">' + esc(THEME_LABEL[d.theme]) + '</span></div>' +
      '<p class="beam-what">' + esc(d.what) + '</p>' +
      (d.felt ? '<p class="beam-felt">Felt: ' + esc(d.felt) + '</p>' : '') +
      '<button type="button" class="btn small" data-act="edit-moment">Edit the moment</button>' +
      beamArt() +
    '</div>' +
    '<div class="lens-tools">' +
      '<button type="button" class="btn quiet" data-act="reshuffle">Reshuffle unmarked lenses</button>' +
      '<button type="button" class="btn quiet" data-act="browse-toggle" aria-expanded="' + browseOpen + '" aria-controls="browse">' + (browseOpen ? 'Hide all lenses' : 'Browse all lenses') + '</button>' +
      '<span class="muted" id="lens-count">' + plural(d.lenses.length, 'lens', 'lenses') + ' on the table</span>' +
    '</div>' +
    '<div id="browse" class="browse"' + (browseOpen ? '' : ' hidden') + '>' + browseHTML() + '</div>' +
    '<div class="lens-grid" id="lens-grid">' + cards + '</div>' +
    '<div class="save-bar"><button type="button" class="btn primary" data-act="save-moment">Save this moment</button>' +
    '<p class="err" id="save-err" role="alert"></p></div>' +
    '</section>';
}

function beamArt(){
  var cols = FAMILY_ORDER.map(function(k){ return FAMILIES[k].hue; });
  var lines = cols.map(function(c, i){
    var y = 18 + i * 5.5;
    return '<line x1="128" y1="' + (44 + i * 0.9).toFixed(1) + '" x2="200" y2="' + y.toFixed(1) + '" stroke="' + c + '" stroke-width="1.6" opacity=".9"/>';
  }).join('');
  return '<svg class="beam-art" viewBox="0 0 200 96" aria-hidden="true" focusable="false">' +
    '<line x1="0" y1="56" x2="100" y2="48" stroke="#fff" stroke-width="2.4"/>' +
    lines +
    '<path d="M114 14 140 76H88Z" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.75)" stroke-width="1.1"/></svg>';
}

function lensCard(r, theme){
  var L = LENS[r.id], F = FAMILIES[L.fam];
  var tt = L.t[theme] || L.t.change;
  var qs = [tt[1], L.ask];
  var grew = state.settings.grewUp.indexOf(L.fam) >= 0;
  var id = L.id;
  return '<article class="lens" id="card-' + id + '" data-mark="' + (r.mark || '') + '" aria-labelledby="ln-' + id + '">' +
    '<div class="lens-head">' + swatch(F.hue) + '<span class="label">' + esc(F.name) + '</span>' +
      (grew ? '<span class="tag">A different door</span>' : '') + '</div>' +
    '<h3 class="lens-name" id="ln-' + id + '" tabindex="-1">' + esc(L.name) + '</h3>' +
    '<p class="idea">' + esc(L.idea) + '</p>' +
    '<p class="term"><dfn>' + esc(L.term) + '</dfn>: ' + esc(L.gloss) + '</p>' +
    (L.quote ? '<blockquote class="quote"><p>' + esc(L.quote.text) + '</p><footer>' + esc(L.quote.by) + '</footer></blockquote>' : '') +
    '<div class="frame"><p class="label">How it tends to frame ' + esc(themeLower(theme)) + '</p><p class="frame-text">' + esc(tt[0]) + '</p></div>' +
    '<fieldset class="qs"><legend class="label">Questions it would ask you. Pick one to answer, if you like</legend>' +
      qs.map(function(q, i){
        return '<div class="q"><input type="radio" name="qq-' + id + '" id="qq-' + id + '-' + i + '" value="' + i + '" data-lens="' + id + '"' + (r.q === i ? ' checked' : '') + '><label for="qq-' + id + '-' + i + '">' + esc(q) + '</label></div>';
      }).join('') +
    '</fieldset>' +
    '<div class="ans"><label for="ans-' + id + '" class="hint">Your answer to the chosen question (optional)</label>' +
      '<textarea id="ans-' + id + '" data-lens="' + id + '" rows="3" placeholder="A sentence or two. If you are pushing back, saying why is useful.">' + esc(r.answer) + '</textarea></div>' +
    (L.note ? '<p class="note">' + esc(L.note) + '</p>' : '') +
    '<fieldset class="marks"><legend>How does this sit with you?<span class="hint">Required. Any answer counts, pushback included.</span></legend>' +
      MARKS.map(function(m){
        return '<span class="mark"><input type="radio" name="mk-' + id + '" id="mk-' + id + '-' + m[0] + '" value="' + m[0] + '" data-lens="' + id + '"' + (r.mark === m[0] ? ' checked' : '') + '><label for="mk-' + id + '-' + m[0] + '">' + markIcon(m[0]) + esc(m[1]) + '</label></span>';
      }).join('') +
    '</fieldset>' +
    '<div class="lens-foot"><button type="button" class="btn link" data-act="remove-lens" data-id="' + id + '">Remove this lens from the moment</button></div>' +
    '</article>';
}

function browseHTML(){
  var on = {}; (state.draft ? state.draft.lenses : []).forEach(function(r){ on[r.id] = true; });
  var counts = lensCounts();
  return '<h3 style="margin-bottom:6px">All ' + LENSES.length + ' lenses</h3><p class="muted" style="margin-bottom:8px">Grouped by tradition, in alphabetical order.</p>' +
    FAMILY_ORDER.map(function(k){
      var ls = LENSES.filter(function(l){ return l.fam === k; });
      return '<div class="browse-fam"><h4>' + swatch(FAMILIES[k].hue) + esc(FAMILIES[k].name) + '</h4><ul>' + ls.map(function(l){
        var first = l.idea.split('. ')[0] + '.';
        return '<li><div><strong>' + esc(l.name) + '</strong>' + (counts[l.id] ? ' <span class="label">used ' + counts[l.id] + 'x</span>' : '') + '<p>' + esc(first) + '</p></div>' +
          (on[l.id] ? '<span class="muted">On the table</span>' : '<button type="button" class="btn small" data-act="add-lens" data-id="' + l.id + '">Add ' + esc(l.short) + ' to this moment</button>') + '</li>';

}

function renderSaved(){
  var m = state.moments.filter(function(x){ return x.id === lastSaved; })[0];
  if (!m) { lastSaved = null; return renderNew(); }
  var c = {lands:0, unsure:0, pushes:0};
  m.lenses.forEach(function(r){ if (r.mark) c[r.mark]++; });
  view.innerHTML = '<section class="view" aria-labelledby="h-saved"><div class="saved">' +
    '<h2 id="h-saved" tabindex="-1">Saved</h2>' +
    '<p>' + esc(THEME_LABEL[m.theme]) + ', ' + esc(fmtDate(m.date)) + '. ' + plural(m.lenses.length, 'lens', 'lenses') + ' marked: ' + c.lands + ' landed, ' + c.unsure + ' not sure, ' + c.pushes + ' pushed back.</p>' +
    '<p class="muted">One moment is a single reading. The map becomes worth looking at after several, across different kinds of moment.</p>' +
    '<div class="btn-row"><button type="button" class="btn primary" data-act="nav" data-view="map">See the resonance map</button>' +
    '<button type="button" class="btn" data-act="another">Bring another moment</button>' +

function grewChecks(prefix){
  var g = state.settings.grewUp;

    FAMILY_ORDER.map(function(k){
      var id = prefix + '-' + k;

    }).join('') + '</fieldset>';

function renderDoors(){
  var g = state.settings.grewUp;

}

      '</section>' +
      '<section aria-labelledby="h-export"><h3 id="h-export">Export</h3><p class="muted">Your moments, marks and settings as plain JSON. Copy it somewhere safe to keep a backup or move it to another device.</p>' +
        '<div class="btn-row"><button type="button" class="btn" data-act="export">Show my data as JSON</button></div>' +
        '<label for="export-box" class="hint">Exported data</label><textarea id="export-box" readonly rows="8" placeholder="Press &quot;Show my data as JSON&quot;"></textarea>' +
        '<div class="btn-row"><button type="button" class="btn quiet" data-act="copy">Copy the JSON</button><span id="copy-status" class="ok" role="status"></span></div></section>' +
      '<section aria-labelledby="h-import"><h3 id="h-import">Import</h3><p class="muted">Paste JSON exported from Prism. It replaces everything currently stored here.</p>' +
        '<label for="import-box" class="hint">JSON to import</label><textarea id="import-box" rows="8"></textarea>' +
        '<div class="btn-row"><button type="button" class="btn" data-act="import">Import and replace my data</button></div><p id="import-status" role="status"></p></section>' +
      '<section aria-labelledby="h-erase" style="grid-column:1 / -1"><h3 id="h-erase">Erase</h3>' +
        '<p class="muted">Removes every moment, mark and setting Prism has stored on this device. Export first if you want a copy.</p>' +
        (eraseArmed
          ? '<div class="confirm" role="group" aria-label="Confirm erase"><p>This cannot be undone. Erase everything?</p><button type="button" class="btn danger solid" data-act="erase-yes" id="erase-yes">Yes, erase everything</button><button type="button" class="btn" data-act="erase-no">Cancel</button></div>'
          : '<div class="btn-row"><button type="button" class="btn danger" data-act="erase" id="erase-btn">Erase everything on this device</button></div>') +
        '<p id="erase-status" class="ok" role="status"></p>' +
      '</section>' +
    '</div></section>';
}

/* ------------------------------------------------------------------ */
/* Actions                                                             */
/* ------------------------------------------------------------------ */

function draftLens(id){
  if (!state.draft) return null;
  for (var i = 0; i < state.draft.lenses.length; i++) if (state.draft.lenses[i].id === id) return state.draft.lenses[i];
  return null;
}
function updateLensCount(){
  var el = $('lens-count'); if (el && state.draft) el.textContent = plural(state.draft.lenses.length, 'lens', 'lenses') + ' on the table';
}
function refreshGrid(focusId){
  var grid = $('lens-grid'); if (!grid || !state.draft) return;
  grid.innerHTML = state.draft.lenses.map(function(r){ return lensCard(r, state.draft.theme); }).join('');
  var br = $('browse'); if (br) br.innerHTML = browseHTML();
  updateLensCount();
  if (focusId) { var h = $('ln-' + focusId); if (h) h.focus(); }
}

function goToLenses(){
  var d = state.draft;
  var err = $('form-err');
  d.what = ($('m-what').value || '').trim();
  d.felt = ($('m-felt').value || '').trim();
  d.date = $('m-date').value || todayISO();
  if (!d.what) { err.textContent = 'Write a sentence or two about what happened first.'; $('m-what').focus(); return; }
  if (!d.theme) { err.textContent = 'Pick the kind of moment it was, so the lenses can frame it.'; var r = $('mt-loss'); if (r) r.focus(); return; }
  if (!d.lenses.length) {
    var queued = state.queued.filter(function(id){ return LENS[id]; });
    var picks = pickLenses(Math.max(0, 4 - queued.length), queued, []);
    d.lenses = queued.concat(picks).map(function(id){ return {id:id, mark:null, q:0, answer:''}; });
    state.queued = [];
  }
  d.stage = 'lenses';
  save(); render();
  var h = $('h-lenses'); if (h) h.focus({preventScroll:true});
  try { window.scrollTo({top:0}); } catch (e) {}
}

function saveMoment(){
  var d = state.draft, err = $('save-err');
  if (!d.lenses.length) { err.textContent = 'Add at least one lens before saving.'; return; }
  var missing = d.lenses.filter(function(r){ return !r.mark; });
  if (missing.length) {
    err.textContent = 'Mark every lens before saving (lands, not sure or pushes back). Still to mark: ' + missing.map(function(r){ return LENS[r.id].short; }).join(', ') + '.';
    var first = $('mk-' + missing[0].id + '-lands'); if (first) first.focus();
    return;
  }
  var m = {id:uid(), example:false, created:new Date().toISOString(), date:d.date, theme:d.theme, what:d.what, felt:d.felt,
    lenses: d.lenses.map(function(r){
      var L = LENS[r.id], tt = L.t[d.theme] || L.t.change;
      return {id:r.id, mark:r.mark, q:r.q, question: r.answer ? (r.q === 1 ? L.ask : tt[1]) : '', answer:r.answer.trim()};
    })};
  state.moments.push(m);
  state.draft = null; browseOpen = false; lastSaved = m.id;
  save(); render();
  var h = $('h-saved'); if (h) h.focus();
  announce('Moment saved.');
}

function clearExamples(){
  state.moments = state.moments.filter(function(m){ return !m.example; });
  save();
  announce('Examples cleared.');
  lastSaved = null;
  setView('new');
}

function doImport(){
  var box = $('import-box'), out = $('import-status');
  var text = (box.value || '').trim();
  out.className = 'err';
  if (!text) { out.textContent = 'Paste some JSON into the box first.'; box.focus(); return; }
  var obj;
  try { obj = JSON.parse(text); } catch (e) { out.textContent = 'That is not valid JSON, so nothing was changed.'; return; }
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.moments)) { out.textContent = 'That JSON has no list of moments, so nothing was changed.'; return; }
  var next = normalize(obj);
  next.ui = state.ui;
  state = next; lastSaved = null; save();
  render();
  var o2 = $('import-status'); if (o2) { o2.className = 'ok'; o2.textContent = 'Imported ' + plural(state.moments.length, 'moment') + '.'; }
  announce('Import finished.');
}

function doCopy(){
  var box = $('export-box'), st = $('copy-status');
  if (!box.value) box.value = exportJSON();
  var done = function(ok){ st.textContent = ok ? 'Copied.' : 'Selected. Press Ctrl+C or Cmd+C to copy.'; };
  var fallback = function(){ try { box.focus(); box.select(); box.setSelectionRange(0, box.value.length); } catch (e) {} done(false); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(box.value).then(function(){ done(true); }, fallback);
    } else fallback();
  } catch (e) { fallback(); }
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  switch (act) {
    case 'nav':
      if (b.getAttribute('data-view') === 'new' && !state.draft) lastSaved = null;
      pendingDelete = null; eraseArmed = false;
      setView(b.getAttribute('data-view')); break;
    case 'toggle-theme':
      state.settings.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
      save(); applyTheme(); if (state.ui.view === 'map') { animateNext = false; drawPrism(); } if (state.ui.view === 'data') { render(); }
      announce(state.settings.theme === 'dark' ? 'Dark theme on.' : 'Light theme on.'); break;
    case 'clear-examples': clearExamples(); break;
    case 'restore-examples':
      var have = {}; state.moments.forEach(function(m){ have[m.id] = true; });
      exampleMoments().forEach(function(m){ if (!have[m.id]) state.moments.push(m); });
      save(); render(); announce('Example moments added back.'); break;
    case 'discard-draft':
      state.draft = newDraft(); save(); render(); var w = $('m-what'); if (w) w.focus(); break;
    case 'edit-moment':
      state.draft.stage = 'form'; save(); render(); var w2 = $('m-what'); if (w2) w2.focus(); break;
    case 'reshuffle':
      var keep = state.draft.lenses.filter(function(r){ return r.mark || r.answer; });
      var drop = state.draft.lenses.filter(function(r){ return !(r.mark || r.answer); }).map(function(r){ return r.id; });
      var want = Math.max(drop.length, keep.length ? 0 : 4);
      if (!want) { announce('Every lens on the table is marked or answered, so there is nothing to reshuffle.'); var se = $('save-err'); if (se) se.textContent = 'All lenses are marked or answered. Use Browse all lenses to add more.'; break; }
      var fresh = pickLenses(want, keep.map(function(r){ return r.id; }), drop);
      state.draft.lenses = keep.concat(fresh.map(function(x){ return {id:x, mark:null, q:0, answer:''}; }));
      save(); refreshGrid();
      announce('Reshuffled. New lenses: ' + fresh.map(function(x){ return LENS[x].short; }).join(', ') + '.'); break;
    case 'browse-toggle':
      browseOpen = !browseOpen;
      var br = $('browse'); br.hidden = !browseOpen; if (browseOpen) br.innerHTML = browseHTML();
      b.setAttribute('aria-expanded', String(browseOpen)); b.textContent = browseOpen ? 'Hide all lenses' : 'Browse all lenses'; break;
    case 'add-lens':
      if (!draftLens(id)) state.draft.lenses.push({id:id, mark:null, q:0, answer:''});
      save(); refreshGrid(id); announce(LENS[id].short + ' added.'); break;
    case 'remove-lens':
      var idx = state.draft.lenses.findIndex(function(r){ return r.id === id; });
      state.draft.lenses = state.draft.lenses.filter(function(r){ return r.id !== id; });
      save(); refreshGrid();
      var nxt = state.draft.lenses[Math.min(idx, state.draft.lenses.length - 1)];
      if (nxt) { var hn = $('ln-' + nxt.id); if (hn) hn.focus(); } else { var tb = view.querySelector('[data-act="reshuffle"]'); if (tb) tb.focus(); }
      announce(LENS[id].short + ' removed.'); break;
    case 'save-moment': saveMoment(); break;
    case 'another':
      lastSaved = null; state.draft = newDraft(); save(); render(); var hn2 = $('h-new'); if (hn2) hn2.focus(); break;
    case 'door-use':
      if (state.draft && state.draft.stage === 'lenses') { if (!draftLens(id)) state.draft.lenses.push({id:id, mark:null, q:0, answer:''}); }
      else if (state.queued.indexOf(id) < 0) state.queued.push(id);
      save(); render();
      announce(LENS[id].short + ' will be on the table for your next moment.');
      var nb = view.querySelector('.door-list .btn'); if (nb) nb.focus(); else { var hd = $('h-doors'); if (hd) hd.focus(); }
      break;
    case 'del-moment': pendingDelete = id; render(); var y = view.querySelector('[data-act="del-yes"]'); if (y) y.focus(); break;
    case 'del-no':
      var keepId = pendingDelete; pendingDelete = null; render();
      var back = view.querySelector('[data-act="del-moment"][data-id="' + keepId + '"]'); if (back) back.focus(); break;
    case 'del-yes':
      state.moments = state.moments.filter(function(m){ return m.id !== id; });
      pendingDelete = null; save(); render(); announce('Moment deleted.');
      var hm = $('h-moments'); if (hm) hm.focus(); break;
    case 'export':
      $('export-box').value = exportJSON(); $('copy-status').textContent = ''; $('export-box').focus(); break;
    case 'copy': doCopy(); break;
    case 'import': doImport(); break;
    case 'erase': eraseArmed = true; render(); var ey = $('erase-yes'); if (ey) ey.focus(); break;
    case 'erase-no': eraseArmed = false; render(); var eb = $('erase-btn'); if (eb) eb.focus(); break;
    case 'erase-yes':
      var ui = state.ui;
      state = defaultState(); state.ui = ui; eraseArmed = false; lastSaved = null; browseOpen = false;
      try { localStorage.removeItem(KEY); } catch (err) {}
      save(); render();
      var es = $('erase-status'); if (es) es.textContent = 'Everything has been erased from this device.';
      announce('Everything erased.'); break;
  }
});

document.addEventListener('submit', function(e){
  if (e.target && e.target.id === 'moment-form') { e.preventDefault(); goToLenses(); }
});

document.addEventListener('input', function(e){
  var t = e.target, d = state.draft;
  if (!t || !t.id) return;
  if (d && t.id === 'm-what') { d.what = t.value; save(); }
  else if (d && t.id === 'm-felt') { d.felt = t.value; save(); }
  else if (d && t.id.indexOf('ans-') === 0) { var r = draftLens(t.getAttribute('data-lens')); if (r) { r.answer = t.value; save(); } }
});

document.addEventListener('change', function(e){
  var t = e.target; if (!t) return;
  var d = state.draft;
  if (t.name === 'mapf') { state.ui.mapTheme = t.value; save(); animateNext = true; renderMap(); var c = $('mf-' + t.value); if (c) c.focus(); return; }
  if (t.name === 'mtheme' && d) { d.theme = t.value; save(); var fe = $('form-err'); if (fe) fe.textContent = ''; return; }
  if (t.id === 'm-date' && d) { d.date = t.value || todayISO(); save(); return; }
  if (t.name && t.name.indexOf('mk-') === 0 && d) {
    var r = draftLens(t.getAttribute('data-lens')); if (!r) return;
    r.mark = t.value; save();
    var card = $('card-' + r.id); if (card) card.setAttribute('data-mark', r.mark);
    var se = $('save-err'); if (se && se.textContent) se.textContent = '';
    return;
  }
  if (t.name && t.name.indexOf('qq-') === 0 && d) { var r2 = draftLens(t.getAttribute('data-lens')); if (r2) { r2.q = t.value === '1' ? 1 : 0; save(); } return; }
  if (t.hasAttribute && t.hasAttribute('data-grew')) {
    var k = t.getAttribute('data-grew'), g = state.settings.grewUp.filter(function(x){ return x !== k; });
    if (t.checked) g.push(k);
    state.settings.grewUp = FAMILY_ORDER.filter(function(x){ return g.indexOf(x) >= 0; });
    save();
    if (state.ui.view === 'doors') { var fid = t.id; renderDoors(); var el = $(fid); if (el) el.focus(); }
    return;
  }
  if (t.name === 'tpref') { state.settings.theme = t.value; save(); applyTheme(); return; }
  if (t.id === 'arch-theme') { state.ui.archTheme = t.value; save(); renderMoments(); var s2 = $('arch-theme'); if (s2) s2.focus(); return; }
});

/* Redraw the prism when the bench changes width, so labels keep their size. */
var resizeRaf = 0;
window.addEventListener('resize', function(){
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(function(){
    var holder = $('bench-svg');
    if (holder && Math.abs(holder.clientWidth - lastBenchW) > 24) drawPrism();
  });
});
try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ applyTheme(); });
} catch (e) {}

render();
})();
</script>
